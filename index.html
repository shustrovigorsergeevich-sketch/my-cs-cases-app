<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Pantera Cases</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background: #0b0e17;
      color: #ffffff;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* HEADER */
    header {
      height: 60px;
      padding: 0 16px;
      background: #141927;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #232c43;
      flex-shrink: 0;
      z-index: 100;
    }

    .app-title {
      font-weight: 900;
      font-size: 18px;
      background: linear-gradient(90deg, #ff0055, #ff5000);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-transform: uppercase;
    }

    .balance-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #080a11;
      padding: 6px 12px;
      border-radius: 20px;
      border: 1px solid #2a3656;
      cursor: pointer;
    }

    .balance-amount {
      font-weight: 700;
      font-size: 14px;
      color: #ffd700;
    }

    .add-btn {
      background: #ff0055;
      color: white;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: bold;
    }

    /* MAIN CONTAINER */
    main {
      flex: 1;
      position: relative;
      overflow-y: auto;
      padding-bottom: 80px;
      z-index: 1;
    }

    .tab-content {
      display: none;
      padding: 16px;
    }

    .tab-content.active {
      display: block;
    }

    /* CASE DISPLAY */
    .case-card {
      width: 100%;
      background: #141927;
      border-radius: 16px;
      padding: 16px;
      text-align: center;
      border: 1px solid #232c43;
      margin-bottom: 16px;
    }

    .case-image-wrap {
      width: 130px;
      height: 130px;
      margin: 0 auto 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle, rgba(255,0,85,0.2) 0%, rgba(0,0,0,0) 70%);
    }

    .case-image-wrap img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .case-title {
      font-size: 20px;
      font-weight: 900;
      margin-bottom: 4px;
    }

    .case-subtitle {
      font-size: 12px;
      color: #8a99ad;
    }

    /* ROULETTE */
    .roulette-wrapper {
      width: 100%;
      height: 95px;
      position: relative;
      overflow: hidden;
      border-radius: 12px;
      background: #080a11;
      border: 2px solid #2a3656;
      margin-bottom: 16px;
      pointer-events: none; /* Предотвращает перекрытие кликов */
    }

    .roulette-wrapper::before {
      content: '';
      position: absolute;
      top: 0;
      bottom: 0;
      left: 50%;
      width: 4px;
      background: #ffd700;
      transform: translateX(-50%);
      z-index: 10;
      box-shadow: 0 0 10px #ffd700;
    }

    .roulette-track {
      display: flex;
      gap: 8px;
      position: absolute;
      top: 8px;
      left: 0;
      will-change: transform;
    }

    .roulette-item {
      width: 78px;
      height: 78px;
      background: #141927;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border: 1px solid #232c43;
      flex-shrink: 0;
    }

    .roulette-item img {
      width: 40px;
      height: 40px;
      object-fit: contain;
    }

    .roulette-item .item-title {
      font-size: 9px;
      color: #aaa;
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 65px;
    }

    .roulette-item .price {
      font-size: 10px;
      color: #ffd700;
      font-weight: 700;
    }

    .open-btn {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, #ff0055, #ff5000);
      color: white;
      font-weight: 900;
      font-size: 16px;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 1px;
      box-shadow: 0 6px 20px rgba(255, 0, 85, 0.4);
      margin-bottom: 20px;
      position: relative;
      z-index: 10;
    }

    .open-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* CASE CONTENTS (СОДЕРЖИМОЕ КЕЙСА) */
    .case-contents-title {
      font-size: 14px;
      font-weight: 800;
      margin-bottom: 12px;
      color: #8a99ad;
      text-transform: uppercase;
    }

    .contents-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .content-card {
      background: #141927;
      border: 1px solid #232c43;
      border-radius: 10px;
      padding: 10px 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .content-card img {
      width: 45px;
      height: 45px;
      object-fit: contain;
      margin-bottom: 6px;
    }

    .content-name {
      font-size: 11px;
      font-weight: 700;
      color: #fff;
    }

    .content-price {
      font-size: 10px;
      color: #ffd700;
      font-weight: 700;
    }

    /* INVENTORY */
    .section-title {
      font-size: 18px;
      font-weight: 800;
      margin-bottom: 14px;
    }

    .inventory-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    .inv-card {
      background: #141927;
      border-radius: 12px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      border: 1px solid #232c43;
    }

    .inv-card img {
      width: 60px;
      height: 60px;
      object-fit: contain;
      margin-bottom: 8px;
    }

    .inv-name {
      font-size: 12px;
      font-weight: 700;
      text-align: center;
      margin-bottom: 2px;
    }

    .inv-price {
      font-size: 11px;
      color: #ffd700;
      margin-bottom: 8px;
      font-weight: 700;
    }

    .inv-btn {
      width: 100%;
      padding: 8px;
      border: none;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 800;
      cursor: pointer;
      background: #ff0055;
      color: white;
    }

    /* DEPOSIT */
    .deposit-card {
      background: #141927;
      border-radius: 12px;
      padding: 16px;
      border: 1px solid #232c43;
    }

    .deposit-input {
      width: 100%;
      padding: 12px;
      background: #080a11;
      border: 1px solid #2a3656;
      border-radius: 8px;
      color: white;
      font-size: 14px;
      margin: 12px 0;
      outline: none;
    }

    .deposit-submit {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: #ffd700;
      color: #000;
      font-weight: 800;
      cursor: pointer;
    }

    /* NAVIGATION */
    nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 60px;
      background: #141927;
      display: flex;
      border-top: 1px solid #232c43;
      z-index: 999;
    }

    .nav-btn {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #5d6b8a;
      background: none;
      border: none;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      gap: 4px;
      -webkit-tap-highlight-color: transparent;
    }

    .nav-btn.active {
      color: #ff0055;
    }

    .nav-icon {
      font-size: 18px;
    }

    /* MODAL */
    .modal {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.85);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 20px;
    }

    .modal-box {
      background: #141927;
      border-radius: 16px;
      padding: 20px;
      width: 100%;
      max-width: 280px;
      text-align: center;
      border: 1px solid #ffd700;
    }

    .modal-box img {
      width: 90px;
      height: 90px;
      object-fit: contain;
      margin: 12px 0;
    }
  </style>
</head>
<body>

  <header>
    <div class="app-title">Pantera Cases</div>
    <div class="balance-badge" onclick="openTab('deposit')">
      <span>⭐</span>
      <span class="balance-amount" id="balance">100</span>
      <div class="add-btn">+</div>
    </div>
  </header>

  <main>
    <!-- ВКЛАДКА: КЕЙСИ -->
    <div id="tab-case" class="tab-content active">
      <div class="case-card">
        <div class="case-image-wrap">
          <img id="caseCoverImg" src="https://cdn-icons-png.flaticon.com/512/616/616490.png" alt="Pantera Case">
        </div>
        <div class="case-title">Pantera Case</div>
        <div class="case-subtitle">Испытай удачу и выбей Telegram NFT Gift</div>
      </div>

      <div class="roulette-wrapper">
        <div class="roulette-track" id="rouletteTrack"></div>
      </div>

      <button class="open-btn" id="openBtn" onclick="spinCase()">Открыть за 100 ⭐</button>

      <div class="case-contents-title">Содержимое кейса (NFT Gifts)</div>
      <div class="contents-grid" id="contentsGrid"></div>
    </div>

    <!-- ВКЛАДКА: ИНВЕНТАРЬ -->
    <div id="tab-profile" class="tab-content">
      <div class="section-title">Ваш инвентарь</div>
      <div class="inventory-grid" id="inventoryGrid"></div>
    </div>

    <!-- ВКЛАДКА: ПОПОЛНЕНИЕ -->
    <div id="tab-deposit" class="tab-content">
      <div class="section-title">Пополнение Stars</div>
      <div class="deposit-card">
        <div style="font-weight: 700; font-size: 14px;">Введите количество Stars</div>
        <input type="number" id="starsInput" class="deposit-input" placeholder="Минимум 100" min="100" value="100" />
        <button class="deposit-submit" onclick="addStars()">Пополнить баланс</button>
      </div>
    </div>
  </main>

  <!-- МОДАЛКА ВЫИГРЫША -->
  <div class="modal" id="winModal">
    <div class="modal-box">
      <h3 style="color: #ffd700;">ВЫ ВЫИГРАЛИ!</h3>
      <img id="winImg" src="" alt="" />
      <div id="winTitle" style="font-weight: 800; font-size: 16px; margin-bottom: 4px;"></div>
      <div id="winPrice" style="color: #ffd700; font-size: 13px; margin-bottom: 16px; font-weight: 700;"></div>
      <button class="open-btn" onclick="closeModal()" style="padding: 12px; font-size: 14px; margin-bottom: 0;">Забрать в инвентарь</button>
    </div>
  </div>

  <nav>
    <button class="nav-btn active" onclick="openTab('case')" id="nav-case">
      <span class="nav-icon">🎁</span>
      <span>Кейсы</span>
    </button>
    <button class="nav-btn" onclick="openTab('profile')" id="nav-profile">
      <span class="nav-icon">🎒</span>
      <span>Инвентарь</span>
    </button>
    <button class="nav-btn" onclick="openTab('deposit')" id="nav-deposit">
      <span class="nav-icon">⭐</span>
      <span>Баланс</span>
    </button>
  </nav>

  <script>
    const tg = window.Telegram ? window.Telegram.WebApp : null;
    if (tg) tg.expand();

    // Список NFT Подарков со стабильными картинками
    const GIFTS = [
      { id: 1, name: "Magic Potion", price: 1500, img: "https://cdn-icons-png.flaticon.com/512/3063/3063822.png" },
      { id: 2, name: "Plush Bear", price: 3500, img: "https://cdn-icons-png.flaticon.com/512/3082/3082006.png" },
      { id: 3, name: "Green Star", price: 50, img: "https://cdn-icons-png.flaticon.com/512/1828/1828884.png" },
      { id: 4, name: "Red Star", price: 150, img: "https://cdn-icons-png.flaticon.com/512/1828/1828614.png" },
      { id: 5, name: "Diamond", price: 5000, img: "https://cdn-icons-png.flaticon.com/512/2909/2909932.png" },
      { id: 6, name: "Heart Gift", price: 25, img: "https://cdn-icons-png.flaticon.com/512/2589/2589175.png" }
    ];

    let balance = 100;
    let inventory = [];
    let isSpinning = false;

    function openTab(tabName) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));

      document.getElementById(`tab-${tabName}`).classList.add('active');
      document.getElementById(`nav-${tabName}`).classList.add('active');

      if (tabName === 'profile') {
        renderInventory();
      }
    }

    function renderCaseContents() {
      const grid = document.getElementById('contentsGrid');
      grid.innerHTML = '';
      GIFTS.forEach(item => {
        const div = document.createElement('div');
        div.className = 'content-card';
        div.innerHTML = `
          <img src="${item.img}" alt="${item.name}">
          <div class="content-name">${item.name}</div>
          <div class="content-price">${item.price} ⭐</div>
        `;
        grid.appendChild(div);
      });
    }
    renderCaseContents();

    function buildRoulette() {
      const track = document.getElementById('rouletteTrack');
      track.innerHTML = '';
      for (let i = 0; i < 45; i++) {
        const item = GIFTS[Math.floor(Math.random() * GIFTS.length)];
        const div = document.createElement('div');
        div.className = 'roulette-item';
        div.innerHTML = `
          <img src="${item.img}" alt="${item.name}">
          <div class="item-title">${item.name}</div>
          <div class="price">${item.price} ⭐</div>
        `;
        track.appendChild(div);
      }
    }
    buildRoulette();

    function spinCase() {
      if (isSpinning) return;
      if (balance < 100) {
        alert("Недостаточно Stars на балансе!");
        openTab('deposit');
        return;
      }

      balance -= 100;
      document.getElementById('balance').innerText = balance;
      isSpinning = true;
      document.getElementById('openBtn').disabled = true;

      const track = document.getElementById('rouletteTrack');
      track.style.transition = 'none';
      track.style.transform = 'translateX(0px)';

      const winIndex = 28 + Math.floor(Math.random() * 5);
      const wonItem = GIFTS[Math.floor(Math.random() * GIFTS.length)];

      const items = track.querySelectorAll('.roulette-item');
      items[winIndex].innerHTML = `
        <img src="${wonItem.img}" alt="${wonItem.name}">
        <div class="item-title">${wonItem.name}</div>
        <div class="price">${wonItem.price} ⭐</div>
      `;

      const itemWidth = 86; 
      const targetOffset = -(winIndex * itemWidth - 130);

      setTimeout(() => {
        track.style.transition = 'transform 4s cubic-bezier(0.12, 0.8, 0.12, 1)';
        track.style.transform = `translateX(${targetOffset}px)`;
      }, 50);

      setTimeout(() => {
        inventory.push(wonItem);
        showModal(wonItem);
        isSpinning = false;
        document.getElementById('openBtn').disabled = false;
      }, 4200);
    }

    function showModal(item) {
      document.getElementById('winImg').src = item.img;
      document.getElementById('winTitle').innerText = item.name;
      document.getElementById('winPrice').innerText = `Ценность: ${item.price} ⭐`;
      document.getElementById('winModal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('winModal').style.display = 'none';
      buildRoulette();
    }

    function renderInventory() {
      const grid = document.getElementById('inventoryGrid');
      if (inventory.length === 0) {
        grid.innerHTML = '<div style="grid-column: span 2; text-align: center; color: #5d6b8a; padding: 30px 0;">Инвентарь пуст.<br>Откройте кейс!</div>';
        return;
      }

      grid.innerHTML = '';
      inventory.forEach((item, index) => {
        const div = document.createElement('div');
        div.className = 'inv-card';
        div.innerHTML = `
          <img src="${item.img}" alt="${item.name}">
          <div class="inv-name">${item.name}</div>
          <div class="inv-price">${item.price} ⭐</div>
          <button class="inv-btn" onclick="sellItem(${index}, ${item.price})">Продать за ${item.price} ⭐</button>
        `;
        grid.appendChild(div);
      });
    }

    function sellItem(index, price) {
      inventory.splice(index, 1);
      balance += price;
      document.getElementById('balance').innerText = balance;
      renderInventory();
    }

    function addStars() {
      const input = document.getElementById('starsInput');
      const val = parseInt(input.value);
      if (val && val >= 100) {
        balance += val;
        document.getElementById('balance').innerText = balance;
        alert(`Баланс пополнен на ${val} Stars!`);
        openTab('case');
      } else {
        alert("Введите минимум 100 Stars");
      }
    }
  </script>
</body>
</html>
