<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Panteracases Mini App</title>
    <!-- Подключаем Telegram WebApp JS -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- TON Connect UI -->
    <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #0f0f11;
            color: #ffffff;
            padding-bottom: 80px;
        }
        /* Шапка */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px;
            background: #18181b;
            border-bottom: 1px solid #27272a;
        }
        .close-btn {
            background: #27272a;
            color: #fff;
            border: none;
            padding: 8px 14px;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
        }
        .balance-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .balance-info {
            background: #27272a;
            padding: 6px 12px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 14px;
            font-weight: 700;
            color: #38bdf8;
        }
        .topup-btn {
            background: #8b5cf6;
            color: #fff;
            border: none;
            padding: 8px 14px;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
        }
        
        /* Основной контент (Сетка кейсов как в Epic Gift) */
        .container {
            padding: 16px;
        }
        .section-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 12px;
        }
        .cases-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }
        .case-card {
            background: #18181b;
            border: 1px solid #27272a;
            border-radius: 20px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .case-card:active {
            transform: scale(0.97);
        }
        .badge {
            position: absolute;
            top: 10px;
            left: 10px;
            background: linear-gradient(135deg, #f43f5e, #fb7185);
            color: white;
            font-size: 10px;
            font-weight: 700;
            padding: 4px 8px;
            border-radius: 6px;
            text-transform: uppercase;
        }
        .case-image {
            width: 100%;
            height: 110px;
            object-fit: contain;
            margin: 15px 0;
        }
        .case-name {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 8px;
        }
        .case-price-btn {
            background: #6366f1;
            color: white;
            border: none;
            padding: 8px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 13px;
            text-align: center;
            width: 100%;
        }

        /* Модальное окно пополнения */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            display: none;
            justify-content: center;
            align-items: flex-end;
            z-index: 100;
        }
        .modal {
            background: #18181b;
            width: 100%;
            max-width: 500px;
            border-radius: 24px 24px 0 0;
            padding: 24px;
            border-top: 1px solid #27272a;
            animation: slideUp 0.3s ease;
        }
        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .modal-close {
            background: none; border: none; color: #a1a1aa; font-size: 20px; cursor: pointer;
        }
        .payment-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        .pay-tab {
            flex: 1;
            background: #27272a;
            border: none;
            padding: 10px;
            border-radius: 12px;
            color: #fff;
            font-weight: 600;
            cursor: pointer;
        }
        .pay-tab.active {
            background: #8b5cf6;
        }
        .pay-section {
            display: none;
        }
        .pay-section.active {
            display: block;
        }
        .input-group {
            margin-bottom: 15px;
        }
        .input-group label {
            display: block;
            font-size: 13px;
            color: #a1a1aa;
            margin-bottom: 6px;
        }
        .input-group input {
            width: 100%;
            background: #27272a;
            border: 1px solid #3f3f46;
            padding: 12px;
            border-radius: 12px;
            color: #fff;
            font-size: 16px;
        }
        .hint {
            font-size: 12px;
            color: #a1a1aa;
            margin-top: 5px;
        }
        .action-btn {
            width: 100%;
            background: #10b981;
            color: #white;
            border: none;
            padding: 14px;
            border-radius: 14px;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
        }
        #ton-connect-button {
            display: flex;
            justify-content: center;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <!-- Шапка приложения -->
    <div class="header">
        <button class="close-btn" onclick="Telegram.WebApp.close()">✕ Закрыть</button>
        <div class="balance-container">
            <div class="balance-info">
                <span>⭐</span> <span id="user-balance">0</span>
            </div>
            <button class="topup-btn" onclick="openModal()">Пополнить</button>
        </div>
    </div>

    <!-- Главная вкладка (Сетка кейсов в стиле Epic Gift) -->
    <div class="container">
        <div class="section-title">Главная</div>
        <div class="cases-grid">
            <!-- Карточка твоего кейса Panteracases -->
            <div class="case-card" onclick="openCase()">
                <div class="badge">Лимитирован</div>
                <img src="https://via.placeholder.com/150" alt="Panteracases" class="case-image">
                <div class="case-name">Panteracases</div>
                <button class="case-price-btn">200 ⭐</button>
            </div>
        </div>
    </div>

    <!-- Модальное окно пополнения -->
    <div class="modal-overlay" id="topupModal" onclick="closeModalOutside(event)">
        <div class="modal">
            <div class="modal-header">
                <h3>Пополнить баланс</h3>
                <button class="modal-close" onclick="closeModal()">✕</button>
            </div>

            <!-- Переключатель методов -->
            <div class="payment-tabs">
                <button class="pay-tab active" onclick="switchTab('stars')">Telegram Stars</button>
                <button class="pay-tab" onclick="switchTab('ton')">TON</button>
            </div>

            <!-- Способ 1: Stars -->
            <div id="section-stars" class="pay-section active">
                <div class="input-group">
                    <label>Количество звезд (мин. 100)</label>
                    <input type="number" id="stars-input" value="200" min="100">
                    <div class="hint">Оплата через официальные счета Telegram</div>
                </div>
                <button class="action-btn" onclick="payWithStars()">Оплатить Stars</button>
            </div>

            <!-- Способ 2: TON -->
            <div id="section-ton" class="pay-section">
                <div class="input-group">
                    <label>Количество TON (мин. 1 TON)</label>
                    <input type="number" id="ton-input" value="1" min="1" step="0.1" oninput="calcTon()">
                    <div class="hint" id="ton-conversion">Курс: 1 TON = 100 ⭐ (Получите: 100 ⭐)</div>
                </div>
                <!-- Кнопка подключения TON Connect кошелька -->
                <div id="ton-connect-button"></div>
                <button class="action-btn" style="background: #38bdf8; margin-top: 15px;" onclick="payWithTon()">Оплатить TON</button>
            </div>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        // Инициализация TON Connect UI (укажи путь к твоему манифесту)
        const tonConnectUI = new TON_CONNECT_UI.TonConnectUI({
            manifestUrl: 'https://твой-домен.com/tonconnect-manifest.json',
            buttonRootId: 'ton-connect-button'
        });

        let userBalance = 0;
        const userId = tg.initDataUnsafe?.user?.id || 12345; // ID пользователя Telegram

        // Управление модальным окном
        function openModal() {
            document.getElementById('topupModal').style.display = 'flex';
        }
        function closeModal() {
            document.getElementById('topupModal').style.display = 'none';
        }
        function closeModalOutside(e) {
            if (e.target.id === 'topupModal') closeModal();
        }

        // Переключение вкладок оплаты
        function switchTab(tab) {
            document.querySelectorAll('.pay-tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.pay-section').forEach(s => s.classList.remove('active'));
            
            if (tab === 'stars') {
                document.querySelectorAll('.pay-tab')[0].classList.add('active');
                document.getElementById('section-stars').classList.add('active');
            } else {
                document.querySelectorAll('.pay-tab')[1].classList.add('active');
                document.getElementById('section-ton').classList.add('active');
            }
        }

        // Конвертация TON в Звезды на лету
        function calcTon() {
            let tonVal = parseFloat(document.getElementById('ton-input').value) || 0;
            let starsVal = Math.floor(tonVal * 100);
            document.getElementById('ton-conversion').innerText = `Курс: 1 TON = 100 ⭐ (Получите: ${starsVal} ⭐)`;
        }

        // Оплата через Stars (запрос на бэкенд за инвойсом)
        async function payWithStars() {
            let count = document.getElementById('stars-input').value;
            if (count < 100) {
                alert('Минимальная сумма: 100 звезд');
                return;
            }
            
            try {
                let response = await fetch('/api/pay-stars', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ userId: userId, starsCount: count })
                });
                let data = await response.json();
                if (data.success) {
                    tg.openInvoice(data.invoiceLink, (status) => {
                        if (status === 'paid') {
                            alert('Успешно оплачено звёздами!');
                            updateBalance();
                            closeModal();
                        }
                    });
                } else {
                    alert('Ошибка: ' + data.error);
                }
            } catch (err) {
                alert('Ошибка соединения с сервером');
            }
        }

        // Оплата через TON
        async function payWithTon() {
            let tonVal = parseFloat(document.getElementById('ton-input').value);
            if (tonVal < 1) {
                alert('Минимальная сумма: 1 TON');
                return;
            }

            if (!tonConnectUI.connected) {
                alert('Сначала подключите ваш TON кошелек!');
                tonConnectUI.openModal();
                return;
            }

            try {
                // Пример транзакции на твой кошелек (адрес укажи тут или бери с бэкенда)
                const transaction = {
                    validUntil: Math.floor(Date.now() / 1000) + 600,
                    messages: [
                        {
                            address: "UQDJZeV0lt18SEQYhcWxpxBjfvAcfrFRMuSWV6R9JirstYXY", 
                            amount: (tonVal * 1000000000).toString() // переводим в нанотоны
                        }
                    ]
                };

                const result = await tonConnectUI.sendTransaction(transaction);
                
                // Отправляем подтверждение на бэкенд
                let response = await fetch('/api/pay-ton', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ userId: userId, tonAmount: tonVal, txHash: result.boc })
                });
                let data = await response.json();
                
                if (data.success) {
                    alert(`Успешно! Зачислено ${data.addedStars} ⭐`);
                    updateBalance();
                    closeModal();
                }
            } catch (err) {
                console.log(err);
                alert('Транзакция отменена или произошла ошибка');
            }
        }

        // Загрузка текущего баланса
        async function updateBalance() {
            try {
                let res = await fetch(`/api/balance/${userId}`);
                let data = await res.json();
                if (data.success) {
                    userBalance = data.balance;
                    document.getElementById('user-balance').innerText = userBalance;
                }
            } catch (e) {
                console.error(e);
            }
        }

        function openCase() {
            if (userBalance < 200) {
                alert('Недостаточно средств на балансе! Пополните баланс.');
                openModal();
                return;
            }
            alert('Открываем кейс Panteracases...');
        }

        updateBalance();
    </script>
</body>
</html>
