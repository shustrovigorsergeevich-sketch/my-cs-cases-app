<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pantera Cases</title>
    <!-- Подключаем Bootstrap для красивой и быстрой верстки -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: #0f0f13;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        .case-cover-card {
            background: linear-gradient(135deg, #1e1e2f 0%, #121218 100%);
            border: 1px solid #2a2a40;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .item-card {
            background-color: #1a1a24;
            border: 1px solid #2e2e42;
            border-radius: 12px;
            padding: 12px;
            text-align: center;
            position: relative;
            transition: transform 0.2s;
        }
        .item-card:hover {
            transform: translateY(-3px);
        }
        .badge-days {
            position: absolute;
            top: 8px;
            left: 8px;
            background-color: #10b981;
            color: white;
            font-size: 10px;
            padding: 3px 6px;
            border-radius: 6px;
            font-weight: bold;
        }
        .roulette-container {
            overflow: hidden;
            white-space: nowrap;
            background: #161622;
            border: 2px solid #3b3b5c;
            border-radius: 15px;
            padding: 15px;
            position: relative;
        }
        .roulette-track {
            display: inline-flex;
            transition: transform 4s cubic-bezier(0.15, 0.75, 0.15, 1);
            gap: 10px;
        }
        .roulette-item {
            min-width: 110px;
            height: 130px;
            background: #20202d;
            border: 1px solid #33334d;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 8px;
            font-size: 11px;
        }
        .pointer {
            position: absolute;
            top: 0;
            bottom: 0;
            left: 50%;
            width: 3px;
            background-color: #f59e0b;
            transform: translateX(-50%);
            z-index: 10;
            box-shadow: 0 0 10px #f59e0b;
        }
    </style>
</head>
<body class="p-3">

<div class="container py-3" style="max-width: 600px;">
    <!-- Шапка / Баланс -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h3 class="m-0 font-weight-bold text-warning">Pantera Cases 🐆</h3>
        <div class="bg-dark px-3 py-1 rounded-pill border border-secondary">
            ⭐ <span id="user-balance">5500</span>
        </div>
    </div>

    <!-- Обложка и меню кейса "Стартовый" -->
    <div class="case-cover-card p-4 text-center mb-4">
        <div style="font-size: 70px;" class="mb-2">🎁</div>
        <h2 class="text-white font-weight-bold">Кейс «Стартовый»</h2>
        <p class="text-muted small">Эксклюзивные подарки, редкие часы и коллекционные предметы Telegram</p>
        
        <div class="h4 text-warning mb-3">⭐ 550 Stars</div>

        <!-- Выбор количества открытий (x1 - x5) -->
        <div class="d-flex justify-content-center gap-2 mb-3">
            <button class="btn btn-sm btn-outline-light active count-btn" onclick="setCount(1, this)">x1</button>
            <button class="btn btn-sm btn-outline-light count-btn" onclick="setCount(2, this)">x2</button>
            <button class="btn btn-sm btn-outline-light count-btn" onclick="setCount(3, this)">x3</button>
            <button class="btn btn-sm btn-outline-light count-btn" onclick="setCount(4, this)">x4</button>
            <button class="btn btn-sm btn-outline-light count-btn" onclick="setCount(5, this)">x5</button>
        </div>

        <!-- Кнопки действий -->
        <div class="d-grid gap-2">
            <button class="btn btn-warning py-2 font-weight-bold" onclick="startOpening(false)">Открыть за <span id="total-price">550</span> ⭐</button>
            <button class="btn btn-outline-secondary py-2 font-weight-bold text-white" onclick="startOpening(true)">Демо режим</button>
        </div>
    </div>

    <!-- Рулетка анимация -->
    <div class="roulette-container mb-4" id="roulette-box" style="display: none;">
        <div class="pointer"></div>
        <div class="roulette-track" id="roulette-track">
            <!-- Сюда динамически генерируются элементы для прокрутки -->
        </div>
    </div>

    <!-- Блок результата -->
    <div id="result-container" class="card bg-dark border-success p-3 text-center mb-4" style="display: none;">
        <h5 class="text-success">🎉 Вы выиграли:</h5>
        <div id="won-items-list" class="my-2 font-weight-bold"></div>
        <button class="btn btn-success btn-sm mt-2" onclick="requestWithdrawal()">Забрать приз в боте (Вывод)</button>
    </div>

    <!-- Содержимое кейса (Список подарков с шансами) -->
    <h5 class="mb-3 text-secondary">Что в кейсе?</h5>
    <div class="row g-2" id="case-items-grid">
        <!-- Карточки генерируются скриптом -->
    </div>
</div>

<script>
    // Настройки твоего бота для уведомлений
    const BOT_TOKEN = "8645941945:AAGVQo1e7IWIHA57B5tKSh0hYwR61kx3Nys";
    const ADMIN_CHAT_ID = "to7165618202";

    // Точный массив подарков с вашими шансами, ценами и днями
    const caseItems = [
        { name: "Swiss Watch Salvador", ton: 77, stars: 7700, chance: 0.1, type: "legendary" },
        { name: "Chill Flame Satis-fire", ton: 60, stars: 6000, chance: 0.1, type: "legendary" },
        { name: "Holiday Drink Cubism", ton: 4.54, stars: 454, chance: 2.0, type: "epic" },
        { name: "Big Year Salvador Dali", ton: 4.5, stars: 450, chance: 2.0, type: "epic" },
        { name: "Mood Pack Golden Dragon", ton: 4.5, stars: 450, chance: 2.0, type: "epic" },
        { name: "Big Year Da Vinci", ton: 4.36, stars: 436, chance: 2.0, type: "epic" },
        { name: "Toy Bear", days: 5, ton: 0.25, stars: 25, chance: 2.0, type: "rare" },
        { name: "Swiss Watch", days: 2, ton: 0.2, stars: 20, chance: 2.0, type: "rare" },
        { name: "Heart Locket", days: 1, ton: 0.5, stars: 50, chance: 30.0, type: "base" },
        { name: "Scared Cat", days: 2, ton: 0.4, stars: 40, chance: 30.0, type: "base" }
    ];

    let currentCount = 1;
    let basePrice = 550;
    let lastWonItemsText = "";

    // Отрисовка списка предметов в кейсе при загрузке
    function renderCaseItems() {
        const grid = document.getElementById("case-items-grid");
        grid.innerHTML = "";
        caseItems.forEach(item => {
            grid.innerHTML += `
                <div class="col-6 col-sm-4">
                    <div class="item-card">
                        ${item.days ? `<span class="badge-days">${item.days} дн.</span>` : ''}
                        <div style="font-size: 32px;" class="my-1">🎁</div>
                        <div class="text-truncate font-weight-bold" style="font-size: 12px;">${item.name}</div>
                        <div class="text-warning small mt-1">💎 ${item.ton} / ⭐ ${item.stars}</div>
                        <div class="text-muted" style="font-size: 9px; margin-top: 2px;">Шанс: ${item.chance}%</div>
                    </div>
                </div>
            `;
        });
    }
    renderCaseItems();

    function setCount(num, btn) {
        currentCount = num;
        document.querySelectorAll('.count-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById("total-price").innerText = basePrice * currentCount;
    }

    // Функция выбора случайного предмета по заданным шансам
    function getRandomItem() {
        let rand = Math.random() * 100;
        let cumulative = 0;
        for (let item of caseItems) {
            cumulative += item.chance;
            if (rand <= cumulative) return item;
        }
        return caseItems[caseItems.length - 1];
    }

    function startOpening(isDemo) {
        const price = basePrice * currentCount;
        let balanceElem = document.getElementById("user-balance");
        let currentBalance = parseInt(balanceElem.innerText);

        if (!isDemo && currentBalance < price) {
            alert("Недостаточно звезд на балансе!");
            return;
        }

        if (!isDemo) {
            currentBalance -= price;
            balanceElem.innerText = currentBalance;
        }

        // Показываем рулетку
        document.getElementById("result-container").style.display = "none";
        const rouletteBox = document.getElementById("roulette-box");
        rouletteBox.style.display = "block";
        const track = document.getElementById("roulette-track");
        track.style.transition = "none";
        track.style.transform = "translateX(0px)";

        // Генерируем ленту для красивой прокрутки
        let html = "";
        let wonItems = [];
        for (let i = 0; i < 40; i++) {
            let item = getRandomItem();
            if (i === 32) { // Выигрышный элемент фиксируем ближе к концу
                for(let c = 0; c < currentCount; c++) {
                    wonItems.push(getRandomItem());
                }
                item = wonItems[0]; // отображаем первый из выигранных
            }
            html += `
                <div class="roulette-item">
                    <div style="font-size: 35px;">🎁</div>
                    <div class="text-truncate w-100" style="font-size: 10px;">${item.name}</div>
                    <div class="text-warning" style="font-size: 9px;">⭐ ${item.stars}</div>
                </div>
            `;
        }
        track.innerHTML = html;

        // Запускаем анимацию вращения
        setTimeout(() => {
            track.style.transition = "transform 4s cubic-bezier(0.15, 0.75, 0.15, 1)";
            // Останавливаем на нужном элементе
            let offset = 32 * 120 - 150; 
            track.style.transform = `translateX(-${offset}px)`;
        }, 50);

        // Показываем результат после завершения анимации
        setTimeout(() => {
            lastWonItemsText = wonItems.map(i => i.name + (i.days ? ` (${i.days} дн.)` : '')).join(", ");
            let listHtml = wonItems.map(i => `<span class="text-warning">${i.name}</span> ${i.days ? '('+i.days+' дн.)' : ''}`).join("<br>");
            
            document.getElementById("won-items-list").innerHTML = listHtml;
            document.getElementById("result-container").style.display = "block";
            if(isDemo) {
                alert(isDemo ? "[ДЕМО РЕЖИМ] Никакие средства не были списаны." : "");
            }
        }, 4100);
    }

    // Отправка уведомления администратору в Telegram
    function requestWithdrawal() {
        let username = window.Telegram && window.Telegram.WebApp.initDataUnsafe && window.Telegram.WebApp.initDataUnsafe.user 
            ? "@" + window.Telegram.WebApp.initDataUnsafe.user.username 
            : "Игрок (Web)";
        let userId = window.Telegram && window.Telegram.WebApp.initDataUnsafe && window.Telegram.WebApp.initDataUnsafe.user 
            ? window.Telegram.WebApp.initDataUnsafe.user.id 
            : "ID неизвестен";

        let text = `🚨 Запрос на вывод из кейса Старт!\n\n👤 Игрок: ${username} (ID: ${userId})\n🎁 Выиграл: ${lastWonItemsText}`;
        let url = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage?chat_id=${ADMIN_CHAT_ID}&text=${encodeURIComponent(text)}`;

        fetch(url).then(res => {
            if(res.ok) {
                alert("Запрос на вывод отправлен администратору!");
                document.getElementById("result-container").style.display = "none";
            } else {
                alert("Ошибка отправки запроса в бот.");
            }
        }).catch(() => {
            alert("Ошибка сети при отправке запроса.");
        });
    }
</script>

</body>
</html>
