<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Pantera Cases</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background: #0b0e17;
      color: #ffffff;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* HEADER */
    header {
      height: 60px;
      padding: 0 16px;
      background: #141927;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #232c43;
      flex-shrink: 0;
      z-index: 100;
    }

    .app-title {
      font-weight: 900;
      font-size: 18px;
      background: linear-gradient(90deg, #ff0055, #ff5000);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-transform: uppercase;
    }

    .balance-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      background: #080a11;
      padding: 6px 12px;
      border-radius: 20px;
      border: 1px solid #2a3656;
      cursor: pointer;
    }

    .balance-amount {
      font-weight: 700;
      font-size: 14px;
      color: #ffd700;
    }

    .add-btn {
      background: #ff0055;
      color: white;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: bold;
    }

    /* MAIN CONTAINER */
    main {
      flex: 1;
      position: relative;
      overflow-y: auto;
      padding: 16px;
      padding-bottom: 80px;
      z-index: 1;
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    /* CASE CARD */
    .case-card {
      width: 100%;
      background: #141927;
      border-radius: 16px;
      padding: 16px;
      text-align: center;
      border: 1px solid #232c43;
      margin-bottom: 16px;
    }

    .case-image-wrap {
      width: 140px;
      height: 140px;
      margin: 0 auto 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle, rgba(255,0,85,0.25) 0%, rgba(0,0,0,0) 70%);
    }

    .case-image-wrap img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .case-title {
      font-size: 20px;
      font-weight: 900;
      margin-bottom: 4px;
    }

    .case-subtitle {
      font-size: 12px;
      color: #8a99ad;
    }

    /* ROULETTE */
    .roulette-wrapper {
      width: 100%;
      height: 95px;
      position: relative;
      overflow: hidden;
      border-radius: 12px;
      background: #080a11;
      border: 2px solid #2a3656;
      margin-bottom: 16px;
      pointer-events: none;
    }

    .roulette-wrapper::before {
      content: '';
      position: absolute;
      top: 0;
      bottom: 0;
      left: 50%;
      width: 4px;
      background: #ffd700;
      transform: translateX(-50%);
      z-index: 10;
      box-shadow: 0 0 10px #ffd700;
    }

    .roulette-track {
      display: flex;
      gap: 8px;
      position: absolute;
      top: 8px;
      left: 0;
      will-change: transform;
    }

    .roulette-item {
      width: 78px;
      height: 78px;
      background: #141927;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border: 1px solid #232c43;
      flex-shrink: 0;
    }

    .roulette-item img {
      width: 42px;
      height: 42px;
      object-fit: contain;
    }

    .roulette-item .item-title {
      font-size: 9px;
      color: #aaa;
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 65px;
    }

    .roulette-item .price {
      font-size: 10px;
      color: #ffd700;
      font-weight: 700;
    }

    .open-btn {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, #ff0055, #ff5000);
      color: white;
      font-weight: 900;
      font-size: 16px;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 1px;
      box-shadow: 0 6px 20px rgba(255, 0, 85, 0.4);
      margin-bottom: 20px;
    }

    .open-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* CASE CONTENTS GRID */
    .case-contents-title {
      font-size: 13px;
      font-weight: 800;
      margin-bottom: 12px;
      color: #8a99ad;
      text-transform: uppercase;
    }

    .contents-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .content-card {
      background: #141927;
      border: 1px solid #232c43;
      border-radius: 10px;
      padding: 10px 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .content-card img {
      width: 48px;
      height: 48px;
      object-fit: contain;
      margin-bottom: 6px;
    }

    .content-name {
      font-size: 10px;
      font-weight: 700;
      color: #fff;
    }

    .content-price {
      font-size: 10px;
      color: #ffd700;
      font-weight: 700;
    }

    /* PROFILE SECTION */
    .user-profile-card {
      background: #141927;
      border: 1px solid #232c43;
      border-radius: 16px;
      padding: 16px;
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 20px;
    }

    .user-avatar {
      width: 54px;
      height: 54px;
      border-radius: 50%;
      background: #ff0055;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      font-weight: bold;
      color: white;
      overflow: hidden;
    }

    .user-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .user-info .username {
      font-size: 16px;
      font-weight: 800;
    }

    .user-info .user-id {
      font-size: 12px;
      color: #8a99ad;
      margin-top: 2px;
    }

    /* INVENTORY INSIDE PROFILE */
    .inventory-section-title {
      font-size: 15px;
      font-weight: 800;
      margin-bottom: 12px;
      text-transform: uppercase;
      color: #8a99ad;
    }

    .inventory-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    .inv-card {
      background: #141927;
      border-radius: 12px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      border: 1px solid #232c43;
    }

    .inv-card img {
      width: 60px;
      height: 60px;
      object-fit: contain;
      margin-bottom: 8px;
    }

    .inv-name {
      font-size: 12px;
      font-weight: 700;
      text-align: center;
      margin-bottom: 2px;
    }

    .inv-price {
      font-size: 11px;
      color: #ffd700;
      margin-bottom: 8px;
      font-weight: 700;
    }

    .inv-btn {
      width: 100%;
      padding: 8px;
      border: none;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 800;
      cursor: pointer;
      background: #ff0055;
      color: white;
    }

    /* DEPOSIT PACKS */
    .deposit-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .stars-pack-card {
      background: #141927;
      border: 1px solid #232c43;
      border-radius: 12px;
      padding: 16px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .stars-pack-card .stars-amount {
      font-size: 20px;
      font-weight: 900;
      color: #ffd700;
      margin: 8px 0;
    }

    .buy-stars-btn {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 8px;
      background: #ff0055;
      color: white;
      font-weight: 800;
      font-size: 12px;
      cursor: pointer;
    }

    /* NAVIGATION */
    nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 60px;
      background: #141927;
      display: flex;
      border-top: 1px solid #232c43;
      z-index: 999;
    }

    .nav-btn {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #5d6b8a;
      background: none;
      border: none;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      gap: 4px;
      -webkit-tap-highlight-color: transparent;
    }

    .nav-btn.active {
      color: #ff0055;
    }

    .nav-icon {
      font-size: 18px;
    }

    /* MODAL */
    .modal {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.85);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 20px;
    }

    .modal-box {
      background: #141927;
      border-radius: 16px;
      padding: 20px;
      width: 100%;
      max-width: 280px;
      text-align: center;
      border: 1px solid #ffd700;
    }

    .modal-box img {
      width: 90px;
      height: 90px;
      object-fit: contain;
      margin: 12px 0;
    }
  </style>
</head>
<body>

  <header>
    <div class="app-title">Pantera Cases</div>
    <div class="balance-badge" onclick="openTab('deposit')">
      <span>⭐</span>
      <span class="balance-amount" id="balance">100</span>
      <div class="add-btn">+</div>
    </div>
  </header>

  <main>
    <!-- ВКЛАДКА: КЕЙСИ -->
    <div id="tab-case" class="tab-content active">
      <div class="case-card">
        <div class="case-image-wrap">
          <img id="caseCover" src="file_000000003e50821180f255969ab14c38.png" alt="Pantera Case">
        </div>
        <div class="case-title">Pantera Case</div>
        <div class="case-subtitle">Испытай удачу и выбей Telegram NFT Gift</div>
      </div>

      <div class="roulette-wrapper">
        <div class="roulette-track" id="rouletteTrack"></div>
      </div>

      <button class="open-btn" id="openBtn" onclick="spinCase()">Открыть за 100 ⭐</button>

      <div class="case-contents-title">Содержимое кейса</div>
      <div class="contents-grid" id="contentsGrid"></div>
    </div>

    <!-- ВКЛАДКА: ПРОФИЛЬ (ВКЛЮЧАЕТ ИНВЕНТАРЬ) -->
    <div id="tab-profile" class="tab-content">
      <div class="user-profile-card">
        <div class="user-avatar" id="userAvatar">U</div>
        <div class="user-info">
          <div class="username" id="userName">User</div>
          <div class="user-id" id="userId">ID: 00000000</div>
        </div>
      </div>

      <div class="inventory-section-title">Инвентарь</div>
      <div class="inventory-grid" id="inventoryGrid"></div>
    </div>

    <!-- ВКЛАДКА: ПОПОЛНЕНИЕ ЧЕРЕЗ TELEGRAM STARS -->
    <div id="tab-deposit" class="tab-content">
      <div class="inventory-section-title">Пополнение баланса (Официально через Telegram Stars)</div>
      <div class="deposit-grid">
        <div class="stars-pack-card">
          <div style="font-size: 24px;">⭐</div>
          <div class="stars-amount">100 Stars</div>
          <button class="buy-stars-btn" onclick="buyStars(100)">Купить</button>
        </div>
        <div class="stars-pack-card">
          <div style="font-size: 24px;">⭐</div>
          <div class="stars-amount">500 Stars</div>
          <button class="buy-stars-btn" onclick="buyStars(500)">Купить</button>
        </div>
        <div class="stars-pack-card">
          <div style="font-size: 24px;">⭐</div>
          <div class="stars-amount">1000 Stars</div>
          <button class="buy-stars-btn" onclick="buyStars(1000)">Купить</button>
        </div>
        <div class="stars-pack-card">
          <div style="font-size: 24px;">⭐</div>
          <div class="stars-amount">2500 Stars</div>
          <button class="buy-stars-btn" onclick="buyStars(2500)">Купить</button>
        </div>
      </div>
    </div>
  </main>

  <!-- МОДАЛКА ВЫИГРЫША -->
  <div class="modal" id="winModal">
    <div class="modal-box">
      <h3 style="color: #ffd700;">ВЫ ВЫИГРАЛИ!</h3>
      <img id="winImg" src="" alt="" />
      <div id="winTitle" style="font-weight: 800; font-size: 16px; margin-bottom: 4px;"></div>
      <div id="winPrice" style="color: #ffd700; font-size: 13px; margin-bottom: 16px; font-weight: 700;"></div>
      <button class="open-btn" onclick="closeModal()" style="padding: 12px; font-size: 14px; margin-bottom: 0;">Забрать в инвентарь</button>
    </div>
  </div>

  <nav>
    <button class="nav-btn active" onclick="openTab('case')" id="nav-case">
      <span class="nav-icon">🎁</span>
      <span>Кейсы</span>
    </button>
    <button class="nav-btn" onclick="openTab('profile')" id="nav-profile">
      <span class="nav-icon">👤</span>
      <span>Профиль</span>
    </button>
    <button class="nav-btn" onclick="openTab('deposit')" id="nav-deposit">
      <span class="nav-icon">⭐</span>
      <span>Пополнить</span>
    </button>
  </nav>

  <script>
    const tg = window.Telegram ? window.Telegram.WebApp : null;
    if (tg) tg.expand();

    // ТОЧНАЯ ПРИВЯЗКА ФАЙЛОВ ПОДАРКОВ
    const GIFTS = [
      { id: 1, name: "Bonded Ring", price: 2500, file: "Bonded Ring.webp" },
      { id: 2, name: "Diamond Ring", price: 5000, file: "Diamond Ring.webp" },
      { id: 3, name: "Ginger Cookie", price: 100, file: "Ginger Cookie.webp" },
      { id: 4, name: "Happy Brownie", price: 150, file: "Happy Brownie.webp" },
      { id: 5, name: "Instant Ramen", price: 50, file: "Instant Ramen.webp" },
      { id: 6, name: "Input Key", price: 1200, file: "Input Key.webp" },
      { id: 7, name: "Light Sword", price: 3000, file: "Light Sword.webp" },
      { id: 8, name: "Love Potion", price: 800, file: "Love Potion.webp" },
      { id: 9, name: "Restless Jar", price: 600, file: "Restless Jar.webp" },
      { id: 10, name: "Sky Stilettos", price: 1800, file: "Sky Stilettos.webp" },
      { id: 11, name: "Toy Bear", price: 2000, file: "Toy Bear.webp" },
      { id: 12, name: "Emerald Gift", price: 350, file: "IMG_20261005_210325_616.png" },
      { id: 13, name: "Ruby Heart", price: 400, file: "IMG_20261005_210432_775.png" },
      { id: 14, name: "Sapphire Crown", price: 450, file: "IMG_20261005_210438_497.png" },
      { id: 15, name: "Golden Star", price: 500, file: "IMG_20261005_210442_380.png" },
      { id: 16, name: "Amethyst Box", price: 750, file: "IMG_20261005_210450_447.png" },
      { id: 17, name: "Dragon Egg", price: 900, file: "IMG_20261005_210455_132.png" }
    ];

    let balance = 100;
    let inventory = [];
    let isSpinning = false;

    // Инициализация данных из Telegram
    function initUserData() {
      if (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) {
        const u = tg.initDataUnsafe.user;
        document.getElementById('userName').innerText = (u.first_name + ' ' + (u.last_name || '')).trim() || u.username;
        document.getElementById('userId').innerText = `ID: ${u.id}`;
        if (u.photo_url) {
          document.getElementById('userAvatar').innerHTML = `<img src="${u.photo_url}" alt="Avatar">`;
        } else {
          document.getElementById('userAvatar').innerText = (u.first_name || 'U')[0].toUpperCase();
        }
      }
    }
    initUserData();

    function openTab(tabName) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));

      document.getElementById(`tab-${tabName}`).classList.add('active');
      document.getElementById(`nav-${tabName}`).classList.add('active');

      if (tabName === 'profile') {
        renderInventory();
      }
    }

    function renderCaseContents() {
      const grid = document.getElementById('contentsGrid');
      grid.innerHTML = '';
      GIFTS.forEach(item => {
        const div = document.createElement('div');
        div.className = 'content-card';
        div.innerHTML = `
          <img src="${item.file}" alt="${item.name}">
          <div class="content-name">${item.name}</div>
          <div class="content-price">${item.price} ⭐</div>
        `;
        grid.appendChild(div);
      });
    }
    renderCaseContents();

    function buildRoulette() {
      const track = document.getElementById('rouletteTrack');
      track.innerHTML = '';
      for (let i = 0; i < 45; i++) {
        const item = GIFTS[Math.floor(Math.random() * GIFTS.length)];
        const div = document.createElement('div');
        div.className = 'roulette-item';
        div.innerHTML = `
          <img src="${item.file}" alt="${item.name}">
          <div class="item-title">${item.name}</div>
          <div class="price">${item.price} ⭐</div>
        `;
        track.appendChild(div);
      }
    }
    buildRoulette();

    function spinCase() {
      if (isSpinning) return;
      if (balance < 100) {
        alert("Недостаточно Stars!");
        openTab('deposit');
        return;
      }

      balance -= 100;
      document.getElementById('balance').innerText = balance;
      isSpinning = true;
      document.getElementById('openBtn').disabled = true;

      const track = document.getElementById('rouletteTrack');
      track.style.transition = 'none';
      track.style.transform = 'translateX(0px)';

      const winIndex = 28 + Math.floor(Math.random() * 5);
      const wonItem = GIFTS[Math.floor(Math.random() * GIFTS.length)];

      const items = track.querySelectorAll('.roulette-item');
      items[winIndex].innerHTML = `
        <img src="${wonItem.file}" alt="${wonItem.name}">
        <div class="item-title">${wonItem.name}</div>
        <div class="price">${wonItem.price} ⭐</div>
      `;

      const itemWidth = 86; 
      const targetOffset = -(winIndex * itemWidth - 130);

      setTimeout(() => {
        track.style.transition = 'transform 4s cubic-bezier(0.12, 0.8, 0.12, 1)';
        track.style.transform = `translateX(${targetOffset}px)`;
      }, 50);

      setTimeout(() => {
        inventory.push(wonItem);
        showModal(wonItem);
        isSpinning = false;
        document.getElementById('openBtn').disabled = false;
      }, 4200);
    }

    function showModal(item) {
      document.getElementById('winImg').src = item.file;
      document.getElementById('winTitle').innerText = item.name;
      document.getElementById('winPrice').innerText = `Ценность: ${item.price} ⭐`;
      document.getElementById('winModal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('winModal').style.display = 'none';
      buildRoulette();
    }

    function renderInventory() {
      const grid = document.getElementById('inventoryGrid');
      if (inventory.length === 0) {
        grid.innerHTML = '<div style="grid-column: span 2; text-align: center; color: #5d6b8a; padding: 30px 0;">Инвентарь пуст.<br>Откройте кейс!</div>';
        return;
      }

      grid.innerHTML = '';
      inventory.forEach((item, index) => {
        const div = document.createElement('div');
        div.className = 'inv-card';
        div.innerHTML = `
          <img src="${item.file}" alt="${item.name}">
          <div class="inv-name">${item.name}</div>
          <div class="inv-price">${item.price} ⭐</div>
          <button class="inv-btn" onclick="sellItem(${index}, ${item.price})">Продать за ${item.price} ⭐</button>
        `;
        grid.appendChild(div);
      });
    }

    function sellItem(index, price) {
      inventory.splice(index, 1);
      balance += price;
      document.getElementById('balance').innerText = balance;
      renderInventory();
    }

    // ОФИЦИАЛЬНАЯ СИСТЕМА ПОПОЛНЕНИЯ ТЕЛЕГРАМ STARS
    async function buyStars(amount) {
      if (!tg) {
        alert("Запустите WebApp через Telegram для совершения оплаты");
        return;
      }

      try {
        // Здесь должна происходить отправка запроса на твой сервер для получения invoiceLink
        // Пример запроса:
        // const response = await fetch('/api/create-invoice', { method: 'POST', body: JSON.stringify({ amount }) });
        // const { invoiceLink } = await response.json();

        // После получения ссылки вызывают встроенный счет Telegram:
        /*
        tg.openInvoice(invoiceLink, (status) => {
          if (status === 'paid') {
            balance += amount;
            document.getElementById('balance').innerText = balance;
            alert(`Успешно оплачено! Начислено ${amount} Stars.`);
          } else if (status === 'cancelled') {
            alert('Оплата отменена');
          } else {
            alert('Ошибка при совершении платежа');
          }
        });
        */

        // Демонстрационная эмуляция успеха на время отладки фронтенда:
        alert(`Запрос на создание счета в Telegram Stars на ${amount} ⭐ сформирован.`);
        balance += amount;
        document.getElementById('balance').innerText = balance;
      } catch (e) {
        alert("Ошибка оплаты: " + e.message);
      }
    }
  </script>
</body>
</html>
