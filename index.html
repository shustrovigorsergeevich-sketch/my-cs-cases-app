<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pantera Cases</title>
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- TonConnect SDK -->
    <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
    <style>
        :root {
            --bg-color: #0f1218;
            --card-bg: #1a1f2c;
            --accent: #f39c12;
            --ton-color: #0098ea;
            --text-color: #ffffff;
            --text-secondary: #8a9ba8;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding-bottom: 70px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background: var(--card-bg);
            border-bottom: 1px solid #2a3245;
        }
        .brand-block {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .brand-title {
            font-size: 16px;
            font-weight: bold;
            color: var(--accent);
            letter-spacing: 0.5px;
        }
        .user-info {
            font-size: 12px;
            color: var(--text-secondary);
        }
        .balance-box {
            display: flex;
            gap: 15px;
            background: #11151d;
            padding: 8px 14px;
            border-radius: 20px;
            border: 1px solid #2a3245;
        }
        .balance-item {
            display: flex;
            align-items: center;
            gap: 5px;
            font-weight: bold;
            font-size: 14px;
        }
        .content {
            padding: 20px;
        }
        .section-title {
            font-size: 18px;
            margin-bottom: 15px;
            font-weight: 600;
        }
        .pay-card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 16px;
            margin-bottom: 15px;
            border: 1px solid #2a3245;
        }
        .pay-btn {
            background: var(--accent);
            color: #000;
            border: none;
            padding: 10px 18px;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
        }
        .ton-btn {
            background: var(--ton-color);
            color: #fff;
            width: 100%;
            margin-top: 10px;
        }
        #ton-connect-button {
            display: flex;
            justify-content: center;
            margin-bottom: 15px;
        }
        .ton-input-group {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 12px;
            border: 1px solid #0098ea55;
        }
        .ton-input {
            width: 100%;
            background: #11151d;
            border: 1px solid #2a3245;
            border-radius: 10px;
            padding: 12px;
            color: #fff;
            font-size: 16px;
            margin-top: 8px;
            outline: none;
        }

        /* Казино-рулетка */
        .case-box {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 20px;
            text-align: center;
            border: 1px solid #2a3245;
            margin-bottom: 20px;
        }
        .case-roulette {
            display: flex;
            overflow: hidden;
            width: 100%;
            height: 120px;
            background: #11151d;
            border-radius: 14px;
            border: 1px solid #2a3245;
            align-items: center;
            position: relative;
            margin-bottom: 15px;
        }
        .roulette-track {
            display: flex;
            gap: 8px;
            position: absolute;
            left: 0;
            will-change: transform;
        }
        .roulette-item {
            min-width: 90px;
            height: 100px;
            background: var(--card-bg);
            border-radius: 10px;
            border: 1px solid #2a3245;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 6px;
            text-align: center;
        }
        .roulette-item .r-price {
            font-size: 11px;
            color: var(--accent);
            margin-bottom: 4px;
            font-weight: bold;
        }
        .roulette-item .r-name {
            font-size: 10px;
            color: var(--text-secondary);
            overflow: hidden;
            text-overflow: ellipsis;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
        }
        .pointer {
            position: absolute;
            top: 0;
            bottom: 0;
            left: 50%;
            width: 3px;
            background: var(--accent);
            transform: translateX(-50%);
            z-index: 10;
            box-shadow: 0 0 8px var(--accent);
        }
        .open-case-btn {
            background: linear-gradient(135deg, #f39c12, #e67e22);
            color: #000;
            border: none;
            width: 100%;
            padding: 14px;
            border-radius: 14px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        .open-case-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Инвентарь */
        .inventory-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }
        .nft-gift-card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 14px;
            border: 1px solid #2a3245;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }
        .nft-gift-title {
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 8px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .nft-gift-price {
            font-size: 12px;
            color: var(--text-secondary);
            background: #11151d;
            padding: 6px 10px;
            border-radius: 12px;
            width: 100%;
            border: 1px solid #2a3245;
            margin-bottom: 10px;
        }
        .sell-btn {
            background: #22c55e;
            color: #fff;
            border: none;
            width: 100%;
            padding: 8px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 12px;
            cursor: pointer;
        }

        .nav-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--card-bg);
            display: flex;
            justify-content: space-around;
            padding: 12px 0;
            border-top: 1px solid #2a3245;
            z-index: 100;
        }
        .nav-item {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 11px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            cursor: pointer;
        }
        .nav-item.active {
            color: var(--accent);
        }
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="brand-block">
            <div class="brand-title">Pantera Cases</div>
            <div class="user-info" id="user-id-text">id: загрузка...</div>
        </div>
        <div class="balance-box">
            <div class="balance-item"><span id="stars-balance">100</span> <span>⭐</span></div>
            <div class="balance-item"><span id="ton-balance">5.00</span> <span>💎</span></div>
        </div>
    </div>

    <div class="content">
        <!-- Пополнение -->
        <div id="tab-topup" class="tab-content active">
            <div class="section-title">Пополнение баланса</div>
            <div id="ton-connect-button"></div>
            <div class="ton-input-group">
                <div class="pay-info">
                    <h3>Пополнение TON 💎</h3>
                    <p style="color:var(--text-secondary); font-size:13px;">Минимум 1 TON</p>
                </div>
                <input type="number" id="ton-amount-input" class="ton-input" value="1" min="1" step="0.1">
                <button class="pay-btn ton-btn" onclick="payWithCustomTon()">Оплатить TON</button>
            </div>
            <div class="pay-card">
                <h3>100 Telegram Stars ⭐</h3>
                <button class="pay-btn" style="margin-top:10px;" onclick="payWithStars(100)">Купить за 100 ⭐</button>
            </div>
        </div>

        <!-- Кейсы (Казино) -->
        <div id="tab-cases" class="tab-content">
            <div class="section-title">Кейс NFT Подарков</div>
            <div class="case-box">
                <p style="color: var(--text-secondary); font-size: 13px; margin-bottom: 10px;">Стоимость открытия: <b>50 ⭐</b></p>
                <div class="case-roulette">
                    <div class="pointer"></div>
                    <div class="roulette-track" id="roulette-track"></div>
                </div>
                <button class="open-case-btn" id="open-btn" onclick="startCasinoRoll()">Открыть кейс (50 ⭐)</button>
            </div>

            <div class="section-title">Инвентарь</div>
            <div class="inventory-grid" id="inventory-grid">
                <p style="color: var(--text-secondary); font-size: 13px;">Инвентарь пуст.</p>
            </div>
        </div>

        <!-- Рефералы -->
        <div id="tab-ref" class="tab-content">
            <div class="section-title">Реферальная система</div>
            <div class="pay-card">
                <h3>Ваша ссылка</h3>
                <p id="ref-link-text" style="color: var(--text-secondary); font-size: 13px; margin-top: 5px;">загрузка...</p>
            </div>
        </div>

        <!-- Задания -->
        <div id="tab-tasks" class="tab-content">
            <div class="section-title">Задания</div>
            <p style="color: var(--text-secondary);">Скоро здесь появятся задания.</p>
        </div>
    </div>

    <!-- Навигация -->
    <div class="nav-bar">
        <button class="nav-item active" onclick="switchTab('topup', this)"><span>💳</span> Баланс</button>
        <button class="nav-item" onclick="switchTab('cases', this)"><span>🎁</span> Кейсы</button>
        <button class="nav-item" onclick="switchTab('ref', this)"><span>👥</span> Рефералы</button>
        <button class="nav-item" onclick="switchTab('tasks', this)"><span>📋</span> Задания</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        let userStars = 100;
        let userTon = 5.00;
        let inventory = [];

        const userId = tg.initDataUnsafe?.user?.id || '12345678';
        document.getElementById('user-id-text').innerText = `id: ${userId}`;
        document.getElementById('ref-link-text').innerText = `t.me/your_bot?start=ref_${userId}`;

        const tonConnectUI = new TON_CONNECT_UI.TonConnectUI({
            manifestUrl: 'https://shustrovigorsergeevich-sketch.github.io/my-cs-cases-app/tonconnect-manifest.json',
            buttonRootId: 'ton-connect-button'
        });

        // Список подарков (с ценами как на скриншотах)
        const giftsDb = [
            { name: "Heart Locket (1 day)", ton: 0.5, stars: 50, chance: 30 },
            { name: "Scared Cat (2 days)", ton: 0.4, stars: 40, chance: 30 },
            { name: "Toy Bear (5 days)", ton: 0.25, stars: 25, chance: 20 },
            { name: "Swiss Watch (2 days)", ton: 0.2, stars: 20, chance: 10 },
            { name: "Holiday Drink Cubism", ton: 4.54, stars: 454, chance: 5 },
            { name: "Big Year Salvador Dali", ton: 4.5, stars: 450, chance: 3 },
            { name: "Mood Pack Golden Dragon", ton: 4.5, stars: 450, chance: 1 },
            { name: "Swiss Watch Salvador", ton: 77, stars: 7700, chance: 1 }
        ];

        function switchTab(tabName, el) {
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
            
            const targetTab = document.getElementById('tab-' + tabName);
            if (targetTab) targetTab.classList.add('active');
            if (el) el.classList.add('active');
        }

        function updateBalance() {
            document.getElementById('stars-balance').innerText = userStars;
            document.getElementById('ton-balance').innerText = userTon.toFixed(2);
        }

        function initRoulette() {
            const track = document.getElementById('roulette-track');
            track.innerHTML = '';
            track.style.transition = 'none';
            track.style.transform = 'translateX(0px)';

            for (let i = 0; i < 40; i++) {
                const randomGift = giftsDb[Math.floor(Math.random() * giftsDb.length)];
                const item = document.createElement('div');
                item.className = 'roulette-item';
                item.innerHTML = `<div class="r-price">💎 ${randomGift.ton}</div><div class="r-name">${randomGift.name}</div>`;
                track.appendChild(item);
            }
        }
        initRoulette();

        function getRandomGiftByChance() {
            const totalChance = giftsDb.reduce((sum, g) => sum + g.chance, 0);
            let rand = Math.random() * totalChance;
            for (let gift of giftsDb) {
                if (rand < gift.chance) return gift;
                rand -= gift.chance;
            }
            return giftsDb[0];
        }

        function startCasinoRoll() {
            const caseCost = 50;
            if (userStars < caseCost) {
                alert('Недостаточно Stars для открытия кейса!');
                return;
            }

            userStars -= caseCost;
            updateBalance();

            const openBtn = document.getElementById('open-btn');
            openBtn.disabled = true;

            const track = document.getElementById('roulette-track');
            const winningGift = getRandomGiftByChance();

            // Подменяем элемент на выигрышной позиции (например, 25-й элемент)
            const winningIndex = 25;
            const items = track.children;
            if (items[winningIndex]) {
                items[winningIndex].innerHTML = `<div class="r-price">💎 ${winningGift.ton}</div><div class="r-name">${winningGift.name}</div>`;
            }

            // Вычисляем смещение для точной остановки по центру под указателем
            const itemWidth = 98; // ширина карточки (90px) + отступ (8px)
            const rouletteContainerWidth = document.querySelector('.case-roulette').clientWidth;
            const targetOffset = -(winningIndex * itemWidth - (rouletteContainerWidth / 2) + (itemWidth / 2));

            track.style.transition = 'transform 4s cubic-bezier(0.15, 0.85, 0.25, 1)';
            track.style.transform = `translateX(${targetOffset}px)`;

            setTimeout(() => {
                inventory.push(winningGift);
                renderInventory();
                alert(`Вы выиграли: ${winningGift.name}!`);
                
                openBtn.disabled = false;
                initRoulette(); // сбрасываем рулетку для следующего раза
            }, 4200);
        }

        function renderInventory() {
            const grid = document.getElementById('inventory-grid');
            if (inventory.length === 0) {
                grid.innerHTML = `<p style="color: var(--text-secondary); font-size: 13px;">Инвентарь пуст.</p>`;
                return;
            }

            grid.innerHTML = '';
            inventory.forEach((gift, index) => {
                const card = document.createElement('div');
                card.className = 'nft-gift-card';
                card.innerHTML = `
                    <div class="nft-gift-title">${gift.name}</div>
                    <div class="nft-gift-price">💎 ${gift.ton} / ⭐ ${gift.stars}</div>
                    <button class="sell-btn" onclick="sellItem(${index})">Продать</button>
                `;
                grid.appendChild(card);
            });
        }

        function sellItem(index) {
            const gift = inventory[index];
            userStars += gift.stars;
            userTon += gift.ton;
            updateBalance();
            
            inventory.splice(index, 1);
            renderInventory();
            alert(`Подарок продан за ${gift.ton} TON / ${gift.stars} Stars!`);
        }

        function payWithStars(starsAmount) {
            if (tg && tg.openInvoice) {
                // Логика счета Telegram Stars
                userStars += starsAmount;
                updateBalance();
                alert(`Успешно добавлено ${starsAmount} Stars!`);
            } else {
                userStars += starsAmount;
                updateBalance();
                alert(`Тест: +${starsAmount} Stars`);
            }
        }

        async function payWithCustomTon() {
            try {
                const inputVal = parseFloat(document.getElementById('ton-amount-input').value);
                if (isNaN(inputVal) || inputVal < 1) {
                    alert('Минимум 1 TON');
                    return;
                }
                if (!tonConnectUI.connected) {
                    await tonConnectUI.openModal();
                    return;
                }
                // Логика транзакции TonConnect
                userTon += inputVal;
                updateBalance();
                alert(`Оплачено ${inputVal} TON!`);
            } catch (err) {
                console.error(err);
            }
        }
    </script>
</body>
</html>
