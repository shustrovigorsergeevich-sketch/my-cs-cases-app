<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Panteracases - NFT Gifts</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Безопасная загрузка TonConnect SDK -->
    <script src="https://unpkg.com/@tonconnect/sdk@latest/dist/tonconnect-sdk.min.js"></script>
    <style>
        :root {
            --bg-color: #0b0e14;
            --card-bg: #151a23;
            --accent-color: #2481cc;
            --accent-gradient: linear-gradient(135deg, #00c6ff, #0072ff);
            --gold-color: #ffd700;
            --text-main: #ffffff;
            --text-secondary: #8b9bb4;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding-bottom: 80px;
            overflow-x: hidden;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background: rgba(21, 26, 35, 0.9);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            gap: 10px;
        }

        .logo-title {
            font-size: 15px;
            font-weight: 700;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            white-space: nowrap;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .balance-box {
            display: flex;
            align-items: center;
            gap: 4px;
            background: rgba(0, 198, 255, 0.1);
            padding: 5px 10px;
            border-radius: 16px;
            border: 1px solid rgba(0, 198, 255, 0.3);
            font-weight: 600;
            font-size: 13px;
        }

        .connect-wallet-btn {
            background: var(--accent-gradient);
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 16px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
        }

        .nav-tabs {
            display: flex;
            gap: 6px;
            padding: 10px 16px;
            background: rgba(15, 20, 28, 0.5);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .tab-btn {
            background: var(--card-bg);
            border: none;
            color: var(--text-secondary);
            padding: 6px 12px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }

        .tab-btn.active {
            background: var(--accent-gradient);
            color: var(--text-main);
        }

        .screen {
            display: none;
            padding: 20px;
        }

        .screen.active {
            display: block;
        }

        .case-container {
            text-align: center;
            padding: 10px 0;
        }

        .case-image-wrapper {
            position: relative;
            width: 180px;
            height: 180px;
            margin: 0 auto 15px;
            background: var(--card-bg);
            border-radius: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid rgba(0, 198, 255, 0.3);
            box-shadow: 0 0 30px rgba(0, 198, 255, 0.2);
            font-size: 60px;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        .case-title {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .case-price {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 16px;
            font-weight: 600;
            color: var(--gold-color);
            margin-bottom: 20px;
            background: rgba(255, 215, 0, 0.1);
            padding: 5px 14px;
            border-radius: 20px;
        }

        .open-btn {
            width: 100%;
            max-width: 320px;
            background: var(--accent-gradient);
            color: white;
            border: none;
            padding: 15px;
            border-radius: 16px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 8px 25px rgba(0, 114, 255, 0.4);
        }

        .roulette-screen {
            text-align: center;
            padding-top: 30px;
        }

        .roulette-window {
            position: relative;
            width: 100%;
            height: 140px;
            background: var(--card-bg);
            border-radius: 20px;
            overflow: hidden;
            border: 2px solid rgba(0, 198, 255, 0.3);
            margin: 30px 0;
        }

        .roulette-pointer {
            position: absolute;
            top: 0; bottom: 0; left: 50%;
            width: 4px;
            background: #ff3b30;
            transform: translateX(-50%);
            z-index: 10;
        }

        .roulette-track {
            display: flex;
            position: absolute;
            left: 0; top: 0;
            height: 100%;
            align-items: center;
        }

        .roulette-item {
            min-width: 110px;
            height: 110px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            margin: 0 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 8px;
        }

        .roulette-item .emoji { font-size: 36px; margin-bottom: 5px; }
        .roulette-item span { font-size: 11px; color: var(--text-secondary); }

        .rewards-section { margin-top: 25px; text-align: left; }
        .section-title { font-size: 15px; font-weight: 600; margin-bottom: 12px; color: var(--text-secondary); }

        .rewards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
            gap: 8px;
        }

        .reward-card {
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 10px 4px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .reward-card .emoji { font-size: 28px; margin-bottom: 4px; }
        .reward-name { font-size: 10px; font-weight: 600; margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; width: 100%; }
        .reward-price { font-size: 10px; color: var(--gold-color); font-weight: 600; }

        .inventory-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        .inventory-item {
            background: var(--card-bg);
            border-radius: 14px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            border: 1px solid rgba(255, 255, 255, 0.05);
            text-align: center;
        }

        .inventory-item .emoji { font-size: 45px; margin-bottom: 8px; }
        .inventory-item .name { font-size: 12px; font-weight: 600; margin-bottom: 2px; }
        .inventory-item .price { font-size: 11px; color: var(--gold-color); margin-bottom: 8px; }

        .sell-item-btn {
            width: 100%;
            background: rgba(255, 59, 48, 0.15);
            color: #ff453a;
            border: 1px solid rgba(255, 59, 48, 0.3);
            padding: 6px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
        }

        .empty-inventory { text-align: center; color: var(--text-secondary); margin-top: 40px; font-size: 13px; }

        .wallet-card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 16px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .wallet-card h3 { font-size: 14px; margin-bottom: 6px; }

        .topup-options {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            margin-top: 10px;
        }

        .topup-btn {
            background: rgba(0, 198, 255, 0.1);
            border: 1px solid rgba(0, 198, 255, 0.3);
            color: var(--text-main);
            padding: 10px;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            font-size: 12px;
        }

        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.show { opacity: 1; pointer-events: auto; }

        .win-modal {
            background: var(--card-bg);
            width: 85%;
            max-width: 300px;
            border-radius: 20px;
            padding: 20px 16px;
            text-align: center;
            border: 1px solid rgba(0, 198, 255, 0.4);
            transform: scale(0.3);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .modal-overlay.show .win-modal { transform: scale(1); }
        .win-modal h2 { font-size: 18px; margin-bottom: 10px; color: var(--accent-color); }
        .win-emoji-container { font-size: 60px; margin: 10px 0; }
        .win-name { font-size: 15px; font-weight: 700; margin-bottom: 4px; }
        .win-price { font-size: 13px; color: var(--gold-color); margin-bottom: 16px; font-weight: 600; }
        .modal-buttons { display: flex; gap: 8px; }
        .modal-btn { flex: 1; padding: 9px; border-radius: 9px; font-size: 12px; font-weight: 600; cursor: pointer; border: none; }
        .btn-keep { background: var(--accent-gradient); color: white; }
        .btn-sell-modal { background: rgba(255, 59, 48, 0.15); color: #ff453a; border: 1px solid rgba(255, 59, 48, 0.3); }
    </style>
</head>
<body>

    <header>
        <div class="logo-title">Panteracases</div>
        <div class="header-right">
            <div class="balance-box">⭐ <span id="user-balance">0</span></div>
            <button class="connect-wallet-btn" id="wallet-connect-btn" onclick="toggleWalletConnect()">Кошелёк</button>
        </div>
    </header>

    <div class="nav-tabs">
        <button class="tab-btn active" onclick="switchTab('case', event)">Кейс</button>
        <button class="tab-btn" onclick="switchTab('inventory', event)">Инвентарь (<span id="inv-count">0</span>)</button>
        <button class="tab-btn" onclick="switchTab('wallet', event)">Пополнить</button>
    </div>

    <!-- ЭКРАН 1: ГЛАВНЫЙ КЕЙС -->
    <div id="screen-case" class="screen active">
        <div class="case-container">
            <div class="case-image-wrapper">🎁</div>
            <div class="case-title">Rare Case</div>
            <div class="case-price">⭐ 200 Stars</div>
            <br>
            <button class="open-btn" onclick="startOpening()">Открыть кейс (200 ⭐)</button>
        </div>

        <div class="rewards-section">
            <div class="section-title">Содержимое кейса</div>
            <div class="rewards-grid" id="rewards-grid"></div>
        </div>
    </div>

    <!-- ЭКРАН РУЛЕТКИ -->
    <div id="screen-roulette" class="screen">
        <div class="roulette-screen">
            <h2 style="margin-bottom: 8px;">Открытие кейса...</h2>
            <p style="color: var(--text-secondary); font-size: 13px;">Испытываем удачу...</p>
            
            <div class="roulette-window">
                <div class="roulette-pointer"></div>
                <div class="roulette-track" id="roulette-track"></div>
            </div>
        </div>
    </div>

    <!-- ЭКРАН 2: ИНВЕНТАРЬ -->
    <div id="screen-inventory" class="screen">
        <div class="section-title">Ваши выигранные предметы</div>
        <div id="inventory-container" class="inventory-grid"></div>
        <div id="empty-inv" class="empty-inventory">Инвентарь пуст. Откройте кейс!</div>
    </div>

    <!-- ЭКРАН 3: ПОПОЛНЕНИЕ -->
    <div id="screen-wallet" class="screen">
        <div class="wallet-card">
            <h3>Пополнение через TON</h3>
            <p style="color: var(--text-secondary); font-size: 11px; margin-bottom: 8px;">
                Средства поступят на указанный адрес кошелька. 1 TON = 100 Stars.
            </p>
            <div class="topup-options">
                <button class="topup-btn" onclick="topUpWithTon(0.1, 10)">0.1 TON (10 ⭐)</button>
                <button class="topup-btn" onclick="topUpWithTon(1, 100)">1 TON (100 ⭐)</button>
                <button class="topup-btn" onclick="topUpWithTon(2, 200)">2 TON (200 ⭐)</button>
                <button class="topup-btn" onclick="topUpWithTon(5, 500)">5 TON (500 ⭐)</button>
            </div>
        </div>
    </div>

    <!-- МОДАЛЬНОЕ ОКНО ВЫИГРЫША -->
    <div class="modal-overlay" id="win-modal">
        <div class="win-modal">
            <h2>Поздравляем! 🎉</h2>
            <div class="win-emoji-container" id="modal-emoji">🎁</div>
            <div class="win-name" id="modal-name">Название</div>
            <div class="win-price" id="modal-price">⭐ 0</div>
            <div class="modal-buttons">
                <button class="modal-btn btn-sell-modal" onclick="sellWonItem()">Продать (<span id="modal-sell-price">0</span> ⭐)</button>
                <button class="modal-btn btn-keep" onclick="keepWonItem()">В инвентарь</button>
            </div>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        // Сюда вставь свой реальный адрес кошелька для получения средств
        const MERCHANT_WALLET = "UQDJZeV0lt18SEQYhcWxpxBjfvAcfrFRMuSWV6R9JirstYXY"; 
        
        let tonConnectUI = null;
        try {
            if (typeof TON_CONNECT_SDK !== 'undefined') {
                tonConnectUI = new TON_CONNECT_SDK.TonConnect({
                    manifestUrl: window.location.origin + '/tonconnect-manifest.json'
                });
                tonConnectUI.onStatusChange(wallet => {
                    const btn = document.getElementById('wallet-connect-btn');
                    if (wallet) {
                        const addr = wallet.account.address;
                        btn.innerText = addr.slice(0, 4) + '...' + addr.slice(-4);
                        btn.style.background = '#34c759';
                    } else {
                        btn.innerText = 'Кошелёк';
                        btn.style.background = '';
                    }
                });
            }
        } catch(e) {
            console.error("TonConnect init error:", e);
        }

        async function toggleWalletConnect() {
            if (!tonConnectUI) {
                alert('Модуль кошелька не инициализирован.');
                return;
            }
            if (tonConnectUI.connected) {
                await tonConnectUI.disconnect();
            } else {
                try {
                    const wallets = await tonConnectUI.getWallets();
                    if (wallets && wallets.length > 0) {
                        window.open(wallets[0].universalLink, '_blank');
                    } else {
                        alert('Кошельки не найдены');
                    }
                } catch(err) {
                    alert('Ошибка подключения кошелька');
                }
            }
        }

        const gifts = [
            { id: 1, name: "Toy Bear", price: 3631, emoji: "🧸" },
            { id: 2, name: "Signet Ring", price: 3603, emoji: "💍" },
            { id: 3, name: "Diamond Ring", price: 3275, emoji: "💎" },
            { id: 4, name: "Sky Stilettos", price: 1933, emoji: "👠" },
            { id: 5, name: "Love Potion", price: 1563, emoji: "🧪" },
            { id: 6, name: "Input Key", price: 703, emoji: "🔑" },
            { id: 7, name: "Light Sword", price: 702, emoji: "⚔️" },
            { id: 8, name: "Restless Jar", price: 700, emoji: "🏺" },
            { id: 9, name: "Ginger Cookie", price: 600, emoji: "🍪" },
            { id: 10, name: "Happy Brownie", price: 500, emoji: "🧁" },
            { id: 11, name: "Instant Ramen", price: 500, emoji: "🍜" },
            { id: 12, name: "Golden Cup", price: 100, emoji: "🏆" },
            { id: 13, name: "Simple Ring", price: 100, emoji: "⭕" },
            { id: 14, name: "Rocket", price: 50, emoji: "🚀" },
            { id: 15, name: "Gift Box", price: 25, emoji: "📦" },
            { id: 16, name: "Little Bear", price: 15, emoji: "🧸" },
            { id: 17, name: "Heart", price: 15, emoji: "❤️" }
        ];

        let balance = 0;
        let inventory = [];
        let currentWonItem = null;

        function renderRewardsList() {
            const grid = document.getElementById('rewards-grid');
            grid.innerHTML = gifts.map(g => `
                <div class="reward-card">
                    <div class="emoji">${g.emoji}</div>
                    <div class="reward-name">${g.name}</div>
                    <div class="reward-price">⭐ ${g.price}</div>
                </div>
            `).join('');
        }

        function switchTab(tabId, event) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(`screen-${tabId}`).classList.add('active');
            if (event && event.target) {
                event.target.classList.add('active');
            }
        }

        function updateUI() {
            document.getElementById('user-balance').innerText = balance;
            document.getElementById('inv-count').innerText = inventory.length;
            
            const invContainer = document.getElementById('inventory-container');
            const emptyInv = document.getElementById('empty-inv');

            if (inventory.length === 0) {
                invContainer.innerHTML = '';
                emptyInv.style.display = 'block';
            } else {
                emptyInv.style.display = 'none';
                invContainer.innerHTML = inventory.map((item, index) => `
                    <div class="inventory-item">
                        <div class="emoji">${item.emoji}</div>
                        <div class="name">${item.name}</div>
                        <div class="price">⭐ ${item.price}</div>
                        <button class="sell-item-btn" onclick="sellInventoryItem(${index})">Продать за ⭐ ${item.price}</button>
                    </div>
                `).join('');
            }
        }

        async function topUpWithTon(tonAmount, starsAmount) {
            if (!tonConnectUI || !tonConnectUI.connected) {
                alert('Сначала
