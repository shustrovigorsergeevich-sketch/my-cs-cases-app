<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Panteracases</title>
  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- TON Connect UI SDK -->
  <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background: #060c1f;
      color: #ffffff;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* HEADER */
    header {
      height: 60px;
      padding: 0 16px;
      background: #0a192f;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #172a45;
      flex-shrink: 0;
      z-index: 100;
    }

    .app-title {
      font-weight: 900;
      font-size: 18px;
      background: linear-gradient(90deg, #00b4d8, #90e0ef);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .balance-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      background: #060c1f;
      padding: 6px 14px;
      border-radius: 20px;
      border: 1px solid #00b4d844;
      cursor: pointer;
      box-shadow: 0 0 10px rgba(0, 180, 216, 0.2);
    }

    .balance-amount {
      font-weight: 800;
      font-size: 14px;
      color: #ffd700;
    }

    .add-btn {
      background: #00b4d8;
      color: #000;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 900;
    }

    /* MAIN CONTAINER */
    main {
      flex: 1;
      position: relative;
      overflow-y: auto;
      padding: 16px;
      padding-bottom: 80px;
      z-index: 1;
      background: #060c1f;
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    /* ГЛАВНАЯ СТРАНИЦА И КЕЙСЫ */
    .section-header-title {
      font-size: 15px;
      font-weight: 800;
      margin-bottom: 14px;
      text-transform: uppercase;
      color: #90e0ef;
    }

    .cases-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .case-item-card {
      background: #0a192f;
      border: 1px solid #172a45;
      border-radius: 16px;
      padding: 16px;
      display: flex;
      align-items: center;
      gap: 16px;
      cursor: pointer;
      transition: 0.2s;
      box-shadow: 0 4px 16px rgba(0,0,0,0.3);
    }

    .case-item-card:active {
      transform: scale(0.98);
      border-color: #00b4d8;
    }

    .case-item-img {
      width: 70px;
      height: 70px;
      object-fit: contain;
      background: radial-gradient(circle, rgba(0,180,216,0.2) 0%, rgba(0,0,0,0) 70%);
      border-radius: 12px;
    }

    .case-item-info {
      flex: 1;
    }

    .case-item-title {
      font-size: 17px;
      font-weight: 900;
      margin-bottom: 4px;
    }

    .case-item-sub {
      font-size: 12px;
      color: #90e0ef;
    }

    .case-item-price {
      font-size: 14px;
      font-weight: 800;
      color: #ffd700;
      background: #060c1f;
      padding: 6px 12px;
      border-radius: 10px;
      border: 1px solid #172a45;
    }

    /* ЭКРАН ОТКРЫТИЯ КОНКРЕТНОГО КЕЙСА */
    .back-to-cases {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      font-weight: 700;
      color: #00b4d8;
      cursor: pointer;
      margin-bottom: 14px;
    }

    .case-card {
      width: 100%;
      background: #0a192f;
      border-radius: 20px;
      padding: 20px 16px;
      text-align: center;
      border: 1px solid #172a45;
      margin-bottom: 16px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    }

    .case-image-wrap {
      width: 130px;
      height: 130px;
      margin: 0 auto 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle, rgba(0,180,216,0.2) 0%, rgba(0,0,0,0) 70%);
    }

    .case-image-wrap img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .case-title {
      font-size: 22px;
      font-weight: 900;
      margin-bottom: 4px;
    }

    .case-subtitle {
      font-size: 12px;
      color: #90e0ef;
    }

    /* ROULETTE */
    .roulette-wrapper {
      width: 100%;
      height: 105px;
      position: relative;
      overflow: hidden;
      border-radius: 16px;
      background: #030814;
      border: 2px solid #00b4d8;
      margin-bottom: 16px;
      pointer-events: none;
      box-shadow: inset 0 0 20px rgba(0,0,0,0.8), 0 0 15px rgba(0,180,216,0.3);
    }

    .roulette-wrapper::before {
      content: '';
      position: absolute;
      top: 0; bottom: 0; left: 50%;
      width: 4px;
      background: #ffd700;
      transform: translateX(-50%);
      z-index: 10;
      box-shadow: 0 0 12px #ffd700, 0 0 20px #ffd700;
    }

    .roulette-track {
      display: flex;
      gap: 10px;
      position: absolute;
      top: 10px; left: 0;
      will-change: transform;
    }

    .roulette-item {
      width: 85px;
      height: 85px;
      background: #0a192f;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border: 1px solid #172a45;
      flex-shrink: 0;
      padding: 4px;
    }

    .roulette-item img {
      width: 46px;
      height: 46px;
      object-fit: contain;
    }

    .roulette-item .item-title {
      font-size: 9px;
      color: #90e0ef;
      margin-top: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 75px;
      font-weight: 600;
    }

    .roulette-item .price {
      font-size: 10px;
      color: #ffd700;
      font-weight: 800;
    }

    .open-btn {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 14px;
      background: linear-gradient(135deg, #00b4d8, #0077b6);
      color: #fff;
      font-weight: 900;
      font-size: 16px;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 1px;
      box-shadow: 0 6px 20px rgba(0, 180, 216, 0.4);
      margin-bottom: 24px;
    }

    .open-btn:active { transform: scale(0.98); }
    .open-btn:disabled { opacity: 0.5; filter: grayscale(1); }

    /* CASE CONTENTS */
    .case-contents-title {
      font-size: 13px;
      font-weight: 800;
      margin-bottom: 12px;
      color: #90e0ef;
      text-transform: uppercase;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .contents-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .content-card {
      background: #0a192f;
      border: 1px solid #172a45;
      border-radius: 12px;
      padding: 10px 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .content-card img {
      width: 52px;
      height: 52px;
      object-fit: contain;
      margin-bottom: 6px;
    }

    .content-name {
      font-size: 10px;
      font-weight: 700;
      color: #fff;
      margin-bottom: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 90%;
    }

    .content-price {
      font-size: 11px;
      color: #ffd700;
      font-weight: 800;
    }

    /* PROFILE & INVENTORY */
    .user-profile-card {
      background: #0a192f;
      border: 1px solid #172a45;
      border-radius: 16px;
      padding: 16px;
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 20px;
    }

    .user-avatar {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: linear-gradient(135deg, #00b4d8, #90e0ef);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      font-weight: bold;
      color: #000;
      overflow: hidden;
    }

    .user-avatar img { width: 100%; height: 100%; object-fit: cover; }

    .user-info .username { font-size: 16px; font-weight: 800; }
    .user-info .user-id { font-size: 12px; color: #90e0ef; margin-top: 2px; }

    .inventory-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    .inv-card {
      background: #0a192f;
      border-radius: 12px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      border: 1px solid #172a45;
    }

    .inv-card img {
      width: 60px;
      height: 60px;
      object-fit: contain;
      margin-bottom: 8px;
    }

    .inv-name {
      font-size: 12px;
      font-weight: 700;
      text-align: center;
      margin-bottom: 2px;
    }

    .inv-price {
      font-size: 11px;
      color: #ffd700;
      margin-bottom: 8px;
      font-weight: 800;
    }

    .inv-btns {
      display: flex;
      gap: 6px;
      width: 100%;
    }

    .inv-btn {
      flex: 1;
      padding: 8px 4px;
      border: none;
      border-radius: 8px;
      font-size: 10px;
      font-weight: 800;
      cursor: pointer;
    }

    .btn-sell { background: #e76f51; color: #fff; }
    .btn-withdraw { background: #00b4d8; color: #000; }
