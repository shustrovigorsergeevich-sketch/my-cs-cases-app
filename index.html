<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Panteracases</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #0b0e14;
            color: #ffffff;
            padding-bottom: 90px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background: #151a23;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            position: sticky;
            top: 0;
            z-index: 999;
        }

        .logo-title {
            font-size: 15px;
            font-weight: 700;
            color: #00c6ff;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .balance-box {
            background: rgba(0, 198, 255, 0.1);
            padding: 5px 10px;
            border-radius: 16px;
            border: 1px solid rgba(0, 198, 255, 0.3);
            font-weight: 600;
            font-size: 13px;
        }

        .connect-wallet-btn {
            background: linear-gradient(135deg, #00c6ff, #0072ff);
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 16px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
        }

        .nav-tabs {
            display: flex;
            gap: 6px;
            padding: 10px 16px;
            background: #0f141c;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .tab-btn {
            background: #151a23;
            border: none;
            color: #8b9bb4;
            padding: 8px 14px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
        }

        .tab-btn.active {
            background: linear-gradient(135deg, #00c6ff, #0072ff);
            color: #ffffff;
        }

        .screen {
            display: none;
            padding: 20px;
        }

        .screen.active {
            display: block;
        }

        .case-container {
            text-align: center;
            padding: 10px 0;
        }

        .case-image-wrapper {
            width: 180px;
            height: 180px;
            margin: 0 auto 15px;
            background: #151a23;
            border-radius: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid rgba(0, 198, 255, 0.3);
            font-size: 60px;
        }

        .case-image-wrapper img {
            width: 120px;
            height: 120px;
            object-fit: contain;
        }

        .case-title {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .case-price {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 16px;
            font-weight: 600;
            color: #ffd700;
            margin-bottom: 20px;
            background: rgba(255, 215, 0, 0.1);
            padding: 5px 14px;
            border-radius: 20px;
        }

        .open-btn {
            width: 100%;
            max-width: 320px;
            background: linear-gradient(135deg, #00c6ff, #0072ff);
            color: white;
            border: none;
            padding: 15px;
            border-radius: 16px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
        }

        .roulette-screen {
            text-align: center;
            padding-top: 30px;
        }

        .roulette-window {
            position: relative;
            width: 100%;
            height: 140px;
            background: #151a23;
            border-radius: 20px;
            overflow: hidden;
            border: 2px solid rgba(0, 198, 255, 0.3);
            margin: 30px 0;
        }

        .roulette-pointer {
            position: absolute;
            top: 0; bottom: 0; left: 50%;
            width: 4px;
            background: #ff3b30;
            transform: translateX(-50%);
            z-index: 10;
        }

        .roulette-track {
            display: flex;
            position: absolute;
            left: 0; top: 0;
            height: 100%;
            align-items: center;
        }

        .roulette-item {
            min-width: 110px;
            height: 110px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            margin: 0 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 8px;
            font-size: 32px;
        }

        .roulette-item img { width: 50px; height: 50px; object-fit: contain; margin-bottom: 5px; }
        .roulette-item span { font-size: 11px; color: #8b9bb4; white-space: nowrap; }

        .rewards-section { margin-top: 25px; text-align: left; }
        .section-title { font-size: 15px; font-weight: 600; margin-bottom: 12px; color: #8b9bb4; }

        .rewards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
            gap: 8px;
        }

        .reward-card {
            background: #151a23;
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 10px 4px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            font-size: 28px;
        }

        .reward-card img { width: 40px; height: 40px; object-fit: contain; margin-bottom: 4px; }
        .reward-name { font-size: 10px; font-weight: 600; margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; width: 100%; }
        .reward-price { font-size: 10px; color: #ffd700; font-weight: 600; }

        .inventory-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        .inventory-item {
            background: #151a23;
            border-radius: 14px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            border: 1px solid rgba(255, 255, 255, 0.05);
            text-align: center;
            font-size: 40px;
        }

        .inventory-item img { width: 60px; height: 60px; object-fit: contain; margin-bottom: 8px; }
        .inventory-item .name { font-size: 12px; font-weight: 600; margin-bottom: 2px; }
        .inventory-item .price { font-size: 11px; color: #ffd700; margin-bottom: 8px; }

        .sell-item-btn {
            width: 100%;
            background: rgba(255, 59, 48, 0.15);
            color: #ff453a;
            border: 1px solid rgba(255, 59, 48, 0.3);
            padding: 6px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
        }

        .empty-inventory { text-align: center; color: #8b9bb4; margin-top: 40px; font-size: 13px; }

        .wallet-card {
            background: #151a23;
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 16px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .wallet-card h3 { font-size: 14px; margin-bottom: 6px; }

        .topup-options {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            margin-top: 10px;
        }

        .topup-btn {
            background: rgba(0, 198, 255, 0.1);
            border: 1px solid rgba(0, 198, 255, 0.3);
            color: #ffffff;
            padding: 10px;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            font-size: 12px;
        }

        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.85);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }

        .modal-overlay.show { display: flex; }

        .win-modal {
            background: #151a23;
            width: 85%;
            max-width: 300px;
            border-radius: 20px;
            padding: 20px 16px;
            text-align: center;
            border: 1px solid rgba(0, 198, 255, 0.4);
        }

        .win-modal h2 { font-size: 18px; margin-bottom: 10px; color: #00c6ff; }
        .win-img-container { width: 80px; height: 80px; margin: 10px auto; display: flex; align-items: center; justify-content: center; font-size: 50px; }
        .win-img-container img { width: 100%; height: 100%; object-fit: contain; }
        .win-name { font-size: 15px; font-weight: 700; margin-bottom: 4px; }
        .win-price { font-size: 13px; color: #ffd700; margin-bottom: 16px; font-weight: 600; }
        .modal-buttons { display: flex; gap: 8px; }
        .modal-btn { flex: 1; padding: 9px; border-radius: 9px; font-size: 12px; font-weight: 600; cursor: pointer; border: none; }
        .btn-keep { background: linear-gradient(135deg, #00c6ff, #0072ff); color: white; }
        .btn-sell-modal { background: rgba(255, 59, 48, 0.15); color: #ff453a; border: 1px solid rgba(255, 59, 48, 0.3); }
    </style>
</head>
<body>

    <header>
        <div class="logo-title">Panteracases</div>
        <div class="header-right">
            <div class="balance-box">⭐ <span id="user-balance">500</span></div>
            <button class="connect-wallet-btn" id="wallet-connect-btn">Кошелёк</button>
        </div>
    </header>

    <div class="nav-tabs">
        <button class="tab-btn active" data-tab="case">Кейс</button>
        <button class="tab-btn" data-tab="inventory">Инвентарь (<span id="inv-count">0</span>)</button>
        <button class="tab-btn" data-tab="wallet">Пополнить</button>
    </div>

    <!-- ЭКРАН 1: КЕЙС -->
    <div id="screen-case" class="screen active">
        <div class="case-container">
            <div class="case-image-wrapper">
                <img src="1000023509.png" alt="Gift Box" onerror="this.style.display='none'; this.parentElement.innerText='🎁';">
            </div>
            <div class="case-title">Rare Case</div>
            <div class="case-price">⭐ 200 Stars</div>
            <br>
            <button class="open-btn" id="open-case-btn">Открыть кейс (200 ⭐)</button>
        </div>

        <div class="rewards-section">
            <div class="section-title">Содержимое кейса</div>
            <div class="rewards-grid" id="rewards-grid"></div>
        </div>
    </div>

    <!-- ЭКРАН РУЛЕТКИ -->
    <div id="screen-roulette" class="screen">
        <div class="roulette-screen">
            <h2 style="margin-bottom: 8px;">Открытие кейса...</h2>
            <p style="color: #8b9bb4; font-size: 13px;">Крутим рулетку...</p>
            
            <div class="roulette-window">
                <div class="roulette-pointer"></div>
                <div class="roulette-track" id="roulette-track"></div>
            </div>
        </div>
    </div>

    <!-- ЭКРАН 2: ИНВЕНТАРЬ -->
    <div id="screen-inventory" class="screen">
        <div class="section-title">Ваши выигранные предметы</div>
        <div id="inventory-container" class="inventory-grid"></div>
        <div id="empty-inv" class="empty-inventory">Инвентарь пуст. Откройте кейс!</div>
    </div>

    <!-- ЭКРАН 3: ПОПОЛНЕНИЕ -->
    <div id="screen-wallet" class="screen">
        <div class="wallet-card">
            <h3>Пополнение баланса</h3>
            <p style="color: #8b9bb4; font-size: 11px; margin-bottom: 8px;">
                Нажмите на кнопку, чтобы тестово добавить звёзды на баланс.
            </p>
            <div class="topup-options">
                <button class="topup-btn" data-stars="100">+100 ⭐</button>
                <button class="topup-btn" data-stars="500">+500 ⭐</button>
            </div>
        </div>
    </div>

    <!-- МОДАЛКА ВЫИГРЫША -->
    <div class="modal-overlay" id="win-modal">
        <div class="win-modal">
            <h2>Поздравляем! 🎉</h2>
            <div class="win-img-container">
                <img id="modal-img" src="" alt="" onerror="this.style.display='none'; this.parentElement.innerText='🎁';">
            </div>
            <div class="win-name" id="modal-name">Название</div>
            <div class="win-price" id="modal-price">⭐ 0</div>
            <div class="modal-buttons">
                <button class="modal-btn btn-sell-modal" id="modal-sell-btn">Продать (<span id="modal-sell-price">0</span> ⭐)</button>
                <button class="modal-btn btn-keep" id="modal-keep-btn">В инвентарь</button>
            </div>
        </div>
    </div>

    <script>
        const gifts = [
            { id: 1, name: "Toy Bear", price: 3631, img: "1000023500.png" },
            { id: 2, name: "Signet Ring", price: 3603, img: "1000023514.png" },
            { id: 3, name: "Diamond Ring", price: 3275, img: "1000023514.png" },
            { id: 4, name: "Sky Stilettos", price: 1933, img: "1000023508.png" },
            { id: 5, name: "Love Potion", price: 1563, img: "1000023508.png" },
            { id: 6, name: "Input Key", price: 703, img: "1000023510.png" },
            { id: 7, name: "Gift Box", price: 700, img: "1000023509.png" },
            { id: 8, name: "Restless Jar", price: 700, img: "1000023509.png" },
            { id: 9, name: "Ginger Cookie", price: 600, img: "1000023509.png" },
            { id: 10, name: "Happy Brownie", price: 500, img: "1000023509.png" },
            { id: 11, name: "Instant Ramen", price: 500, img: "1000023509.png" },
            { id: 12, name: "Golden Cup", price: 100, img: "1000023512.png" },
            { id: 13, name: "Simple Ring", price: 100, img: "1000023514.png" },
            { id: 14, name: "Rocket", price: 50, img: "1000023510.png" },
            { id: 15, name: "Small Box", price: 25, img: "1000023509.png" },
            { id: 16, name: "Little Bear", price: 15, img: "1000023500.png" },
            { id: 17, name: "Heart", price: 15, img: "1000023508.png" }
        ];

        let balance = 500; // Стартовый баланс для проверки
        let inventory = [];
        let currentWonItem = null;

        // Переключение вкладок
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.onclick = (e) => {
                const tabId = e.target.getAttribute('data-tab');
                document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                
                document.getElementById(`screen-${tabId}`).classList.add('active');
                e.target.classList.add('active');
            };
        });

        function renderRewardsList() {
            const grid = document.getElementById('rewards-grid');
            grid.innerHTML = gifts.map(g => `
                <div class="reward-card">
                    <img src="${g.img}" alt="${g.name}" onerror="this.style.display='none'; this.parentElement.innerHTML='🎁<div class=\'reward-name\'>${g.name}</div><div class=\'reward-price\'>⭐ ${g.price}</div>';">
                    <div class="reward-name">${g.name}</div>
                    <div class="reward-price">⭐ ${g.price}</div>
                </div>
            `).join('');
        }

        function updateUI() {
            document.getElementById('user-balance').innerText = balance;
            document.getElementById('inv-count').innerText = inventory.length;
            
            const invContainer = document.getElementById('inventory-container');
            const emptyInv = document.getElementById('empty-inv');

            if (inventory.length === 0) {
                invContainer.innerHTML = '';
                emptyInv.style.display = 'block';
            } else {
                emptyInv.style.display = 'none';
                invContainer.innerHTML = inventory.map((item, index) => `
                    <div class="inventory-item">
                        <img src="${item.img}" alt="${item.name}" onerror="this.style.display='none'; this.parentElement.innerHTML='🎁<div class=\'name\'>${item.name}</div><div class=\'price\'>⭐ ${item.price}</div><button class=\'sell-item-btn\' onclick=\'sellInventoryItem(${index})\'>Продать за ⭐ ${item.price}</button>';">
                        <div class="name">${item.name}</div>
                        <div class="price">⭐ ${item.price}</div>
                        <button class="sell-item-btn" onclick="sellInventoryItem(${index})">Продать за ⭐ ${item.price}</button>
                    </div>
                `).join('');
            }
        }

        // Пополнение (тестовое)
        document.querySelectorAll('.topup-btn').forEach(btn => {
            btn.onclick = () => {
                const starsAmount = parseInt(btn.getAttribute('data-stars'));
                balance += starsAmount;
                updateUI();
                alert(`Баланс успешно пополнен на ${starsAmount} ⭐!`);
                document.querySelector('[data-tab="case"]').click();
            };
        });

        // Кнопка кошелька в шапке
        document.getElementById('wallet-connect-btn').onclick = () => {
            document.querySelector('[data-tab="wallet"]').click();
        };

        // Открытие кейса
        document.getElementById('open-case-btn').onclick = () => {
            const caseCost = 200;
            if (balance < caseCost) {
                alert('Недостаточно звёзд!');
                document.querySelector('[data-tab="wallet"]').click();
                return;
            }

            balance -= caseCost;
            updateUI();

            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById('screen-roulette').classList.add('active');

            buildRouletteTrack();
            spinRoulette();
        };

        function buildRouletteTrack() {
            const track = document.getElementById('roulette-track');
            let itemsHTML = '';
            const fullItems = [...gifts, ...gifts, ...gifts, ...gifts, ...gifts];
            
            const winningIndex = Math.floor(Math.random() * gifts.length);
            currentWonItem = gifts[winningIndex];

            const targetPositionIndex = 35;
            fullItems[targetPositionIndex] = currentWonItem;

            fullItems.forEach(item => {
                itemsHTML += `
                    <div class="roulette-item">
                        <img src="${item.img}" alt="${item.name}" onerror="this.style.display='none'; this.parentElement.innerHTML='🎁<span>${item.name}</span>';">
                        <span>${item.name}</span>
                    </div>
                `;
            });

            track.innerHTML = itemsHTML;
            track.style.transition = 'none';
            track.style.transform = 'translateX(0px)';
        }

        function spinRoulette() {
            const track = document.getElementById('roulette-track');
            const itemWidth = 126; 
            const targetIndex = 35;
            const windowWidth = document.querySelector('.roulette-window').offsetWidth;
            const offset = (targetIndex * itemWidth) - (windowWidth / 2) + (itemWidth / 2);

            setTimeout(() => {
                track.style.transi
