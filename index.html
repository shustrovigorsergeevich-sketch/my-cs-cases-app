<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Panteracases</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background: #050b18;
      color: #ffffff;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    header {
      height: 60px;
      padding: 0 16px;
      background: #0a192f;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(0, 180, 216, 0.2);
    }

    .app-title {
      font-weight: 900;
      font-size: 18px;
      color: #00b4d8;
    }

    main {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      padding-bottom: 80px;
    }

    /* Скрываем радиокнопки */
    input[type="radio"] {
      display: none;
    }

    /* Логика показа вкладок через CSS */
    .tab-content { display: none; }

    #tab-main:checked ~ main #content-main,
    #tab-profile:checked ~ main #content-profile,
    #tab-deposit:checked ~ main #content-deposit {
      display: block;
    }

    .card {
      background: #0a192f;
      border: 1px solid rgba(0, 180, 216, 0.3);
      border-radius: 16px;
      padding: 20px;
      text-align: center;
      margin-bottom: 15px;
    }

    nav {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      height: 60px;
      background: #0a192f;
      display: flex;
      border-top: 1px solid rgba(0, 180, 216, 0.2);
      z-index: 999;
    }

    .nav-btn {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #7090b0;
      background: none;
      border: none;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
    }

    /* Подсветка активной кнопки навигации */
    #tab-main:checked ~ nav label[for="tab-main"],
    #tab-profile:checked ~ nav label[for="tab-profile"],
    #tab-deposit:checked ~ nav label[for="tab-deposit"] {
      color: #00b4d8;
    }
  </style>
</head>
<body>

  <!-- Скрытые переключатели вкладок -->
  <input type="radio" name="tabs" id="tab-profile">
  <input type="radio" name="tabs" id="tab-main" checked>
  <input type="radio" name="tabs" id="tab-deposit">

  <header>
    <div class="app-title">Panteracases</div>
    <div style="color: #ffd700; font-weight: bold;">1000 ⭐</div>
  </header>

  <main>
    <div id="content-main" class="tab-content">
      <div class="card">
        <h2>Главная страница</h2>
        <p style="margin-top: 10px; color: #90e0ef;">Вкладки переключаются на чистом CSS!</p>
      </div>
    </div>

    <div id="content-profile" class="tab-content">
      <div class="card">
        <h2>Профиль игрока</h2>
        <p style="margin-top: 10px; color: #90e0ef;">Здесь твой профиль.</p>
      </div>
    </div>

    <div id="content-deposit" class="tab-content">
      <div class="card">
        <h2>Пополнение баланса</h2>
        <p style="margin-top: 10px; color: #90e0ef;">Здесь пополнение звёзд.</p>
      </div>
    </div>
  </main>

  <nav>
    <label class="nav-btn" for="tab-profile">
      <span>👤</span><span>Профиль</span>
    </label>
    <label class="nav-btn" for="tab-main">
      <span>🏠</span><span>Главная</span>
    </label>
    <label class="nav-btn" for="tab-deposit">
      <span>⭐</span><span>Пополнить</span>
    </label>
  </nav>

  <script>
    const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
    if (tg) {
      try {
        tg.ready();
        tg.expand();
      } catch (e) {}
    }
  </script>
</body>
</html>
