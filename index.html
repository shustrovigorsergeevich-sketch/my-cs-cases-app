<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Panteracases</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background: #050c1e;
      background-image: radial-gradient(circle at 50% 20%, #0d1b3e 0%, #050c1e 80%);
      color: #ffffff;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    header {
      height: 60px;
      padding: 0 16px;
      background: rgba(8, 19, 43, 0.9);
      backdrop-filter: blur(12px);
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(0, 180, 216, 0.2);
      flex-shrink: 0;
      z-index: 100;
    }

    .app-title {
      font-weight: 900;
      font-size: 18px;
      background: linear-gradient(90deg, #00b4d8, #90e0ef);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .balance-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      background: #091530;
      padding: 6px 14px;
      border-radius: 20px;
      border: 1px solid rgba(0, 180, 216, 0.35);
      cursor: pointer;
      box-shadow: 0 0 12px rgba(0, 180, 216, 0.2);
    }

    .balance-badge:active { transform: scale(0.95); }

    .balance-amount {
      font-weight: 800;
      font-size: 14px;
      color: #ffd700;
      text-shadow: 0 0 8px rgba(255, 215, 0, 0.3);
    }

    .add-btn {
      background: #00b4d8;
      color: #000;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 900;
      box-shadow: 0 0 8px #00b4d8;
    }

    main {
      flex: 1;
      position: relative;
      overflow-y: auto;
      padding: 16px;
      padding-bottom: 80px;
      z-index: 1;
      background: transparent;
    }

    .tab-content { display: none; }
    .tab-content.active { display: block; }

    .section-header-title {
      font-size: 14px;
      font-weight: 800;
      margin-bottom: 14px;
      text-transform: uppercase;
      color: #90e0ef;
      letter-spacing: 0.5px;
      text-align: center;
    }

    /* Главный кейс */
    .single-case-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin-top: 20px;
      width: 100%;
    }

    .main-case-card {
      width: 100%;
      max-width: 330px;
      background: linear-gradient(160deg, #0d2046 0%, #08142c 100%);
      border: 2px solid rgba(0, 180, 216, 0.4);
      border-radius: 24px;
      padding: 28px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      cursor: pointer;
      transition: all 0.25s ease;
      box-shadow: 0 14px 35px rgba(0,0,0,0.6), 0 0 25px rgba(0,180,216,0.2);
    }

    .main-case-card:active {
      transform: scale(0.97);
      border-color: #00b4d8;
      box-shadow: 0 0 30px rgba(0,180,216,0.4);
    }

    .main-case-img {
      width: 140px;
      height: 140px;
      object-fit: contain;
      background: radial-gradient(circle, rgba(0,180,216,0.3) 0%, rgba(0,0,0,0) 70%);
      border-radius: 20px;
      margin-bottom: 18px;
    }

    .main-case-title {
      font-size: 24px;
      font-weight: 900;
      margin-bottom: 6px;
      color: #fff;
    }

    .main-case-sub {
      font-size: 13px;
      color: #90e0ef;
      margin-bottom: 18px;
    }

    .main-case-price {
      font-size: 18px;
      font-weight: 900;
      color: #ffd700;
      background: #050d22;
      padding: 10px 24px;
      border-radius: 14px;
      border: 1px solid rgba(255, 215, 0, 0.4);
      box-shadow: 0 0 15px rgba(255,215,0,0.2);
      width: 100%;
    }

    .back-to-cases {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      font-weight: 700;
      color: #00b4d8;
      cursor: pointer;
      margin-bottom: 14px;
    }

    .case-card {
      width: 100%;
      background: linear-gradient(160deg, #0d2046 0%, #08142c 100%);
      border-radius: 20px;
      padding: 16px;
      text-align: center;
      border: 1px solid rgba(0, 180, 216, 0.3);
      margin-bottom: 14px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }

    .case-image-wrap {
      width: 90px;
      height: 90px;
      margin: 0 auto 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle, rgba(0,180,216,0.25) 0%, rgba(0,0,0,0) 70%);
    }

    .case-image-wrap img { width: 100%; height: 100%; object-fit: contain; }
    .case-title { font-size: 18px; font-weight: 900; margin-bottom: 2px; }
    .case-subtitle { font-size: 12px; color: #90e0ef; }

    /* Контейнер для нескольких рулеток (лент) */
    .roulettes-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 16px;
    }

    .roulette-wrapper {
      width: 100%;
      height: 95px;
      position: relative;
      overflow: hidden;
      border-radius: 14px;
      background: #030814;
      border: 2px solid #00b4d8;
      pointer-events: none;
      box-shadow: inset 0 0 15px rgba(0,0,0,0.9), 0 0 12px rgba(0,180,216,0.25);
    }

    .roulette-wrapper::before {
      content: '';
      position: absolute;
      top: 0; bottom: 0; left: 50%;
      width: 4px;
      background: linear-gradient(180deg, #ffd700, #ffaa00);
      transform: translateX(-50%);
      z-index: 10;
      box-shadow: 0 0 10px #ffd700;
    }

    .roulette-track {
      display: flex;
      gap: 10px;
      position: absolute;
      top: 8px; left: 0;
      will-change: transform;
    }

    .roulette-item {
      width: 80px;
      height: 80px;
      background: linear-gradient(145deg, #0a1836, #061024);
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(0, 180, 216, 0.25);
      flex-shrink: 0;
      padding: 4px;
    }

    .roulette-item.winner-highlight {
      border-color: #ffd700 !important;
      background: linear-gradient(145deg, #241e06, #0e0c03) !important;
      box-shadow: 0 0 15px rgba(255, 215, 0, 0.6);
    }

    .roulette-item img { width: 42px; height: 42px; object-fit: contain; }
    .roulette-item .item-title {
      font-size: 8px;
      color: #90e0ef;
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 72px;
      font-weight: 700;
    }
    .roulette-item .price { font-size: 9px; color: #ffd700; font-weight: 800; }

    /* Выбор режима х1..х5 */
    .multi-open-selector {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
      justify-content: center;
    }

    .multi-btn {
      flex: 1;
      padding: 10px 0;
      background: #081530;
      border: 1px solid rgba(0, 180, 216, 0.3);
      border-radius: 12px;
      color: #90e0ef;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      transition: 0.2s;
      text-align: center;
    }

    .multi-btn.active {
      background: linear-gradient(135deg, #00b4d8, #0077b6);
      color: #fff;
      border-color: #00b4d8;
      box-shadow: 0 0 12px rgba(0, 180, 216, 0.4);
    }

    .open-btn {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 14px;
      background: linear-gradient(135deg, #00b4d8, #0077b6);
      color: #fff;
      font-weight: 900;
      font-size: 16px;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 1px;
      box-shadow: 0 6px 20px rgba(0, 180, 216, 0.35);
      margin-bottom: 20px;
      transition: 0.2s;
    }
    .open-btn:active { transform: scale(0.98); }
    .open-btn:disabled { opacity: 0.5; filter: grayscale(1); }

    .case-contents-title {
      font-size: 13px;
      font-weight: 800;
      margin-bottom: 12px;
      color: #90e0ef;
      text-transform: uppercase;
    }

    .contents-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .content-card {
      background: linear-gradient(160deg, #0b1a38 0%, #061126 100%);
      border: 1px solid rgba(0, 180, 216, 0.2);
      border-radius: 12px;
      padding: 10px 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }
    .content-card img { width: 52px; height: 52px; object-fit: contain; margin-bottom: 6px; }
    .content-name {
      font-size: 10px;
      font-weight: 700;
      color: #fff;
      margin-bottom: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 90%;
    }
    .content-price { font-size: 11px; color: #ffd700; font-weight: 800; }

    /* Профиль и Инвентарь */
    .user-profile-card {
      background: linear-gradient(160deg, #0d2046 0%, #08142c 100%);
      border: 1px solid rgba(0, 180, 216, 0.3);
      border-radius: 16px;
      padding: 16px;
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 20px;
    }
    .user-avatar {
      width: 56px; height: 56px; border-radius: 50%;
      background: linear-gradient(135deg, #00b4d8, #90e0ef);
      display: flex; align-items: center; justify-content: center;
      font-size: 22px; font-weight: bold; color: #000000; overflow: hidden;
    }
    .user-info .username { font-size: 16px; font-weight: 800; }
    .user-info .user-id { font-size: 12px; color: #90e0ef; margin-top: 2px; }

    .inventory-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }
    .inv-card {
      background: linear-gradient(160deg, #0b1a38 0%, #061126 100%);
      border-radius: 12px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      border: 1px solid rgba(0, 180, 216, 0.25);
    }
    .inv-card img { width: 60px; height: 60px; object-fit: contain; margin-bottom: 8px; }
    .inv-name { font-size: 12px; font-weight: 700; text-align: center; margin-bottom: 2px; }
    .inv-price { font-size: 11px; color: #ffd700; margin-bottom: 8px; font-weight: 800; }
    .inv-btns { display: flex; gap: 6px; width: 100%; }
    .inv-btn { flex: 1; padding: 8px 4px; border: none; border-radius: 8px; font-size: 10px; font-weight: 800; cursor: pointer; }
    .btn-sell { background: #e76f51; color: #fff; }
    .btn-withdraw { background: #00b4d8; color: #000; }

    /* Пополнение */
    .deposit-box {
      background: linear-gradient(160deg, #0d2046 0%, #08142c 100%);
      border: 1px solid rgba(0, 180, 216, 0.3);
      border-radius: 20px;
      padding: 20px;
      text-align: center;
    }
    .deposit-input-group {
      position: relative;
      margin: 16px 0;
    }
    .deposit-input {
      width: 100%;
      background: #040a17;
      border: 2px solid rgba(0, 180, 216, 0.3);
      border-radius: 14px;
      padding: 14px 50px 14px 16px;
      color: #ffd700;
      font-size: 18px;
      font-weight: 800;
      outline: none;
      transition: 0.2s;
    }
    .deposit-input:focus {
      border-color: #00b4d8;
      box-shadow: 0 0 15px rgba(0, 180, 216, 0.3);
    }
    .deposit-input-icon {
      position: absolute;
      right: 16px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 20px;
    }
    .deposit-hint {
      font-size: 12px;
      color: #90e0ef;
      margin-bottom: 16px;
    }

    /* Меню */
    nav {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      height: 60px;
      background: rgba(8, 19, 43, 0.95);
      backdrop-filter: blur(12px);
      display: flex;
      border-top: 1px solid rgba(0, 180, 216, 0.2);
      z-index: 999;
    }
    .nav-btn {
      flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
      color: #48cae4; background: none; border: none; font-size: 11px; font-weight: 700; cursor: pointer; gap: 4px;
    }
    .nav-btn.active { color: #00b4d8; text-shadow: 0 0 10px rgba(0,180,216,0.5); }

    /* Модалка */
    .modal {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(3, 8, 20, 0.92);
      backdrop-filter: blur(8px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 20px;
    }
    .modal-box {
      background: linear-gradient(160deg, #0d2046 0%, #061124 100%);
      border-radius: 24px;
      padding: 24px 20px;
      width: 100%;
      max-width: 340px;
      text-align: center;
      border: 2px solid #ffd700;
      box-shadow: 0 0 35px rgba(255, 215, 0, 0.3);
      max-height: 85vh;
      overflow-y: auto;
    }

    .won-items-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(80px, 1fr));
      gap: 10px;
      margin: 14px 0;
      max-height: 250px;
      overflow-y: auto;
      padding: 4px;
    }

    .won-item-card {
      background: rgba(4, 10, 24, 0.85);
      border: 1px solid rgba(255, 215, 0, 0.4);
      border-radius: 12px;
      padding: 8px 4px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .won-item-card img { width: 46px; height: 46px; object-fit: contain; margin-bottom: 4px; }
    .won-item-title { font-size: 10px; font-weight: 700; color: #fff; margin-bottom: 2px; }
    .won-item-price { font-size: 10px; color: #ffd700; font-weight: 800; }

    .modal-actions { display: flex; flex-direction: column; gap: 10px; margin-top: 14px; }
  </style>
</head>
<body>

  <header>
    <div class="app-title">Panteracases</div>
    <div class="balance-badge" onclick="openTab('deposit')">
      <span>⭐</span>
      <span class="balance-amount" id="balance">1000</span>
      <div class="add-btn">+</div>
    </div>
  </header>

  <main>
    <div id="tab-main" class="tab-content active">
      <div id="casesListScreen">
        <div class="section-header-title">Доступный кейс</div>
        
        <div class="single-case-container">
          <div class="main-case-card" onclick="openCaseDetail()">
            <img class="main-case-img" src="file_000000003e50821180f255969ab14c38.png" alt="Panteracases">
            <div class="main-case-title">Panteracases</div>
            <div class="main-case-sub">Редкие и сундучные NFT подарки</div>
            <div class="main-case-price">200 ⭐</div>
          </div>
        </div>
      </div>

      <div id="caseOpenScreen" style="display: none;">
        <div class="back-to-cases" onclick="closeCaseDetail()">← На главную</div>
        
        <div class="case-card">
          <div class="case-image-wrap">
            <img src="file_000000003e50821180f255969ab14c38.png" alt="Panteracases">
          </div>
          <div class="case-title">Panteracases</div>
          <div class="case-subtitle">Испытай удачу и выбей редкий подарок</div>
        </div>

        <!-- Динамический контейнер для рулеток -->
        <div class="roulettes-container" id="roulettesContainer"></div>

        <div class="multi-open-selector">
          <button class="multi-btn active" onclick="setOpenCount(1, this)">x1</button>
          <button class="multi-btn" onclick="setOpenCount(2, this)">x2</button>
          <button class="multi-btn" onclick="setOpenCount(3, this)">x3</button>
          <button class="multi-btn" onclick="setOpenCount(4, this)">x4</button>
          <button class="multi-btn" onclick="setOpenCount(5, this)">x5</button>
        </div>

        <button class="open-btn" id="openBtn" onclick="spinCase()">Открыть x1 за 200 ⭐</button>

        <div class="case-contents-title">Содержимое кейса</div>
        <div class="contents-grid" id="contentsGrid"></div>
      </div>
    </div>

    <div id="tab-profile" class="tab-content">
      <div class="user-profile-card">
        <div class="user-avatar" id="userAvatar">U</div>
        <div class="user-info">
          <div class="username" id="userName">Игрок</div>
          <div class="user-id" id="userId">ID: ---</div>
        </div>
      </div>
      <div class="section-header-title">Мой инвентарь</div>
      <div class="inventory-grid" id="inventoryGrid"></div>
    </div>

    <div id="tab-deposit" class="tab-content">
      <div class="section-header-title">Пополнение баланса Stars</div>
      <div class="deposit-box">
        <div style="font-size: 32px; margin-bottom: 8px;">⭐</div>
        <div style="font-size: 16px; font-weight: 800; margin-bottom: 4px;">Telegram Stars</div>
        <div class="deposit-hint">Минимальная сумма пополнения: 100 ⭐</div>
        
        <div class="deposit-input-group">
          <input type="number" id="depositInput" class="deposit-input" placeholder="Введите сумму" min="100">
          <div class="deposit-input-icon">⭐</div>
        </div>

        <button class="open-btn" onclick="processDeposit()">Пополнить Stars</button>
      </div>
    </div>
  </main>

  <div class="modal" id="winModal">
    <div class="modal-box">
      <h3 style="color: #ffd700; font-size: 18px; text-transform: uppercase; font-weight: 900;" id="winModalHeader">ВЫ ВЫИГРАЛИ!</h3>
      
      <div class="won-items-grid" id="wonItemsGrid"></div>

      <div id="winTotalValue" style="color: #ffd700; font-size: 15px; margin-bottom: 12px; font-weight: 800;"></div>
      
      <div class="modal-actions">
        <button class="open-btn" onclick="closeWinModal()" style="margin-bottom: 0; padding: 12px;">Забрать в инвентарь</button>
        <button class="open-btn" onclick="sellWonItemsInstantly()" style="margin-bottom: 0; padding: 12px; background: linear-gradient(135deg, #e76f51, #f4a261);">Продать все за баланс</button>
      </div>
    </div>
  </div>

  <nav>
    <button class="nav-btn" onclick="openTab('profile')" id="nav-profile">
      <span>👤</span><span>Профиль</span>
    </button>
    <button class="nav-btn active" onclick="openTab('main')" id="nav-main">
      <span>🏠</span><span>Главная</span>
    </button>
    <button class="nav-btn" onclick="openTab('deposit')" id="nav-deposit">
      <span>⭐</span><span>Пополнить</span>
    </button>
  </nav>

  <script>
    const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
    if (tg) {
      try { tg.ready(); tg.expand(); } catch (e) {}
    }

    const GIFTS = [
      { name: "Loot Bag", price: 12525, chance: 0.1, file: "Loot Bag.webp" },
      { name: "Bonded Ring", price: 4603, chance: 0.05, file: "Bonded Ring.webp" },
      { name: "Toy Bear", price: 3631, chance: 0.1, file: "Toy Bear.webp" },
      { name: "Diamond Ring", price: 3275, chance: 0.15, file: "Diamond Ring.webp" },
      { name: "Sky Stilettos", price: 1933, chance: 0.3, file: "Sky Stilettos.webp" },
      { name: "Love Potion", price: 1563, chance: 0.5, file: "Love Potion.webp" },
      { name: "Light Sword", price: 720, chance: 1.5, file: "Light Sword.webp" },
      { name: "Input Key", price: 703, chance: 1.5, file: "Input Key.webp" },
      { name: "Restless Jar", price: 702, chance: 1.5, file: "Restless Jar.webp" },
      { name: "Ginger Cookie", price: 600, chance: 2.0, file: "Ginger Cookie.webp" },
      { name: "Happy Brownie", price: 500, chance: 2.5, file: "Happy Brownie.webp" },
      { name: "Instant Ramen", price: 500, chance: 2.5, file: "Instant Ramen.webp" },
      { name: "ring", price: 100, chance: 14.9, file: "IMG_20261005_210455_132.png" },
      { name: "cup", price: 100, chance: 14.9, file: "IMG_20261005_210450_447.png" },
      { name: "rocket", price: 50, chance: 18.0, file: "IMG_20261005_210442_380.png" },
      { name: "Gift box", price: 25, chance: 19.0, file: "IMG_20261005_210438_497.png" },
      { name: "heart", price: 15, chance: 20.2, file: "IMG_20261005_210432_775.png" },
      { name: "bear", price: 15, chance: 20.3, file: "IMG_20261005_210325_616.png" }
    ];

    let userBalance = 1000;
    let inventory = [];
    let currentWonItems = []; 
    let isSpinning = false;
    let selectedOpenCount = 1;
    let activeTabName = 'main';
    let isDetailScreenOpen = false;

    const CASE_PRICE = 200;

    function getRandomGiftByChance() {
      const totalChance = GIFTS.reduce((sum, item) => sum + item.chance, 0);
      let rand = Math.random() * totalChance;
      for (let item of GIFTS) {
        if (rand < item.chance) return item;
        rand -= item.chance;
      }
      return GIFTS[GIFTS.length - 1];
    }

    function updateBalanceUI() {
      document.getElementById('balance').innerText = userBalance;
    }

    function setOpenCount(count, btnElement) {
      if (isSpinning) return;
      selectedOpenCount = count;
      document.querySelectorAll('.multi-btn').forEach(btn => btn.classList.remove('active'));
      if (btnElement) btnElement.classList.add('active');
      
      const totalPrice = CASE_PRICE * selectedOpenCount;
      document.getElementById('openBtn').innerText = `Открыть x${selectedOpenCount} за ${totalPrice} ⭐`;

      renderRouletteTracks(selectedOpenCount);
    }

    function openTab(tabName) {
      activeTabName = tabName;
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('nav .nav-btn').forEach(el => el.classList.remove('active'));
      
      document.getElementById('tab-' + tabName).classList.add('active');
      const navBtn = document.getElementById('nav-' + tabName);
      if (navBtn) navBtn.classList.add('active');

      if (tabName === 'profile') renderInventory();
      if (tabName === 'deposit') document.getElementById('depositInput').value = '';
    }

    function openCaseDetail() {
      isDetailScreenOpen = true;
      document.getElementById('casesListScreen').style.display = 'none';
      document.getElementById('caseOpenScreen').style.display = 'block';
      renderRouletteTracks(selectedOpenCount);
    }

    function closeCaseDetail() {
      if (isSpinning) return;
      isDetailScreenOpen = false;
      document.getElementById('caseOpenScreen').style.display = 'none';
      document.getElementById('casesListScreen').style.display = 'block';
    }

    function renderContentsGrid() {
      const grid = document.getElementById('contentsGrid');
      if (!grid) return;
      grid.innerHTML = GIFTS.map(item => `
        <div class="content-card">
          <img src="${item.file}" alt="${item.name}">
          <div class="content-name">${item.name}</div>
          <div class="content-price">${item.price} ⭐</div>
        </div>
      `).join('');
    }

    /* Генерация N рулеток под количество x1..x5 */
    function renderRouletteTracks(count) {
      const container = document.getElementById('roulettesContainer');
      if (!container) return;

      let html = '';
      for (let r = 0; r < count; r++) {
        let itemsHtml = '';
        for (let i = 0; i < 15; i++) {
          const item = GIFTS[Math.floor(Math.random() * GIFTS.length)];
          itemsHtml += `
            <div class="roulette-item">
              <img src="${item.file}" alt="${item.name}">
              <div class="item-title">${item.name}</div>
              <div class="price">${item.price} ⭐</div>
            </div>
          `;
        }

        html += `
          <div class="roulette-wrapper">
            <div class="roulette-track" id="rouletteTrack_${r}">${itemsHtml}</div>
          </div>
        `;
      }
      container.innerHTML = html;
    }

    function spinCase() {
      if (isSpinning) return;

      const totalPrice = CASE_PRICE * selectedOpenCount;

      if (userBalance < totalPrice) {
        alert("Недостаточно средств! Пополните баланс.");
        openTab('deposit');
        return;
      }

      userBalance -= totalPrice;
      updateBalanceUI();
      isSpinning = true;
      document.getElementById('openBtn').disabled = true;

      currentWonItems = [];
      for (let i = 0; i < selectedOpenCount; i++) {
        currentWonItems.push(getRandomGiftByChance());
      }

      currentWonItems.forEach(item => inventory.push(item));

      const totalItemsBeforeWinner = 35;
      const itemWidth = 90; 

      for (let r = 0; r < selectedOpenCount; r++) {
        const track = document.getElementById(`rouletteTrack_${r}`);
        const winningDisplayItem = currentWonItems[r];

        let itemsHtml = '';
        for (let i = 0; i < totalItemsBeforeWinner; i++) {
          const item = GIFTS[Math.floor(Math.random() * GIFTS.length)];
          itemsHtml += `
            <div class="roulette-item">
              <img src="${item.file}" alt="${item.name}">
              <div class="item-title">${item.name}</div>
              <div class="price">${item.price} ⭐</div>
            </div>
          `;
        }

        itemsHtml += `
          <div class="roulette-item winner-highlight">
            <img src="${winningDisplayItem.file}" alt="${winningDisplayItem.name}">
            <div class="item-title">${winningDisplayItem.name}</div>
            <div class="price">${winningDisplayItem.price} ⭐</div>
          </div>
        `;

        for (let i = 0; i < 10; i++) {
          const item = GIFTS[Math.floor(Math.random() * GIFTS.length)];
          itemsHtml += `
            <div class="roulette-item">
              <img src="${item.file}" alt="${item.name}">
              <div class="item-title">${item.name}</div>
              <div class="price">${item.price} ⭐</div>
            </div>
          `;
        }

        track.style.transition = 'none';
        track.style.transform = 'translateX(0px)';
        track.innerHTML = itemsHtml;

        void track.offsetWidth;

        const wrapperWidth = track.parentElement.clientWidth;
        const targetOffset = (totalItemsBeforeWinner * itemWidth) - (wrapperWidth / 2) + (itemWidth / 2) + (Math.random() * 20 - 10);

        const duration = 3.2 + (r * 0.2); 
        track.style.transition = `transform ${duration}s cubic-bezier(0.12, 0.8, 0.22, 1)`;
        track.style.transform = `translateX(-${targetOffset}px)`;
      }

      const maxWaitTime = (3.2 + ((selectedOpenCount - 1) * 0.2)) * 1000 + 300;

      setTimeout(() => {
        isSpinning = false;
        document.getElementById('openBtn').disabled = false;

        if (activeTabName === 'main' && isDetailScreenOpen) {
          showWinModal();
        } else {
          currentWonItems = [];
          renderRouletteTracks(selectedOpenCount);
        }
      }, maxWaitTime);
    }

    function showWinModal() {
      const grid = document.getElementById('wonItemsGrid');
      grid.innerHTML = currentWonItems.map(item => `
        <div class="won-item-card">
          <img src="${item.file}" alt="${item.name}">
          <div class="won-item-title">${item.name}</div>
          <div class="won-item-price">${item.price} ⭐</div>
        </div>
      `).join('');

      const totalVal = currentWonItems.reduce((sum, item) => sum + item.price, 0);
      document.getElementById('winTotalValue').innerText = `Общая ценность: ${totalVal} ⭐`;
      document.getElementById('winModalHeader').innerText = currentWonItems.length > 1 ? `ВЫИГРЫШ (x${currentWonItems.length})!` : "ВЫ ВЫИГРАЛИ!";
      
      document.getElementById('winModal').style.display = 'flex';
    }

    function closeWinModal() {
      document.getElementById('winModal').style.display = 'none';
      currentWonItems = [];
      renderRouletteTracks(selectedOpenCount);
    }

    function sellWonItemsInstantly() {
      if (currentWonItems.length > 0) {
        const totalVal = currentWonItems.reduce((sum, item) => sum + item.price, 0);
        userBalance += totalVal;
        
        for (let i = 0; i < currentWonItems.length; i++) {
          inventory.pop();
        }
        
        updateBalanceUI();
        currentWonItems = [];
      }
      document.getElementById('winModal').style.display = 'none';
      renderRouletteTracks(selectedOpenCount);
    }

    function renderInventory() {
      const grid = document.getElementById('inventoryGrid');
      if (!grid) return;
      if (inventory.length === 0) {
        grid.innerHTML = `<div style="grid-column: span 2; text-align: center; color: #90e0ef; padding: 30px; font-size: 13px;">Инвентарь пуст. Открывайте кейсы!</div>`;
        return;
      }
      grid.innerHTML = inventory.map((item, index) => `
        <div class="inv-card">
          <img src="${item.file}" alt="${item.name}">
          <div class="inv-name">${item.name}</div>
          <div class="inv-price">${item.price} ⭐</div>
          <div class="inv-btns">
            <button class="inv-btn btn-sell" onclick="sellFromInventory(${index})">Продать</button>
            <button class="inv-btn btn-withdraw" onclick="withdrawItem(${index})">Вывести</button>
          </div>
        </div>
      `).join('');
    }

    function sellFromInventory(index) {
      userBalance += inventory[index].price;
      inventory.splice(index, 1);
      updateBalanceUI();
      renderInventory();
    }
