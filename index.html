<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Кейсы</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background: #060c1f; /* Глубокий синий фон */
      color: #ffffff;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* HEADER */
    header {
      height: 60px;
      padding: 0 16px;
      background: #0a192f;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #172a45;
      flex-shrink: 0;
      z-index: 100;
    }

    .app-title {
      font-weight: 900;
      font-size: 18px;
      background: linear-gradient(90deg, #00b4d8, #90e0ef);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .balance-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      background: #060c1f;
      padding: 6px 14px;
      border-radius: 20px;
      border: 1px solid #00b4d844;
      cursor: pointer;
      box-shadow: 0 0 10px rgba(0, 180, 216, 0.2);
    }

    .balance-amount {
      font-weight: 800;
      font-size: 14px;
      color: #ffd700;
    }

    .add-btn {
      background: #00b4d8;
      color: #000;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 900;
    }

    /* MAIN CONTAINER */
    main {
      flex: 1;
      position: relative;
      overflow-y: auto;
      padding: 16px;
      padding-bottom: 80px;
      z-index: 1;
      background: #060c1f; /* Синий фон для всех вкладок */
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    /* CASE CARD */
    .case-card {
      width: 100%;
      background: #0a192f;
      border-radius: 20px;
      padding: 20px 16px;
      text-align: center;
      border: 1px solid #172a45;
      margin-bottom: 16px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    }

    .case-image-wrap {
      width: 140px;
      height: 140px;
      margin: 0 auto 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle, rgba(0,180,216,0.2) 0%, rgba(0,0,0,0) 70%);
      filter: drop-shadow(0 0 15px rgba(0,180,216,0.4));
    }

    .case-image-wrap img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .case-title {
      font-size: 22px;
      font-weight: 900;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }

    .case-subtitle {
      font-size: 12px;
      color: #90e0ef;
    }

    /* ROULETTE */
    .roulette-wrapper {
      width: 100%;
      height: 105px;
      position: relative;
      overflow: hidden;
      border-radius: 16px;
      background: #030814;
      border: 2px solid #00b4d8;
      margin-bottom: 16px;
      pointer-events: none;
      box-shadow: inset 0 0 20px rgba(0,0,0,0.8), 0 0 15px rgba(0,180,216,0.3);
    }

    .roulette-wrapper::before {
      content: '';
      position: absolute;
      top: 0;
      bottom: 0;
      left: 50%;
      width: 4px;
      background: #ffd700;
      transform: translateX(-50%);
      z-index: 10;
      box-shadow: 0 0 12px #ffd700, 0 0 20px #ffd700;
    }

    .roulette-track {
      display: flex;
      gap: 10px;
      position: absolute;
      top: 10px;
      left: 0;
      will-change: transform;
    }

    .roulette-item {
      width: 85px;
      height: 85px;
      background: #0a192f;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border: 1px solid #172a45;
      flex-shrink: 0;
      padding: 4px;
    }

    .roulette-item img {
      width: 46px;
      height: 46px;
      object-fit: contain;
    }

    .roulette-item .item-title {
      font-size: 9px;
      color: #90e0ef;
      margin-top: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 75px;
      font-weight: 600;
    }

    .roulette-item .price {
      font-size: 10px;
      color: #ffd700;
      font-weight: 800;
    }

    .open-btn {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 14px;
      background: linear-gradient(135deg, #00b4d8, #0077b6);
      color: #fff;
      font-weight: 900;
      font-size: 16px;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 1px;
      box-shadow: 0 6px 20px rgba(0, 180, 216, 0.4);
      margin-bottom: 24px;
    }

    .open-btn:active {
      transform: scale(0.98);
    }

    .open-btn:disabled {
      opacity: 0.5;
      filter: grayscale(1);
    }

    /* CASE CONTENTS (СИНИЙ ФОН) */
    .case-contents-title {
      font-size: 13px;
      font-weight: 800;
      margin-bottom: 12px;
      color: #90e0ef;
      text-transform: uppercase;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .contents-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .content-card {
      background: #0a192f; /* Синий фон карточек */
      border: 1px solid #172a45;
      border-radius: 12px;
      padding: 10px 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .content-card img {
      width: 52px;
      height: 52px;
      object-fit: contain;
      margin-bottom: 6px;
    }

    .content-name {
      font-size: 10px;
      font-weight: 700;
      color: #fff;
      margin-bottom: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 90%;
    }

    .content-price {
      font-size: 11px;
      color: #ffd700;
      font-weight: 800;
    }

    /* PROFILE & INVENTORY (СИНИЙ ФОН) */
    .user-profile-card {
      background: #0a192f;
      border: 1px solid #172a45;
      border-radius: 16px;
      padding: 16px;
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 20px;
    }

    .user-avatar {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: linear-gradient(135deg, #00b4d8, #90e0ef);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      font-weight: bold;
      color: #000;
      overflow: hidden;
    }

    .user-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .user-info .username {
      font-size: 16px;
      font-weight: 800;
    }

    .user-info .user-id {
      font-size: 12px;
      color: #90e0ef;
      margin-top: 2px;
    }

    .inventory-section-title {
      font-size: 14px;
      font-weight: 800;
      margin-bottom: 12px;
      text-transform: uppercase;
      color: #90e0ef;
    }

    .inventory-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    .inv-card {
      background: #0a192f; /* Синий фон в инвентаре */
      border-radius: 12px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      border: 1px solid #172a45;
    }

    .inv-card img {
      width: 60px;
      height: 60px;
      object-fit: contain;
      margin-bottom: 8px;
    }

    .inv-name {
      font-size: 12px;
      font-weight: 700;
      text-align: center;
      margin-bottom: 2px;
    }

    .inv-price {
      font-size: 11px;
      color: #ffd700;
      margin-bottom: 8px;
      font-weight: 800;
    }

    .inv-btns {
      display: flex;
      gap: 6px;
      width: 100%;
    }

    .inv-btn {
      flex: 1;
      padding: 8px 4px;
      border: none;
      border-radius: 8px;
      font-size: 10px;
      font-weight: 800;
      cursor: pointer;
    }

    .btn-sell { background: #e76f51; color: #fff; }
    .btn-withdraw { background: #2a9d8f; color: #fff; }

    /* DEPOSIT */
    .deposit-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .stars-pack-card {
      background: #0a192f;
      border: 1px solid #172a45;
      border-radius: 16px;
      padding: 16px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .stars-pack-card .stars-amount {
      font-size: 20px;
      font-weight: 900;
      color: #ffd700;
      margin: 8px 0 12px;
    }

    .buy-stars-btn {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(135deg, #00b4d8, #0077b6);
      color: #fff;
      font-weight: 900;
      font-size: 12px;
      cursor: pointer;
      text-transform: uppercase;
    }

    /* NAVIGATION */
    nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 60px;
      background: #0a192f;
      display: flex;
      border-top: 1px solid #172a45;
      z-index: 999;
    }

    .nav-btn {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #48cae4;
      background: none;
      border: none;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      gap: 4px;
    }

    .nav-btn.active {
      color: #00b4d8;
    }

    /* MODAL */
    .modal {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(6, 12, 31, 0.92);
      backdrop-filter: blur(5px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 20px;
    }

    .modal-box {
      background: #0a192f;
      border-radius: 20px;
      padding: 24px 20px;
      width: 100%;
      max-width: 300px;
      text-align: center;
      border: 2px solid #00b4d8;
      box-shadow: 0 0 30px rgba(0, 180, 216, 0.4);
    }

    .modal-box img {
      width: 100px;
      height: 100px;
      object-fit: contain;
      margin: 14px 0;
    }

    .modal-actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 14px;
    }
  </style>
</head>
<body>

  <header>
    <div class="app-title">Cases Online</div>
    <div class="balance-badge" onclick="openTab('deposit')">
      <span>⭐</span>
      <span class="balance-amount" id="balance">10000</span>
      <div class="add-btn">+</div>
    </div>
  </header>

  <main>
    <!-- ВКЛАДКА: КЕЙСЫ -->
    <div id="tab-case" class="tab-content active">
      <div class="case-card">
        <div class="case-image-wrap">
          <img id="caseCover" src="file_000000003e50821180f255969ab14c38.png" alt="Обложка">
        </div>
        <div class="case-title">Новый</div>
        <div class="case-subtitle">Испытай удачу и выбей подарок</div>
      </div>

      <div class="roulette-wrapper">
        <div class="roulette-track" id="rouletteTrack"></div>
      </div>

      <button class="open-btn" id="openBtn" onclick="spinCase()">Открыть за 100 ⭐</button>

      <div class="case-contents-title">
        <span>Содержимое кейса</span>
        <span style="font-size: 10px; color: #00b4d8;">По стоимости ↓</span>
      </div>
      <div class="contents-grid" id="contentsGrid"></div>
    </div>

    <!-- ВКЛАДКА: ПРОФИЛЬ И ИНВЕНТАРЬ -->
    <div id="tab-profile" class="tab-content">
      <div class="user-profile-card">
        <div class="user-avatar" id="userAvatar">U</div>
        <div class="user-info">
          <div class="username" id="userName">User</div>
          <div class="user-id" id="userId">ID: 00000000</div>
        </div>
      </div>

      <div class="inventory-section-title">Мои подарки</div>
      <div class="inventory-grid" id="inventoryGrid"></div>
    </div>

    <!-- ВКЛАДКА: ПОПОЛНЕНИЕ -->
    <div id="tab-deposit" class="tab-content">
      <div class="inventory-section-title">Тестовое пополнение баланса</div>
      <div class="deposit-grid">
        <div class="stars-pack-card">
          <div style="font-size: 28px;">⭐</div>
          <div class="stars-amount">100 Stars</div>
          <button class="buy-stars-btn" onclick="addTestStars(100)">Получить</button>
        </div>
        <div class="stars-pack-card">
          <div style="font-size: 28px;">⭐</div>
          <div class="stars-amount">500 Stars</div>
          <button class="buy-stars-btn" onclick="addTestStars(500)">Получить</button>
        </div>
        <div class="stars-pack-card">
          <div style="font-size: 28px;">⭐</div>
          <div class="stars-amount">1000 Stars</div>
          <button class="buy-stars-btn" onclick="addTestStars(1000)">Получить</button>
        </div>
        <div class="stars-pack-card">
          <div style="font-size: 28px;">⭐</div>
          <div class="stars-amount">5000 Stars</div>
          <button class="buy-stars-btn" onclick="addTestStars(5000)">Получить</button>
        </div>
      </div>
    </div>
  </main>

  <!-- МОДАЛКА ВЫИГРЫША -->
  <div class="modal" id="winModal">
    <div class="modal-box">
      <h3 style="color: #ffd700; font-size: 18px; text-transform: uppercase;">ВЫ ВЫИГРАЛИ!</h3>
      <img id="winImg" src="" alt="">
      <div id="winTitle" style="font-weight: 800; font-size: 16px; margin-bottom: 4px;"></div>
      <div id="winPrice" style="color: #ffd700; font-size: 14px; margin-bottom: 12px; font-weight: 800;"></div>
      
      <div class="modal-actions">
        <button class="open-btn" onclick="claimToInventory()" style="margin-bottom: 0; padding: 12px;">Забрать в инвентарь</button>
        <button class="open-btn" id="instantSellBtn" onclick="sellInstantly()" style="margin-bottom: 0; padding: 12px; background: linear-gradient(135deg, #e76f51, #f4a261);">Продать в моменте</button>
      </div>
    </div>
  </div>

  <nav>
    <button class="nav-btn active" onclick="openTab('case')" id="nav-case">
      <span>🎁</span>
      <span>Кейсы</span>
    </button>
    <button class="nav-btn" onclick="openTab('profile')" id="nav-profile">
      <span>👤</span>
      <span>Профиль</span>
    </button>
    <button class="nav-btn" onclick="openTab('deposit')" id="nav-deposit">
      <span>⭐</span>
      <span>Пополнить</span>
    </button>
  </nav>

  <script>
    const tg = window.Telegram ? window.Telegram.WebApp : null;
    if (tg) tg.expand();

    const RAW_GIFTS = [
      { id: 1, name: "Diamond Ring", price: 3275, file: "Diamond Ring.webp" },
      { id: 2, name: "Love Potion", price: 1563, file: "Love Potion.webp" },
      { id: 3, name: "Sky Stilettos", price: 1933, file: "Sky Stilettos.webp" },
      { id: 4, name: "Toy Bear", price: 3631, file: "Toy Bear.webp" },
      { id: 5, name: "Restless Jar", price: 700, file: "Restless Jar.webp" },
      { id: 6, name: "Input Key", price: 703, file: "Input Key.webp" },
      { id: 7, name: "Signet Ring", price: 3603, file: "Bonded Ring.webp" },
      { id: 8, name: "Ginger Cookie", price: 600, file: "Ginger Cookie.webp" },
      { id: 9, name: "Happy Brownie", price: 500, file: "Happy Brownie.webp" },
      { id: 10, name: "Instant Ramen", price: 500, file: "Instant Ramen.webp" },
      { id: 11, name: "Light Sword", price: 702, file: "Light Sword.webp" },
      { id: 12, name: "Bear", price: 15, file: "IMG_20261005_210325_616.png" },
      { id: 13, name: "Heart", price: 15, file: "IMG_20261005_210432_775.png" },
      { id: 14, name: "Gift Box", price: 25, file: "IMG_20261005_210438_497.png" },
      { id: 15, name: "Rocket", price: 50, file: "IMG_20261005_210442_380.png" },
      { id: 16, name: "Cup", price: 100, file: "IMG_20261005_210450_447.png" },
      { id: 17, name: "Ring", price: 100, file: "IMG_20261005_210455_132.png" }
    ];

    const GIFTS = [...RAW_GIFTS].sort((a, b) => b.price - a.price);

    // Загрузка данных из памяти устройства (чтобы баланс и инвентарь не сбрасывались)
    let balance = localStorage.getItem('cases_balance') !== null ? parseInt(localStorage.getItem('cases_balance')) : 10000;
    let inventory = JSON.parse(localStorage.getItem('cases_inventory')) || [];
    
    let isSpinning = false;
    let currentWonItem = null;

    // Сохранение данных
    function saveData() {
      localStorage.setItem('cases_balance', balance);
      localStorage.setItem('cases_inventory', JSON.stringify(inventory));
      document.getElementById('balance').innerText = balance;
    }

    // Инициализация данных пользователя
    function initUserData() {
      if (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) {
        const u = tg.initDataUnsafe.user;
        document.getElementById('userName').innerText = (u.first_name + ' ' + (u.last_name || '')).trim() || u.username;
        document.getElementById('userId').innerText = `ID: ${u.id}`;
        if (u.photo_url) {
          document.getElementById('userAvatar').innerHTML = `<img src="${u.photo_url}" alt="Avatar">`;
        }
      } else {
        document.getElementById('userName').innerText = "Тестовый игрок";
        document.getElementById('userId').innerText = "ID: 777777";
      }
      document.getElementById('balance').innerText = balance;
    }
    initUserData();

    function openTab(tabName) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));

      document.getElementById(`tab-${tabName}`).classList.add('active');
      document.getElementById(`nav-${tabName}`).classList.add('active');

      if (tabName === 'profile') renderInventory();
    }

    function renderCaseContents() {
      const grid = document.getElementById('contentsGrid');
      grid.innerHTML = '';
      GIFTS.forEach(item => {
        const div = document.createElement('div');
        div.className = 'content-card';
        div.innerHTML = `
          <img src="${item.file}" alt="${item.name}">
          <div class="content-name">${item.name}</div>
          <div class="content-price">${item.price} ⭐</div>
        `;
        grid.appendChild(div);
      });
    }
    renderCaseContents();

    function buildRoulette() {
      const track = document.getElementById('rouletteTrack');
      track.innerHTML = '';
      for (let i = 0; i < 50; i++) {
        const item = GIFTS[Math.floor(Math.random() * GIFTS.length)];
        const div = document.createElement('div');
        div.className = 'roulette-item';
        div.innerHTML = `
          <img src="${item.file}" alt="${item.name}">
          <div class="item-title">${item.name}</div>
          <div class="price">${item.price} ⭐</div>
        `;
        track.appendChild(div);
      }
    }
    buildRoulette();

    function spinCase() {
      if (isSpinning) return;
      if (balance < 100) {
        alert("Недостаточно Stars!");
        openTab('deposit');
        return;
      }

      balance -= 100;
      saveData();
      isSpinning = true;
      document.getElementById('openBtn').disabled = true;

      const track = document.getElementById('rouletteTrack');
      track.style.transition = 'none';
      track.style.transform = 'translateX(0px)';

      const winIndex = 32 + Math.floor(Math.random() * 6);
      currentWonItem = GIFTS[Math.floor(Math.random() * GIFTS.length)];

      const items = track.querySelectorAll('.roulette-item');
      items[winIndex].innerHTML = `
        <img src="${currentWonItem.file}" alt="${currentWonItem.name}">
        <div class="item-title">${currentWonItem.name}</div>
        <div class="price">${currentWonItem.price} ⭐</div>
