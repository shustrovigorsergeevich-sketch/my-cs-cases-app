<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gifts Case App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        body {
            background-color: #0b132b;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Шапка */
        header {
            background: #1c2541;
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .avatar {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: #3a506b;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 16px;
        }

        .username {
            font-size: 15px;
            font-weight: 600;
        }

        .balance-container {
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.06);
            padding: 6px 14px;
            border-radius: 20px;
            gap: 6px;
            border: 1px solid rgba(255, 255, 255, 0.12);
        }

        .stars-icon {
            color: #ffc107;
            font-size: 16px;
        }

        .balance {
            font-weight: 700;
            font-size: 14px;
            color: #ffc107;
        }

        /* Контент */
        main {
            flex: 1;
            padding: 16px;
            padding-bottom: 90px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .section-title {
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 15px;
            width: 100%;
            color: #5bc0be;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Кейсы */
        .cases-grid {
            width: 100%;
            display: flex;
            justify-content: center;
        }

        .case-card {
            background: #1c2541;
            border: 1px solid #3a506b;
            border-radius: 16px;
            padding: 20px;
            width: 100%;
            max-width: 320px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
        }

        .case-image {
            width: 150px;
            height: 150px;
            object-fit: contain;
            margin-bottom: 15px;
        }

        .case-title {
            font-size: 22px;
            font-weight: 800;
            margin-bottom: 12px;
        }

        .case-price-btn {
            background: linear-gradient(135deg, #0077b6, #00b4d8);
            border: none;
            color: white;
            padding: 12px 28px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 4px 12px rgba(0, 180, 216, 0.3);
        }

        /* Рулетка */
        .roulette-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(11, 19, 43, 0.96);
            backdrop-filter: blur(8px);
            z-index: 200;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .roulette-container {
            width: 100%;
            max-width: 350px;
            height: 130px;
            background: #1c2541;
            border: 2px solid #5bc0be;
            border-radius: 14px;
            position: relative;
            overflow: hidden;
            margin-bottom: 25px;
            box-shadow: 0 0 20px rgba(91, 192, 190, 0.2);
        }

        .roulette-pointer {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 4px;
            height: 100%;
            background: #ffc107;
            z-index: 10;
            box-shadow: 0 0 8px #ffc107;
        }

        .roulette-track {
            display: flex;
            position: absolute;
            top: 10px;
            left: 0;
            height: 110px;
            transition: transform 5s cubic-bezier(0.12, 0.8, 0.15, 1);
        }

        .roulette-item {
            min-width: 100px;
            height: 110px;
            margin: 0 5px;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 6px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .roulette-item img {
            width: 65px;
            height: 65px;
            object-fit: contain;
        }

        .item-cost {
            font-size: 11px;
            font-weight: 700;
            color: #ffc107;
            margin-top: 4px;
        }

        .spin-btn {
            background: linear-gradient(135deg, #ffc107, #ff9200);
            border: none;
            color: #0b132b;
            padding: 14px 40px;
            border-radius: 12px;
            font-weight: 800;
            font-size: 18px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 193, 7, 0.3);
        }

        /* Выигрыш */
        .win-display {
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            animation: popIn 0.4s ease;
        }

        .win-display img {
            width: 130px;
            height: 130px;
            object-fit: contain;
            filter: drop-shadow(0 0 15px #ffc107);
        }

        .win-title {
            font-size: 20px;
            font-weight: 800;
            color: #5bc0be;
        }

        .win-name {
            font-size: 18px;
            font-weight: 700;
            color: #ffffff;
        }

        .win-price {
            font-size: 15px;
            font-weight: 700;
            color: #ffc107;
        }

        .close-btn {
            background: #3a506b;
            border: none;
            color: white;
            padding: 12px 28px;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 10px;
        }

        /* Нижнее меню */
        nav {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            background: #1c2541;
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            color: #3a506b;
            text-decoration: none;
            font-size: 11px;
            font-weight: 600;
        }

        .nav-item.active {
            color: #5bc0be;
        }

        .nav-icon {
            font-size: 18px;
        }

        @keyframes popIn {
            from { opacity: 0; transform: scale(0.8); }
            to { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body>

    <header>
        <div class="user-info">
            <div class="avatar" id="user-avatar">U</div>
            <div class="username" id="user-name">User</div>
        </div>
        <div class="balance-container">
            <span class="stars-icon">★</span>
            <span class="balance" id="user-balance">0</span>
        </div>
    </header>

    <main>
        <div class="section-title">Магазин Кейсов</div>

        <div class="cases-grid">
            <div class="case-card">
                <img src="1000023540.png" alt="Кейс Новый" class="case-image">
                <div class="case-title">Новый</div>
                <button class="case-price-btn" onclick="openRouletteModal()">
                    Открыть <span>★ 200</span>
                </button>
            </div>
        </div>
    </main>

    <div class="roulette-modal" id="rouletteModal">
        <div class="roulette-container" id="rouletteContainer">
            <div class="roulette-pointer"></div>
            <div class="roulette-track" id="rouletteTrack"></div>
        </div>

        <button class="spin-btn" id="spinBtn" onclick="startSpin()">КРУТИТЬ</button>

        <div class="win-display" id="winDisplay">
            <div class="win-title">ВЫ ВЫИГРАЛИ!</div>
            <img id="winImg" src="" alt="Prize">
            <div class="win-name" id="winName"></div>
            <div class="win-price" id="winPrice"></div>
            <button class="close-btn" onclick="closeRouletteModal()">Забрать в инвентарь</button>
        </div>
    </div>

    <nav>
        <a href="#" class="nav-item">
            <span class="nav-icon">🎒</span>
            <span>Инвентарь</span>
        </a>
        <a href="#" class="nav-item active">
            <span class="nav-icon">🎁</span>
            <span>Кейс</span>
        </a>
        <a href="#" class="nav-item">
            <span class="nav-icon">💳</span>
            <span>Пополнение</span>
        </a>
    </nav>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            const user = tg.initDataUnsafe.user;
            document.getElementById('user-name').innerText = user.first_name || 'Игрок';
            document.getElementById('user-avatar').innerText = (user.first_name || 'U')[0].toUpperCase();
        }

        // Полный отсортированный массив твоих 17 гифтов по стоимости
        const gifts = [
            { id: 1, name: 'Toy Bear', price: 3631, img: '1000023523.png' },
            { id: 2, name: 'Bonsai Tree', price: 1000, img: '1000023524.png' },
            { id: 3, name: 'Diamond Ring', price: 1000, img: '1000023525.png' },
            { id: 4, name: 'Red Rose', price: 777, img: '1000023526.png' },
            { id: 5, name: 'Vintage Cigar', price: 500, img: '1000023527.png' },
            { id: 6, name: 'Golden Trophy', price: 500, img: '1000023528.png' },
            { id: 7, name: 'Perfume Bottle', price: 250, img: '1000023529.png' },
            { id: 8, name: 'Champagne', price: 150, img: '1000023530.png' },
            { id: 9, name: 'Birthday Cake', price: 100, img: '1000023531.png' },
            { id: 10, name: 'Teddy Bear', price: 100, img: '1000023532.png' },
            { id: 11, name: 'Crown', price: 100, img: '1000023533.png' },
            { id: 12, name: 'Gemstone', price: 50, img: '1000023534.png' },
            { id: 13, name: 'Lollipop', price: 50, img: '1000023535.png' },
            { id: 14, name: 'Coffee Cup', price: 25, img: '1000023536.png' },
            { id: 15, name: 'Party Popper', price: 25, img: '1000023537.png' },
            { id: 16, name: 'Rocket', price: 20, img: '1000023538.png' },
            { id: 17, name: 'Heart', price: 15, img: '1000023539.png' }
        ];

        const track = document.getElementById('rouletteTrack');
        const modal = document.getElementById('rouletteModal');
        const spinBtn = document.getElementById('spinBtn');
        const winDisplay = document.getElementById('winDisplay');
        const rouletteContainer = document.getElementById('rouletteContainer');

        let isSpinning = false;

        function buildTrack() {
            track.innerHTML = '';
            track.style.transition = 'none';
            track.style.transform = 'translateX(0px)';

            // Генерируем 40 случайных элементов для рулетки
            for (let i = 0; i < 40; i++) {
                const randomGift = gifts[Math.floor(Math.random() * gifts.length)];
                const item = document.createElement('div');
                item.className = 'roulette-item';
                item.innerHTML = `
                    <img src="${randomGift.img}" alt="${randomGift.name}">
                    <div class="item-cost">★ ${randomGift.price}</div>
                `;
                track.appendChild(item);
            }
        }

        function openRouletteModal() {
            buildTrack();
            modal.style.display = 'flex';
            spinBtn.style.display = 'block';
            rouletteContainer.style.display = 'block';
            winDisplay.style.display = 'none';
        }

        function closeRouletteModal() {
            modal.style.display = 'none';
            isSpinning = false;
        }

        function startSpin() {
            if (isSpinning) return;
            isSpinning = true;
            spinBtn.style.display = 'none';

            const prizeIndex = 30; // Выигрышный предмет остановки
            const itemWidth = 110; // 100px + 10px margin
            const containerWidth = rouletteContainer.offsetWidth;
            
            const randomOffset = Math.floor(Math.random() * 40) - 20;
            const targetPosition = (prizeIndex * itemWidth) - (containerWidth / 2) + (itemWidth / 2) + randomOffset;

            // Рандомим приз
            const winningGift = gifts[Math.floor(Math.random() * gifts.length)];
            const targetElement = track.children[prizeIndex];
            targetElement.innerHTML = `
                <img src="${winningGift.img}" alt="${winningGift.name}">
                <div class="item-cost">★ ${winningGift.price}</div>
            `;

            setTimeout(() => {
                track.style.transition = 'transform 5s cubic-bezier(0.12, 0.8, 0.15, 1)';
                track.style.transform = `translateX(-${targetPosition}px)`;
            }, 100);

            setTimeout(() => {
                rouletteContainer.style.display = 'none';
                winDisplay.style.display = 'flex';
                document.getElementById('winImg').src = winningGift.img;
                document.getElementById('winName').innerText = winningGift.name;
                document.getElementById('winPrice').innerText = `Стоимость: ★ ${winningGift.price}`;
            }, 5300);
        }
    </script>
</body>
</html>
