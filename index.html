<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Pantera Cases</title>
  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background: #090c15;
      color: #ffffff;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* HEADER */
    header {
      padding: 12px 16px;
      background: rgba(18, 24, 38, 0.8);
      backdrop-filter: blur(10px);
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      z-index: 10;
    }

    .app-title {
      font-weight: 800;
      font-size: 16px;
      background: linear-gradient(90deg, #ff0055, #ff5000);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .balance-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(255, 255, 255, 0.06);
      padding: 6px 12px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .balance-amount {
      font-weight: 700;
      font-size: 15px;
      color: #ffd700;
    }

    .add-btn {
      background: #2aabee;
      color: white;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.1s;
    }

    .add-btn:active {
      transform: scale(0.9);
    }

    /* MAIN CONTAINER */
    main {
      flex: 1;
      overflow-y: auto;
      padding-bottom: 70px;
      position: relative;
    }

    .tab-content {
      display: none;
      height: 100%;
      padding: 16px;
    }

    .tab-content.active {
      display: flex;
      flex-direction: column;
    }

    /* CASE TAB */
    #tab-case {
      align-items: center;
      justify-content: space-between;
    }

    .case-banner {
      width: 100%;
      max-width: 320px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(255, 0, 85, 0.25);
      border: 1px solid rgba(255, 0, 85, 0.3);
      margin-top: 10px;
    }

    /* ROULETTE CONTAINER */
    .roulette-wrapper {
      width: 100%;
      position: relative;
      margin: 20px 0;
      overflow: hidden;
      border-radius: 12px;
      background: #111625;
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 10px 0;
    }

    .roulette-wrapper::before {
      content: '';
      position: absolute;
      top: 0;
      bottom: 0;
      left: 50%;
      width: 4px;
      background: #ffd700;
      transform: translateX(-50%);
      z-index: 5;
      box-shadow: 0 0 10px #ffd700;
    }

    .roulette-track {
      display: flex;
      gap: 10px;
      will-change: transform;
      transition: transform 5s cubic-bezier(0.15, 0.9, 0.15, 1);
    }

    .roulette-item {
      min-width: 90px;
      height: 90px;
      background: rgba(255, 255, 255, 0.03);
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(255, 255, 255, 0.05);
      padding: 5px;
    }

    .roulette-item img {
      width: 50px;
      height: 50px;
      object-fit: contain;
    }

    .roulette-item .price {
      font-size: 11px;
      color: #ffd700;
      margin-top: 4px;
      font-weight: 600;
    }

    .open-btn {
      width: 100%;
      max-width: 320px;
      padding: 16px;
      border: none;
      border-radius: 14px;
      background: linear-gradient(135deg, #ff0055, #ff5000);
      color: white;
      font-weight: 800;
      font-size: 18px;
      cursor: pointer;
      box-shadow: 0 8px 25px rgba(255, 0, 85, 0.4);
      transition: transform 0.1s, opacity 0.2s;
    }

    .open-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .open-btn:active:not(:disabled) {
      transform: scale(0.98);
    }

    /* DEPOSIT TAB */
    .deposit-card {
      background: #121826;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 16px;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .deposit-card h3 {
      font-size: 18px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .deposit-input {
      width: 100%;
      padding: 12px;
      background: #090c15;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 10px;
      color: white;
      font-size: 16px;
      margin-bottom: 12px;
      outline: none;
    }

    .deposit-btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 10px;
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
    }

    .btn-stars {
      background: #ffd700;
      color: #000;
    }

    .btn-ton {
      background: #0088cc;
      color: #fff;
    }

    .deposit-note {
      font-size: 12px;
      color: #888;
      margin-top: 8px;
      text-align: center;
    }

    /* PROFILE & INVENTORY TAB */
    .inventory-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-top: 16px;
    }

    .inventory-card {
      background: #121826;
      border-radius: 12px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .inventory-card img {
      width: 70px;
      height: 70px;
      object-fit: contain;
      margin-bottom: 8px;
    }

    .inventory-title {
      font-size: 13px;
      font-weight: 600;
      text-align: center;
      margin-bottom: 4px;
    }

    .inventory-price {
      font-size: 12px;
      color: #ffd700;
      margin-bottom: 10px;
    }

    .card-actions {
      display: flex;
      gap: 6px;
      width: 100%;
    }

    .card-btn {
      flex: 1;
      padding: 6px;
      border: none;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
    }

    .btn-sell {
      background: rgba(255, 69, 58, 0.2);
      color: #ff453a;
      border: 1px solid rgba(255, 69, 58, 0.4);
    }

    .btn-withdraw {
      background: rgba(48, 209, 88, 0.2);
      color: #30d158;
      border: 1px solid rgba(48, 209, 88, 0.4);
    }

    /* WIN MODAL */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.85);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 20px;
    }

    .win-modal {
      background: #121826;
      border-radius: 20px;
      padding: 24px;
      width: 100%;
      max-width: 300px;
      text-align: center;
      border: 1px solid rgba(255, 215, 0, 0.3);
      box-shadow: 0 0 30px rgba(255, 215, 0, 0.2);
      animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes popIn {
      from { transform: scale(0.8); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .win-modal img {
      width: 100px;
      height: 100px;
      object-fit: contain;
      margin: 16px 0;
    }

    .win-modal h2 {
      font-size: 20px;
      color: #ffd700;
    }

    .win-modal p {
      font-size: 14px;
      margin-bottom: 20px;
      color: #aaa;
    }

    .modal-buttons {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .modal-btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 10px;
      font-weight: 700;
      cursor: pointer;
    }

    /* NAVIGATION BAR */
    nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 60px;
      background: rgba(18, 24, 38, 0.95);
      backdrop-filter: blur(10px);
      display: flex;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      z-index: 10;
    }

    .nav-item {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #666;
      font-size: 11px;
      cursor: pointer;
      gap: 4px;
    }

    .nav-item.active {
      color: #ff0055;
    }

    .nav-icon {
      font-size: 20px;
    }

    .empty-inv {
      text-align: center;
      color: #666;
      margin-top: 40px;
      grid-column: span 2;
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header>
    <div class="app-title">Pantera Cases</div>
    <div class="balance-badge">
      <span>⭐</span>
      <span class="balance-amount" id="balance">100</span>
      <div class="add-btn" onclick="switchTab('deposit')">+</div>
    </div>
  </header>

  <!-- MAIN CONTENT -->
  <main>
    
    <!-- TAB: CASE -->
    <div id="tab-case" class="tab-content active">
      <img src="1000023540.png" class="case-banner" alt="Pantera Cases" />
      
      <div class="roulette-wrapper">
        <div class="roulette-track" id="rouletteTrack"></div>
      </div>

      <button class="open-btn" id="openBtn" onclick="openCase()">
        ОТКРЫТЬ (100 ⭐)
      </button>
    </div>

    <!-- TAB: DEPOSIT -->
    <div id="tab-deposit" class="tab-content">
      <h2 style="margin-bottom: 16px;">Пополнение баланса</h2>
      
      <div class="deposit-card">
        <h3>⭐ Telegram Stars</h3>
        <input type="number" id="starsAmount" class="deposit-input" placeholder="Минимум 100 Stars" min="100" />
        <button class="deposit-btn btn-stars" onclick="depositStars()">Пополнить Stars</button>
        <div class="deposit-note">Мин. сумма: 100 ⭐</div>
      </div>

      <div class="deposit-card">
        <h3>💎 TON Crystal</h3>
        <input type="number" id="tonAmount" class="deposit-input" placeholder="Минимум 1 TON" min="1" step="0.1" />
        <button class="deposit-btn btn-ton" onclick="depositTon()">Пополнить TON</button>
        <div class="deposit-note">Курс: 1 TON = 100 ⭐ (Мин. 1 TON)</div>
      </div>
    </div>

    <!-- TAB: PROFILE -->
    <div id="tab-profile" class="tab-content">
      <h2>Профиль и Инвентарь</h2>
      <div class="inventory-grid" id="inventoryGrid">
        <div class="empty-inv">Ваш инвентарь пуст.<br>Откройте кейс, чтобы получить подарки!</div>
      </div>
    </div>

  </main>

  <!-- WIN MODAL -->
  <div class="modal-overlay" id="winModal">
    <div class="win-modal">
      <h2>ВЫ ВЫИГРАЛИ!</h2>
      <img id="winImg" src="" alt="" />
      <h3 id="winTitle" style="margin-bottom: 4px;"></h3>
      <p id="winPrice"></p>
      
      <div class="modal-buttons">
        <button class="modal-btn btn-sell" onclick="claimReward('sell')">Продать за <span id="sellPrice"></span> ⭐</button>
        <button class="modal-btn btn-withdraw" onclick="claimReward('keep')">Забрать в инвентарь</button>
      </div>
    </div>
  </div>

  <!-- NAVIGATION -->
  <nav>
    <div class="nav-item" onclick="switchTab('profile')">
      <div class="nav-icon">👤</div>
      <div>Профиль</div>
    </div>
    <div class="nav-item active" onclick="switchTab('case')">
      <div class="nav-icon">🎁</div>
      <div>Кейс</div>
    </div>
    <div class="nav-item" onclick="switchTab('deposit')">
      <div class="nav-icon">💳</div>
      <div>Пополнить</div>
    </div>
  </nav>

  <script>
    const tg = window.Telegram ? window.Telegram.WebApp : null;
    if (tg) tg.expand();

    const GIFTS = [
      { id: 1, name: "diamond ring", price: 3275, img: "1000023541.webp" },
      { id: 2, name: "love potion", price: 1563, img: "1000023557.png" },
      { id: 3, name: "sky stilettos", price: 1933, img: "1000023556.png" },
      { id: 4, name: "Toy Bear", price: 3631, img: "1000023555.png" },
      { id: 5, name: "restless Jar", price: 700, img: "1000023554.png" },
      { id: 6, name: "input key", price: 703, img: "1000023553.png" },
      { id: 7, name: "signet ring", price: 3603, img: "1000023552.png" },
      { id: 8, name: "ginger cookie", price: 600, img: "1000023540.png" },
      { id: 9, name: "Happy Brownie", price: 500, img: "1000023541.webp" },
      { id: 10, name: "instant ramen", price: 500, img: "1000023557.png" },
      { id: 11, name: "Light sword", price: 702, img: "1000023556.png" },
      { id: 12, name: "Bear", price: 15, img: "1000023555.png" },
      { id: 13, name: "heart", price: 15, img: "1000023554.png" },
      { id: 14, name: "Gift box", price: 25, img: "1000023553.png" },
      { id: 15, name: "rocket", price: 50, img: "1000023552.png" },
      { id: 16, name: "Cup", price: 100, img: "1000023540.png" },
      { id: 17, name: "ring", price: 100, img: "1000023541.webp" }
    ];

    const CASE_PRICE = 100;
    let balance = 100;
    let inventory = [];
    let currentWonItem = null;
    let isSpinning = false;

    const balanceEl = document.getElementById('balance');
    const track = document.getElementById('rouletteTrack');
    const openBtn = document.getElementById('openBtn');

    function generateRouletteItems() {
      track.innerHTML = '';
      for (let i = 0; i < 50; i++) {
        const item = GIFTS[Math.floor(Math.random() * GIFTS.length)];
        const div = document.createElement('div');
        div.className = 'roulette-item';
        div.innerHTML = `
          <img src="${item.img}" alt="${item.name}">
          <div class="price">${item.price} ⭐</div>
        `;
        track.appendChild(div);
      }
    }
    generateRouletteItems();

    function switchTab(tabName) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
      
      document.getElementById(`tab-${tabName}`).classList.add('active');
      
      const navIndices = { 'profile': 0, 'case': 1, 'deposit': 2 };
      document.querySelectorAll('.nav-item')[navIndices[tabName]].classList.add('active');
    }

    function updateBalance(amount) {
      balance += amount;
      balanceEl.innerText = balance;
    }

    function openCase() {
      if (isSpinning) return;
      if (balance < CASE_PRICE) {
        alert("Недостаточно Stars на балансе! Пополните баланс.");
        switchTab('deposit');
        return;
      }

      updateBalance(-CASE_PRICE);
      isSpinning = true;
      openBtn.disabled = true;

      track.style.transition = 'none';
      track.style.transform = 'translateX(0px)';

      const winningIndex = 35 + Math.floor(Math.random() * 10);
      currentWonItem = GIFTS[Math.floor(Math.random() * GIFTS.length)];

      const items = track.querySelectorAll('.roulette-item');
      items[winningIndex].innerHTML = `
        <img src="${currentWonItem.img}" alt="${currentWonItem.name}">
        <div class="price">${currentWonItem.price} ⭐</div>
      `;

      const itemWidth = 100;
      const wrapperWidth = document.querySelector('.roulette-wrapper').offsetWidth;
      const targetOffset = -(winningIndex * itemWidth - wrapperWidth / 2 + itemWidth / 2);

      setTimeout(() => {
        track.style.transition = 'transform 5s cubic-bezier(0.15, 0.9, 0.15, 1)';
        track.style.transform = `translateX(${targetOffset}px)`;
      }, 50);

      setTimeout(() => {
        showWinModal(currentWonItem);
        isSpinning = false;
        openBtn.disabled = false;
      }, 5200);
    }

    function showWinModal(item) {
      document.getElementById('winImg').src = item.img;
      document.getElementById('winTitle').innerText = item.name;
      document.getElementById('winPrice').innerText = `Ценность: ${item.price} ⭐`;
      document.getElementById('sellPrice').innerText = item.price;
      document.getElementById('winModal').style.display = 'flex';
    }

    function claimReward(action) {
      document.getElementById('winModal').style.display = 'none';
      if (action === 'sell') {
        updateBalance(currentWonItem.price);
      } else {
        inventory.push({ ...currentWonItem, invId: Date.now() });
        renderInventory();
      }
      generateRouletteItems();
    }

    function renderInventory() {
      const grid = document.getElementById('inventoryGrid');
      if (inventory.length === 0) {
        grid.innerHTML = '<div class="empty-inv">Ваш инвентарь пуст.<br>Откройте кейс, чтобы получить подарки!</div>';
        return;
      }

      grid.innerHTML = '';
      inventory.forEach(item => {
        const card = document.createElement('div');
        card.className = 'inventory-card';
        card.innerHTML = `
          <img src="${item.img}" alt="${item.name}">
          <div class="inventory-title">${item.name}</div>
          <div class="inventory-price">${item.price} ⭐</div>
          <div class="card-actions">
            <button class="card-btn btn-sell" onclick="sellFromInv(${item.invId}, ${item.price})">Продать</button>
            <button class="card-btn btn-withdraw" onclick="withdrawFromInv(${item.invId})">Вывести</button>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function sellFromInv(invId, price) {
      inventory = inventory.filter(item => item.invId !== invId);
      updateBalance(price);
      renderInventory();
    }

    function withdrawFromInv(invId) {
      const item = inventory.find(i => i.invId === invId);
      if (item) {
        alert(`Заявка на вывод предмета "${item.name}" успешно создана! Администратор свяжется с вами.`);
      }
    }

    function depositStars() {
      const amount = parseInt(document.getElementById('starsAmount').value);
      if (!amount || amount < 100) {
        alert("Минимальная сумма пополнения — 100 Stars!");
        return;
      }
      updateBalance(amount);
      alert(`Успешно пополнено на ${amount} ⭐!`);
      document.getElementById('starsAmount').value = '';
      switchTab('case');
    }

    function depositTon() {
      const amount = parseFloat(document.getElementById('tonAmount').value);
      if (!amount || amount < 1) {
        alert("Минимальная сумма пополнения — 1 TON!");
        return;
      }
      const starsGained = Math.floor(amount * 100);
      updateBalance(starsGained);
      alert(`Успешно пополнено на ${amount} TON (${starsGained} ⭐)!`);
      document.getElementById('tonAmount').value = '';
      switchTab('case');
    }
  </script>
</body>
    </html>
