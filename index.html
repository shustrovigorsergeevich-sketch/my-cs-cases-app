<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Пантера</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #0b0e14;
            --card-bg: #151a24;
            --card-border: #232d3f;
            --accent: #f39c12;
            --accent-gradient: linear-gradient(135deg, #f39c12, #e67e22);
            --ton-color: #0098ea;
            --text-color: #ffffff;
            --text-secondary: #8a9ba8;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding-bottom: 90px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 16px;
            background: var(--card-bg);
            border-bottom: 1px solid var(--card-border);
        }
        .brand-logo {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 17px;
            font-weight: 800;
            color: #fff;
        }
        .balance-box {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #0b0e14;
            padding: 4px 10px;
            border-radius: 20px;
            border: 1px solid var(--card-border);
        }
        .balance-item {
            font-weight: 700;
            font-size: 13px;
            color: var(--accent);
        }
        .plus-btn {
            background: var(--ton-color);
            color: #fff;
            border: none;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
        }
        .content {
            padding: 16px;
        }
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }
        .section-title {
            font-size: 16px;
            margin-bottom: 12px;
            font-weight: 700;
            color: #fff;
        }
        
        .methods-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 16px;
        }
        .method-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 10px 6px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 6px;
            cursor: pointer;
            transition: 0.2s;
            font-size: 10px;
            font-weight: 600;
            color: var(--text-secondary);
            text-align: center;
            min-height: 65px;
        }
        .method-card.active {
            border-color: var(--ton-color);
            background: rgba(0, 152, 234, 0.08);
            color: #fff;
        }
        .method-card span.icon {
            font-size: 18px;
        }

        .card-box {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 16px;
            border: 1px solid var(--card-border);
            margin-bottom: 12px;
        }
        .action-btn {
            background: var(--ton-color);
            color: #fff;
            border: none;
            padding: 12px 16px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            width: 100%;
        }
        .input-group {
            width: 100%;
            background: #0b0e14;
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 12px;
            color: #fff;
            font-size: 14px;
            outline: none;
            margin-top: 8px;
            margin-bottom: 12px;
        }

        .case-card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 20px;
            text-align: center;
            border: 1px solid var(--card-border);
            margin-bottom: 16px;
        }
        .case-img {
            width: 120px;
            height: 120px;
            object-fit: contain;
            margin-bottom: 12px;
        }
        .btn-open {
            background: var(--accent-gradient);
            color: #000;
            border: none;
            border-radius: 14px;
            padding: 12px;
            font-weight: 800;
            font-size: 14px;
            cursor: pointer;
            width: 100%;
            margin-top: 12px;
        }

        .roulette-container {
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            background: var(--card-bg);
            padding: 20px;
            border-radius: 20px;
            border: 1px solid var(--card-border);
            margin-bottom: 16px;
        }
        .roulette-window {
            width: 100%;
            height: 120px;
            overflow: hidden;
            position: relative;
            background: #0b0e14;
            border-radius: 14px;
            border: 2px solid var(--accent);
        }
        .roulette-pointer {
            position: absolute;
            top: 0; bottom: 0; left: 50%; width: 3px;
            background: #e74c3c; transform: translateX(-50%); z-index: 10;
        }
        .roulette-strip {
            display: flex; position: absolute; left: 0; top: 0; height: 100%;
        }
        .roulette-item {
            min-width: 110px; width: 110px; height: 100%; display: flex; flex-direction: column;
            align-items: center; justify-content: center; padding: 8px;
            border-right: 1px solid var(--card-border); background: var(--card-bg);
            flex-shrink: 0;
        }
        .roulette-item img { width: 50px; height: 50px; object-fit: contain; margin-bottom: 6px; }
        .roulette-item span { font-size: 11px; color: var(--text-secondary); text-align: center; }

        .nav-bar {
            position: fixed; bottom: 0; left: 0; right: 0;
            background: var(--card-bg); display: flex; justify-content: space-around;
            padding: 10px 0; border-top: 1px solid var(--card-border); z-index: 100;
        }
        .nav-item {
            background: none; border: none; color: var(--text-secondary);
            font-size: 10px; display: flex; flex-direction: column; align-items: center; gap: 3px; cursor: pointer;
        }
        .nav-item span:first-child { font-size: 18px; }
        .nav-item.active { color: var(--accent); }
    </style>
</head>
<body>

    <div class="header">
        <div class="brand-logo"> пантера</div>
        <div class="balance-box">
            <div class="balance-item"><span id="user-stars-balance">0</span> ⭐</div>
            <button class="plus-btn" onclick="switchTab('topup', document.querySelectorAll('.nav-item')[0])">+</button>
        </div>
    </div>

    <div class="content">
        <!-- ПОПОЛНИТЬ -->
        <div id="tab-topup" class="tab-content">
            <div class="section-title">Выберите метод оплаты</div>
            
            <div class="methods-grid">
                <div class="method-card active" onclick="selectMethod('Stars', this)"><span class="icon">⭐</span>Stars</div>
                <div class="method-card" onclick="selectMethod('СБП', this)"><span class="icon">⚡</span>СБП</div>
                <div class="method-card" onclick="selectMethod('TON', this)"><span class="icon">💎</span>TON</div>
                <div class="method-card" onclick="selectMethod('TonKeeper', this)"><span class="icon">🐾</span>TonKeeper</div>
                <div class="method-card" onclick="selectMethod('Gifts', this)"><span class="icon">🎁</span>Gifts</div>
                <div class="method-card" onclick="selectMethod('VISA/МИР', this)"><span class="icon">💳</span>VISA/МИР</div>
                <div class="method-card" onclick="selectMethod('USDT TRC', this)"><span class="icon">₮</span>USDT (TRC-20)</div>
                <div class="method-card" onclick="selectMethod('Bitcoin', this)"><span class="icon">₿</span>Bitcoin</div>
                <div class="method-card" onclick="selectMethod('Ethereum', this)"><span class="icon">Ξ</span>Ethereum</div>
            </div>

            <div class="card-box">
                <label style="font-size: 11px; color: var(--text-secondary);">Промокод (Если есть)</label>
                <input type="text" id="promo-input" class="input-group" placeholder="XX-XX-XX">

                <label style="font-size: 11px; color: var(--text-secondary);" id="amount-label">Сумма пополнения (в звездах)</label>
                <input type="number" id="pay-amount-input" class="input-group" placeholder="Введите сумму...">
                <div style="font-size: 10px; color: var(--text-secondary); margin-bottom: 14px;" id="selected-method-info">Выбран способ: Stars</div>

                <button class="action-btn" onclick="executeTopUp()">Пополнить баланс</button>
            </div>
        </div>

        <!-- КЕЙСЫ -->
        <div id="tab-cases" class="tab-content active">
            <div class="section-title">Игровой кейс</div>
            
            <div id="roulette-box" class="roulette-container">
                <div style="font-weight: 700; font-size: 14px;">Открытие кейса...</div>
                <div class="roulette-window">
                    <div class="roulette-pointer"></div>
                    <div class="roulette-strip" id="roulette-strip"></div>
                </div>
                <div id="win-result" style="font-weight: 700; color: var(--accent); font-size: 13px; text-align: center;"></div>
            </div>

            <div class="case-card">
                <img src="file_00000000f760823092f625c8adef5df3.png" alt="Case" class="case-img" onerror="this.style.display='none'">
                <div style="font-size: 18px; font-weight: 800; margin-bottom: 4px;">Пантера Кейс</div>
                <div style="font-size: 12px; color: var(--text-secondary); margin-bottom: 12px;">Содержит редкие NFT подарки</div>
                <button class="btn-open" onclick="openCase()">Открыть за 300 ⭐</button>
            </div>
        </div>

        <div id="tab-upgrade" class="tab-content"><div class="section-title">Апгрейд</div><div class="card-box">Скоро</div></div>
        <div id="tab-crafts" class="tab-content"><div class="section-title">Крафты</div><div class="card-box">Скоро</div></div>
        <div id="tab-contests" class="tab-content"><div class="section-title">Конкурсы</div><div class="card-box">Скоро</div></div>
        <div id="tab-friends" class="tab-content"><div class="section-title">Друзья</div><div class="card-box">Реферальная система скоро</div></div>
    </div>

    <div class="nav-bar">
        <button class="nav-item" onclick="switchTab('upgrade', this)"><span>📈</span><span>Апгрейд</span></button>
        <button class="nav-item" onclick="switchTab('crafts', this)"><span>🎯</span><span>Крафты</span></button>
        <button class="nav-item active" onclick="switchTab('cases', this)"><span>📦</span><span>Кейсы</span></button>
        <button class="nav-item" onclick="switchTab('contests', this)"><span>🎁</span><span>Конкурсы</span></button>
        <button class="nav-item" onclick="switchTab('friends', this)"><span>👥</span><span>Друзья</span></button>
    </div>

    <script>
        const botToken = "8645941945:AAGVQo1e7IWIHA57B5tKSh0hYwR61kx3Nys";

        const tg = window.Telegram.WebApp;
        tg.expand();

        const OWNER_ID = 7165618202; // <-- Замени на свой реальный ID владельца

        let userStars = 0;
        let selectedPaymentMethod = "Stars";

        const itemsList = [
            { name: "Heart", image: "IMG_20260929_185347.jpg" },
            { name: "Teddy Bear", image: "IMG_20260929_185406.jpg" },
            { name: "Red Rose", image: "IMG_20260929_185425.jpg" },
            { name: "Birthday Cake", image: "IMG_20260929_185440.jpg" },
            { name: "Rocket", image: "IMG_20260929_185454.jpg" },
            { name: "Cup", image: "IMG_20260929_185517.jpg" },
            { name: "Diamond", image: "IMG_20260929_185645.jpg" },
            { name: "Champagne", image: "IMG_20260929_185659.jpg" },
            { name: "Khabib Papakha", image: "IMG_20260929_185006.jpg" }
        ];

        try {
            const user = tg.initDataUnsafe?.user;
            if (user && user.id === OWNER_ID) {
                userStars = 1000; // Бонус 1000 звёзд владельцу
                tg.showAlert("Привет, Создатель! Вам начислен бонус: 1000 звёзд ⭐");
            }
        } catch (e) {
            console.log('Not in Telegram');
        }

        function updateBalance() {
            document.getElementById('user-stars-balance').innerText = userStars;
        }
        updateBalance();

        function switchTab(tabName, el) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
            document.getElementById('tab-' + tabName).classList.add('active');
            if (el) el.classList.add('active');
        }

        function selectMethod(method, el) {
            document.querySelectorAll('.method-card').forEach(c => c.classList.remove('active'));
            el.classList.add('active');
            selectedPaymentMethod = method;
            document.getElementById('selected-method-info').innerText = `Выбран способ: ${method}`;
        }

        let isSpinning = false;
        function openCase() {
            if (userStars < 300) {
                alert('Недостаточно звёзд! Требуется 300 ⭐');
                switchTab('topup', document.querySelectorAll('.nav-item')[0]);
                return;
            }
            if (isSpinning) return;
            isSpinning = true;

            userStars -= 300; // Списываем 300 звёзд за кейс
            updateBalance();

            const rouletteBox = document.getElementById('roulette-box');
            const strip = document.getElementById('roulette-strip');
            const winResult = document.getElementById('win-result');
            
            rouletteBox.style.display = 'flex';
            winResult.innerText = 'Крутим...';

            strip.style.transition = 'none';
            strip.style.transform = 'translateX(0px)';

            let html = '';
            for (let i = 0; i < 40; i++) {
                const item = itemsList[Math.floor(Math.random() * itemsList.length)];
                html += `<div class="roulette-item"><img src="${item.image}" onerror="this.style.display='none'"><span>${item.name}</span></div>`;
            }
            strip.innerHTML = html;

            setTimeout(() => {
                const itemWidth = 110;
                const targetIndex = 30;
                const windowWidth = document.querySelector('.roulette-window').offsetWidth;
                const offset = (targetIndex * itemWidth) - (windowWidth / 2) + (itemWidth / 2);

                strip.style.transition = 'transform 4s cubic-bezier(0.15, 0.85, 0.15, 1)';
                strip.style.transform = `translateX(-${offset}px)`;

                setTimeout(() => {
                    winResult.innerText = `🎉 Поздравляем с выигрышем!`;
                    isSpinning = false;
                }, 4000);
            }, 50);
        }

        function executeTopUp() {
            const inputVal = document.getElementById('pay-amount-input').value;
            const val = parseFloat(inputVal);
            
            if (isNaN(val) || val <= 0) {
                alert('Введите корректную сумму для пополнения!');
                return;
            }
            
            userStars += val;
            updateBalance();
            alert(`Баланс успешно пополнен на ${val} ⭐ через ${selectedPaymentMethod}!`);
            document.getElementById('pay-amount-input').value = '';
        }
    </script>
</body>
</html>
