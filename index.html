<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Panteracases</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #0f1218;
            --card-bg: #181d28;
            --accent: #2ea6ff;
            --accent-hover: #1b8ce3;
            --text-main: #ffffff;
            --text-secondary: #8b9bb4;
            --border: #263248;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            user-select: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding-bottom: 80px;
        }

        .container {
            max-width: 480px;
            margin: 0 auto;
            padding: 16px;
        }

        /* Шапка */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border);
        }

        .logo {
            font-size: 22px;
            font-weight: 800;
            color: var(--accent);
            letter-spacing: 0.5px;
        }

        .balance-badge {
            background: var(--card-bg);
            border: 1px solid var(--border);
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 15px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .balance-badge span {
            color: #ffd700;
        }

        /* Экраны */
        .screen {
            display: none;
        }

        .screen.active {
            display: block;
        }

        .section-title {
            font-size: 15px;
            font-weight: 700;
            margin-bottom: 14px;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Главная: Карточка кейса */
        .cases-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 16px;
        }

        .case-card {
            background: linear-gradient(135deg, #181d28 0%, #121620 100%);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 24px;
            text-align: center;
            cursor: pointer;
            transition: transform 0.2s, border-color 0.2s;
            position: relative;
            overflow: hidden;
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
        }

        .case-card:active {
            transform: scale(0.98);
        }

        .case-card img {
            width: 130px;
            height: 130px;
            object-fit: contain;
            margin: 12px auto;
            filter: drop-shadow(0 12px 18px rgba(0,0,0,0.6));
        }

        .case-name {
            font-size: 20px;
            font-weight: 800;
            margin-bottom: 8px;
        }

        .case-price {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(46, 166, 255, 0.12);
            color: var(--accent);
            padding: 8px 16px;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 700;
        }

        /* Модальное окно кейса */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(6px);
            display: none;
            justify-content: center;
            align-items: flex-end;
            z-index: 100;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-content {
            background: #141923;
            width: 100%;
            max-width: 480px;
            border-radius: 28px 28px 0 0;
            padding: 24px;
            border-top: 1px solid var(--border);
            animation: slideUp 0.3s cubic-bezier(0.1, 0.9, 0.2, 1);
            max-height: 90vh;
            overflow-y: auto;
        }

        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .modal-close {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 26px;
            cursor: pointer;
            padding: 4px;
        }

        .case-preview-center {
            text-align: center;
            margin-bottom: 16px;
        }

        .case-preview-center img {
            width: 120px;
            height: 120px;
            object-fit: contain;
        }

        /* Рулетка */
        .roulette-container {
            background: var(--card-bg);
            border: 2px solid var(--border);
            border-radius: 18px;
            height: 120px;
            position: relative;
            overflow: hidden;
            margin-bottom: 20px;
            display: none;
        }

        .roulette-pointer {
            position: absolute;
            top: 0; bottom: 0; left: 50%;
            width: 3px;
            background: #ff4757;
            transform: translateX(-50%);
            z-index: 10;
            box-shadow: 0 0 10px #ff4757;
        }

        .roulette-track {
            display: flex;
            position: absolute;
            left: 0; top: 0; height: 100%;
            align-items: center;
            will-change: transform;
        }

        .roulette-item {
            min-width: 95px;
            height: 95px;
            background: #1e2535;
            border: 1px solid var(--border);
            border-radius: 14px;
            margin: 0 6px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 6px;
        }

        .roulette-item img {
            width: 52px;
            height: 52px;
            object-fit: contain;
        }

        .roulette-item span {
            font-size: 11px;
            margin-top: 4px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 85px;
        }

        /* Сетка всех 18 предметов кейса */
        .case-items-list {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 20px;
            max-height: 280px;
            overflow-y: auto;
            padding-right: 4px;
        }

        .drop-item-preview {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 10px;
            text-align: center;
        }

        .drop-item-preview img {
            width: 50px;
            height: 50px;
            object-fit: contain;
        }

        .drop-item-preview p {
            font-size: 12px;
            margin-top: 6px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .item-price {
            font-size: 11px;
            color: #ffd700;
            margin-top: 2px;
            font-weight: 700;
        }

        .btn-primary {
            width: 100%;
            background: var(--accent);
            color: #fff;
            border: none;
            padding: 16px;
            border-radius: 16px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }

        .btn-primary:active {
            background: var(--accent-hover);
            transform: scale(0.99);
        }

        /* Экран Пополнения */
        .topup-tabs {
            display: flex;
            gap: 6px;
            margin-bottom: 20px;
            background: var(--card-bg);
            padding: 6px;
            border-radius: 16px;
            border: 1px solid var(--border);
        }

        .topup-tab {
            flex: 1;
            padding: 12px;
            text-align: center;
            border-radius: 12px;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            color: var(--text-secondary);
            transition: 0.2s;
        }

        .topup-tab.active {
            background: var(--accent);
            color: #fff;
        }

        .topup-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 20px;
        }

        .input-group {
            margin-bottom: 18px;
        }

        .input-group label {
            display: block;
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 8px;
            font-weight: 600;
        }

        .input-group input {
            width: 100%;
            background: #11151d;
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 16px;
            color: #fff;
            font-size: 18px;
            font-weight: 700;
            outline: none;
        }

        .input-group input:focus {
            border-color: var(--accent);
        }

        .conversion-hint {
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 24px;
            display: flex;
            justify-content: space-between;
            background: #11151d;
            padding: 12px 16px;
            border-radius: 12px;
            border: 1px solid var(--border);
        }

        .conversion-hint strong {
            color: #fff;
        }

        /* Экран Профиля */
        .profile-header {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 24px;
            text-align: center;
            margin-bottom: 20px;
        }

        .profile-avatar {
            width: 75px;
            height: 75px;
            background: var(--accent);
            border-radius: 50%;
            margin: 0 auto 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            font-weight: 800;
            box-shadow: 0 4px 15px rgba(46,166,255,0.4);
        }

        .inventory-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .inventory-item {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 14px;
            text-align: center;
        }

        .inventory-item img {
            width: 65px;
            height: 65px;
            object-fit: contain;
            margin-bottom: 8px;
        }

        .inventory-item .item-name {
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .inventory-item .item-price {
            font-size: 12px;
            color: #ffd700;
        }

        /* Нижнее меню (с синей подсветкой активной вкладки) */
        .nav-bar {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            background: #131722;
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: space-around;
            padding: 12px 0 16px;
            z-index: 90;
        }

        .nav-item {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 12px;
            font-weight: 600;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            cursor: pointer;
            transition: color 0.2s;
        }

        .nav-item svg {
            width: 24px;
            height: 24px;
            fill: currentColor;
        }

        .nav-item.active {
            color: var(--accent);
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Шапка -->
        <div class="header">
            <div class="logo">PANTERACASES</div>
            <div class="balance-badge">
                <span id="user-balance">500</span> ⭐️
            </div>
        </div>

        <!-- ГЛАВНАЯ СТРАНИЦА -->
        <div id="screen-home" class="screen active">
            <div class="section-title">Фирменный кейс</div>
            <div class="cases-grid">
                <div class="case-card" onclick="openCaseModal()">
                    <img src="https://cdn-icons-png.flaticon.com/512/3659/3659898.png" alt="Battery Case">
                    <div class="case-name">Battery Case</div>
                    <div class="case-price">200 ⭐️</div>
                </div>
            </div>
        </div>

        <!-- СТРАНИЦА ПОПОЛНЕНИЯ -->
        <div id="screen-topup" class="screen">
            <div class="section-title">Пополнение баланса</div>
            
            <div class="topup-tabs">
                <div class="topup-tab active" onclick="switchTopupTab('stars', this)">Звезды ⭐️</div>
                <div class="topup-tab" onclick="switchTopupTab('ton', this)">TON 💎</div>
            </div>

            <div class="topup-card">
                <!-- Вкладка Звезды (от 100 и выше) -->
                <div id="topup-content-stars">
                    <div class="input-group">
                        <label>Количество звезд (от 100)</label>
                        <input type="number" id="stars-input" value="200" min="100" oninput="calculateStarsPayment()">
                    </div>
                    <div class="conversion-hint">
                        <span>К реальной оплате:</span>
                        <strong id="stars-cost-rub">~ 400 ₸ / ₽</strong>
                    </div>
                    <button class="btn-primary" onclick="makePayment('stars')">Пополнить звезды</button>
                </div>

                <!-- Вкладка TON (с автоконвертацией 1 TON = 100 звезд) -->
                <div id="topup-content-ton" style="display: none;">
                    <div class="input-group">
                        <label>Количество TON (1 TON = 100 звезд)</label>
                        <input type="number" id="ton-input" value="2" min="0.5" step="0.5" oninput="calculateTonPayment()">
                    </div>
                    <div class="conversion-hint">
                        <span>Вы получите на баланс:</span>
                        <strong id="ton-converted-stars">200 ⭐️</strong>
                    </div>
                    <button class="btn-primary" onclick="makePayment('ton')">Оплатить через TON Connect</button>
                </div>
            </div>
        </div>

        <!-- СТРАНИЦА ПРОФИЛЯ -->
        <div id="screen-profile" class="screen">
            <div class="profile-header">
                <div class="profile-avatar">P</div>
                <h3 id="profile-name">Игрок</h3>
                <p style="color: var(--text-secondary); font-size: 13px; margin-top: 4
