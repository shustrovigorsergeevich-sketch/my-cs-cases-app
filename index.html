<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panteracases</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #0f1218;
            color: #ffffff;
            padding-bottom: 70px;
        }
        /* Постоянная шапка сверху для всех вкладок */
        .app-header {
            text-align: center;
            padding: 16px 16px 8px 16px;
            background: #131720;
            border-bottom: 1px solid #232a3b;
            margin-bottom: 16px;
        }
        .app-header h1 {
            font-size: 20px;
            font-weight: 800;
            color: #f3ba2f;
            letter-spacing: 0.5px;
        }
        .container {
            padding: 0 16px 16px 16px;
        }
        /* Вкладки */
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }
        h2 {
            margin-bottom: 16px;
            font-size: 20px;
            font-weight: 700;
        }
        /* Карточки */
        .card {
            background: #181d28;
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 16px;
            border: 1px solid #232a3b;
        }
        /* Инвентарь */
        .inventory-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }
        .item-card {
            background: #202635;
            border-radius: 12px;
            padding: 12px;
            text-align: center;
            border: 1px solid #2e384d;
        }
        .item-card img {
            width: 70px;
            height: 70px;
            object-fit: contain;
            margin-bottom: 8px;
        }
        .item-name {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
        }
        .btn-action {
            background: #f3ba2f;
            color: #000;
            border: none;
            border-radius: 8px;
            padding: 12px;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            width: 100%;
            margin-top: 8px;
        }
        .input-field, .select-field {
            width: 100%;
            background: #131720;
            border: 1px solid #2e384d;
            border-radius: 8px;
            padding: 12px;
            color: #fff;
            font-size: 15px;
            margin-bottom: 12px;
            outline: none;
        }
        .empty-inventory {
            text-align: center;
            color: #8a96a8;
            padding: 30px;
            font-size: 14px;
            grid-column: span 2;
        }
        /* Кастомный логотип Gram (синий кристалл/ромб со звездой) */
        .gram-icon {
            display: inline-block;
            width: 18px;
            height: 18px;
            background: linear-gradient(135deg, #30A1F5 0%, #0077D4 100%);
            border-radius: 4px;
            text-align: center;
            line-height: 18px;
            color: #fff;
            font-size: 11px;
            font-weight: bold;
            vertical-align: middle;
            margin-right: 2px;
        }
        /* Блоки пополнения */
        .topup-section {
            display: none;
        }
        .topup-section.active {
            display: block;
        }
        /* Нижняя навигация */
        .nav-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 60px;
            background: #131720;
            border-top: 1px solid #232a3b;
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 1000;
        }
        .nav-item {
            background: none;
            border: none;
            color: #8a96a8;
            font-size: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            flex: 1;
        }
        .nav-item span:first-child {
            font-size: 20px;
            margin-bottom: 2px;
        }
        .nav-item.active {
            color: #f3ba2f;
        }
    </style>
</head>
<body>

    <!-- Постоянная вывеска сверху на всех вкладках -->
    <div class="app-header">
        <h1>PANTERACASES</h1>
    </div>

    <!-- Вкладка 1: Профиль (СЛЕВА) -->
    <div id="tab-profile" class="tab-content active container">
        <h2>👤 Профиль</h2>
        <div class="card">
            <p id="profile-username" style="font-size: 18px; font-weight: bold; margin-bottom: 4px;">Загрузка...</p>
            <p id="profile-id-sub" style="color: #8a96a8; font-size: 13px; margin-bottom: 12px;">ID: загрузка...</p>
            <div style="display: flex; gap: 15px; align-items: center;">
                <div>Звёзды: <span id="user-stars-balance" style="color: #f3ba2f; font-weight: bold;">0</span> ⭐</div>
                <div><span class="gram-icon">★</span>Gram: <span id="user-gram-balance" style="color: #30A1F5; font-weight: bold;">0.00</span></div>
            </div>
        </div>

        <h2>🎁 Инвентарь подарков</h2>
        <div class="card">
            <div id="inventory-container" class="inventory-grid">
                <!-- Сюда падают выигранные подарки для вывода -->
                <div class="empty-inventory">Ваш инвентарь пока пуст</div>
            </div>
        </div>
    </div>

    <!-- Вкладка 2: Кейсы (ПО ЦЕНТРУ) -->
    <div id="tab-cases" class="tab-content container">
        <h2>🎁 Каталог кейсов</h2>
        <div class="card" style="text-align: center; padding: 30px;">
            <p style="color: #8a96a8;">Здесь будут отображаться кейсы. Скоро наполним наполнение!</p>
        </div>
    </div>

    <!-- Вкладка 3: Пополнить (СПРАВА) -->
    <div id="tab-up" class="tab-content container">
        <h2>💳 Пополнение баланса</h2>
        
        <div class="card">
            <label style="display: block; margin-bottom: 8px; font-weight: 600; color: #8a96a8; font-size: 13px;">Выберите способ оплаты</label>
            <select id="payment-method-select" class="select-field" onchange="changePaymentMethod()">
                <option value="gram"><span class="gram-icon">★</span> Gram (MIN: 1 GRAM)</option>
                <option value="stars">⭐ Telegram Stars (MIN: 100 STARS)</option>
            </select>

            <!-- Секция Gram -->
            <div id="section-gram" class="topup-section active">
                <input type="number" id="gram-amount-input" class="input-field" placeholder="Минимум 1 GRAM" min="1" step="0.1">
                <button class="btn-action" style="background: #30A1F5; color: #fff;" onclick="payWithCustomGram()">Пополнить через Gram</button>
            </div>

            <!-- Секция Stars -->
            <div id="section-stars" class="topup-section">
                <input type="number" id="stars-amount-input" class="input-field" placeholder="Минимум 100 Stars" min="100" step="1">
                <button class="btn-action" onclick="payWithStarsCustom()">Пополнить звёздами</button>
            </div>
        </div>
    </div>

    <!-- Нижняя навигация: Профиль (слева), Кейсы (по центру), Пополнить (справа) -->
    <div class="nav-bar">
        <button class="nav-item active" onclick="switchTab('profile', this)">
            <span>👤</span>
            <span>Профиль</span>
        </button>
        <button class="nav-item" onclick="switchTab('cases', this)">
            <span>🎁</span>
            <span>Кейсы</span>
        </button>
        <button class="nav-item" onclick="switchTab('up', this)">
            <span>💳</span>
            <span>Пополнить</span>
        </button>
    </div>

    <!-- Подключаем TonConnect SDK для оплаты Gram (TON) -->
    <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>

    <script>
        // =========================================================================
        // 🔑 ВСТАВЬ СВОИ ДАННЫЕ СЮДА (ТОКЕН БОТА И ТВОЙ КОШЕЛЕК)
        // =========================================================================
        const BOT_TOKEN = "8645941945:AAGVQo1e7IWIHA57B5tKSh0hYwR61kx3Nys";          
        const RECIPIENT_ADDRESS = "UQDJZeV0lt18SEQYhcWxpxBjfvAcfrFRMuSWV6R9JirstYXY"; 
        // =========================================================================

        // Инициализация Telegram WebApp
        const tg = window.Telegram.WebApp;
        try {
            tg.expand();
        } catch (e) {}

        // Получение данных пользователя с защитой
        const telegramUser = tg.initDataUnsafe?.user;
        const userId = telegramUser?.id || '7777777';
        const userName = telegramUser?.first_name || 'Panteracases Player';

        document.getElementById('profile-username').innerText = userName;
        document.getElementById('profile-id-sub').innerText = `ID: ${userId}`;

        let userStars = 0;
        let userGram = 0.00;

        function updateBalanceUI() {
            document.getElementById('user-stars-balance').innerText = userStars;
            document.getElementById('user-gram-balance').innerText = userGram.toFixed(2);
        }

        // Функция переключения вкладок
        function switchTab(tabId, element) {
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));

            document.getElementById('tab-' + tabId).classList.add('active');
            element.classList.add('active');
        }

        // Переключение полей оплаты
        function changePaymentMethod() {
            const method = document.getElementById('payment-method-select').value;
            document.getElementById('section-gram').classList.remove('active');
            document.getElementById('section-stars').classList.remove('active');

            if (method === 'gram') {
                document.getElementById('section-gram').classList.add('active');
            } else if (method === 'stars') {
                document.getElementById('section-stars').classList.add('active');
            }
        }

        // Оплата звёздами через Telegram Invoice API
        async function payWithStarsCustom() {
            const amount = parseInt(document.getElementById('stars-amount-input').value);
            if (isNaN(amount) || amount < 100) {
                alert('Минимальная сумма пополнения звёздами — 100 ⭐');
                return;
            }

            if (!telegramUser) {
                alert('Оплата звёздами доступна только внутри Telegram!');
                return;
            }

            try {
                const response = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/createInvoiceLink`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        title: 'Пополнение баланса Panteracases',
                        description: `Пополнение счета на ${amount} Telegram Stars`,
                        payload: `stars_topup_${userId}_${Date.now()}`,
                        currency: 'XTR',
                        prices: [{ label: 'Звёзды', amount: amount }]
                    })
                });

                const data = await response.json();
                if (data.ok && data.result) {
                    tg.openInvoice(data.result, async (status) => {
                        if (status === 'paid') {
                            userStars += amount;
                            updateBalanceUI();
                            alert(`Успешно! Баланс пополнен на ${amount} ⭐️`);
                        } else {
                            alert('Оплата была отменена.');
                        }
                    });
                } else {
                    alert('Ошибка создания счета. Проверь правильность токена бота.');
                }
            } catch (err) {
                console.error(err);
                alert('Произошла ошибка при запросе на оплату.');
            }
        }

        // Инициализация TonConnect
        const tonConnectUI = new TON_CONNECT_UI.TonConnectUI({
            manifestUrl: 'https://raw.githubusercontent.com/ton-connect/docs/main/media/manifest.json',
            buttonRootId: null
        });

        // Оплата Gram (деньги идут на твой кошелёк)
        async function payWithCustomGram() {
            const inputVal = parseFloat(document.getElementById('gram-amount-input').value);
            if (isNaN(inputVal) || inputVal < 1) {
                alert('Минимальная сумма пополнения — 1 GRAM');
                return;
            }

            try {
                if (!tonConnectUI.connected) {
                    await tonConnectUI.openModal();
                    return;
                }

                const nanoAmount = Math.floor(inputVal * 1000000000).toString();

                const transaction = {
                    validUntil: Math.floor(Date.now() / 1000) + 600,
                    messages: [
                        {
                            address: RECIPIENT_ADDRESS,
                            amount: nanoAmount
                        }
                    ]
                };

                const result = await tonConnectUI.sendTransaction(transaction);
                userGram += inputVal;
                updateBalanceUI();
                alert(`Транзакция на ${inputVal} GRAM успешно проведена!`);
                console.log(result);
            } catch (error) {
                console.error('Ошибка Gram:', error);
                alert('Оплата Gram отменена или произошла ошибка.');
            }
        }
    </script>
</body>
</html>
