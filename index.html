<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Gifts Battle</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
  <style>
    :root {
      --bg: #0b0e14;
      --card-bg: #151a23;
      --card-border: #232a36;
      --accent-blue: #0088cc;
      --accent-gold: #ffc107;
      --text-main: #ffffff;
      --text-sub: #8b98a5;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, sans-serif; user-select: none; }
    body { background-color: var(--bg); color: var(--text-main); padding-bottom: 75px; }

    /* Шапка */
    .header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 12px 16px; background: var(--card-bg); border-bottom: 1px solid var(--card-border);
      position: sticky; top: 0; z-index: 50;
    }
    .user-profile { display: flex; align-items: center; gap: 10px; }
    .avatar { width: 36px; height: 36px; border-radius: 50%; background: #2a3444; display: flex; align-items: center; justify-content: center; font-weight: bold; }
    .balance-btn { background: #1c2330; border: 1px solid var(--card-border); padding: 6px 14px; border-radius: 20px; display: flex; align-items: center; gap: 6px; cursor: pointer; }
    .balance-val { color: var(--accent-gold); font-weight: 700; font-size: 14px; }
    .plus-icon { background: var(--accent-blue); color: #fff; width: 18px; height: 18px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; }

    .container { padding: 16px; }
    .page { display: none; }
    .page.active { display: block; }

    /* Карточки подарков */
    .items-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 12px; }
    .nft-card {
      background: var(--card-bg); border: 1px solid var(--card-border);
      border-radius: 14px; padding: 12px; text-align: center; position: relative;
    }
    .nft-card.jackpot { border-color: var(--accent-gold); box-shadow: 0 0 10px rgba(255, 193, 7, 0.2); }
    .nft-img { width: 85px; height: 85px; object-fit: contain; margin-bottom: 8px; border-radius: 8px; }
    .nft-name { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .nft-price { font-size: 12px; color: var(--accent-gold); font-weight: 700; margin-top: 4px; }

    /* Кнопки */
    .action-btns { display: flex; flex-direction: column; gap: 8px; margin: 16px 0; }
    .btn-real { background: var(--accent-blue); color: #fff; border: none; padding: 14px; border-radius: 12px; font-size: 16px; font-weight: 700; cursor: pointer; }
    .btn-demo { background: #222c3c; color: var(--text-sub); border: 1px solid var(--card-border); padding: 10px; border-radius: 12px; font-size: 14px; font-weight: 600; cursor: pointer; }

    /* Способы пополнения */
    .pay-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 14px; }
    .pay-method { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 12px; padding: 12px 6px; text-align: center; cursor: pointer; font-size: 12px; font-weight: 600; }
    .pay-method.selected { border-color: var(--accent-blue); background: #1a2433; }

    /* Рулетка */
    .roulette-wrapper {
      position: relative; width: 100%; height: 130px; background: #0d121a;
      border-radius: 14px; border: 1px solid var(--card-border); overflow: hidden; margin-bottom: 16px; display: none;
    }
    .roulette-center-line {
      position: absolute; top: 0; bottom: 0; left: 50%; width: 2px;
      background: var(--accent-gold); z-index: 10; transform: translateX(-50%);
      box-shadow: 0 0 10px var(--accent-gold);
    }
    .roulette-track { display: flex; align-items: center; position: absolute; top: 15px; left: 0; will-change: transform; }
    .roulette-item {
      min-width: 100px; height: 100px; margin: 0 5px; background: var(--card-bg);
      border: 1px solid var(--card-border); border-radius: 12px; display: flex;
      flex-direction: column; align-items: center; justify-content: center; padding: 6px;
    }
    .roulette-item img { width: 55px; height: 55px; object-fit: contain; }
    .roulette-item span { font-size: 10px; margin-top: 4px; font-weight: 600; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; width: 90px; }

    /* Нижняя навигация */
    .navbar {
      position: fixed; bottom: 0; left: 0; right: 0; height: 60px;
      background: var(--card-bg); border-top: 1px solid var(--card-border);
      display: flex; justify-content: space-around; align-items: center; z-index: 100;
    }
    .nav-item { display: flex; flex-direction: column; align-items: center; color: var(--text-sub); font-size: 11px; font-weight: 600; cursor: pointer; }
    .nav-item.active { color: var(--accent-blue); }
  </style>
</head>
<body>

  <div class="header">
    <div class="user-profile">
      <div class="avatar" id="user-avatar">👤</div>
      <div>
        <div style="font-weight: 700; font-size: 14px;" id="user-name">Игрок</div>
        <div style="font-size: 11px; color: var(--text-sub);">Gifts Battle</div>
      </div>
    </div>
    <div class="balance-btn" onclick="openDepositPage()">
      <span class="balance-val" id="balance-val">0.00 TON</span>
      <div class="plus-icon">+</div>
    </div>
  </div>

  <div class="container">
    
    <!-- Главная: Кейсы -->
    <div id="page-cases" class="page active">
      <div style="text-align:center; background: var(--card-bg); padding: 16px; border-radius: 16px; border: 1px solid var(--card-border);">
        <h2 style="font-size: 20px; margin-bottom: 8px;">Кейс «Новичок»</h2>
        <div style="font-size: 50px; margin-bottom: 10px;">📦</div>

        <div class="roulette-wrapper" id="roulette">
          <div class="roulette-center-line"></div>
          <div class="roulette-track" id="roulette-track"></div>
        </div>

        <div class="action-btns" id="action-btns">
          <button class="btn-real" onclick="startSpin(false)">Открыть за 7.50 TON</button>
          <button class="btn-demo" onclick="startSpin(true)">Демо (Бесплатно)</button>
        </div>
      </div>

      <div style="margin-top: 20px; font-weight: 700;">📦 Что в кейсе?</div>
      <div class="items-grid" id="items-grid"></div>
    </div>

    <!-- Раздел Пополнения -->
    <div id="page-deposit" class="page">
      <h3 style="margin-bottom: 8px;">Пополнение баланса</h3>
      <div style="font-size: 12px; color: var(--text-sub); margin-bottom: 12px;">Выберите способ оплаты:</div>

      <div class="pay-grid">
        <div class="pay-method selected" data-type="ton" onclick="selectPayMethod(this)">💎 TON</div>
        <div class="pay-method" data-type="stars" onclick="selectPayMethod(this)">⭐ Stars</div>
        <div class="pay-method" data-type="sbp" onclick="selectPayMethod(this)">💳 СБП</div>
        <div class="pay-method" data-type="card" onclick="selectPayMethod(this)">💳 Visa / MIR</div>
        <div class="pay-method" data-type="usdt" onclick="selectPayMethod(this)">🪙 USDT</div>
        <div class="pay-method" data-type="btc" onclick="selectPayMethod(this)">₿ Bitcoin</div>
      </div>

      <div style="margin-top: 16px; background: var(--card-bg); padding: 14px; border-radius: 12px; border: 1px solid var(--card-border);">
        <div id="ton-connect-btn-container" style="margin-bottom: 12px; display: flex; justify-content: center;"></div>
        <div style="font-size: 12px; color: var(--text-sub); margin-bottom: 6px;">Сумма пополнения (TON)</div>
        <input type="number" id="deposit-amount" placeholder="Введите сумму..." style="width:100%; padding: 12px; background: #0d121a; border: 1px solid var(--card-border); color: #fff; border-radius: 8px; margin-bottom: 12px; outline: none; font-size: 15px;">
        <button class="btn-real" style="width: 100%;" onclick="processRealDeposit()">Пополнить баланс</button>
      </div>
    </div>

    <!-- Инвентарь -->
    <div id="page-inventory" class="page">
      <h3>🎒 Мой Инвентарь</h3>
      <div id="inventory-list" style="color: var(--text-sub); text-align: center; margin-top: 30px;">
        Ваш инвентарь пуст.
      </div>
    </div>

  </div>

  <div class="navbar">
    <div class="nav-item active" id="nav-cases" onclick="switchTab('cases', this)"><div>📦</div>Кейсы</div>
    <div class="nav-item" id="nav-inventory" onclick="switchTab('inventory', this)"><div>🎒</div>Инвентарь</div>
    <div class="nav-item" id="nav-deposit" onclick="switchTab('deposit', this)"><div>💳</div>Пополнение</div>
  </div>

  <script>
    const tg = window.Telegram ? window.Telegram.WebApp : null;
    let balance = 0.00;
    let selectedMethod = 'ton';

    const MY_TON_WALLET = "EQB...УКАЖИТЕ_ВАШ_TON_КОШЕЛЕК";

    // Список предметов с указанием путей к локальным файлам
    const caseItems = [
      { name: "Westside Sign", price: 105.99, img: "images/westside.png", weight: 1, rare: true },
      { name: "B-Day Candle", price: 3.00, img: "images/candle.png", weight: 5 },
      { name: "Spiced Wine", price: 2.99, img: "images/wine.png", weight: 10 },
      { name: "Party Sparkler", price: 2.50, img: "images/sparkler.png", weight: 25 },
      { name: "Jester Hat", price: 2.50, img: "images/jester.png", weight: 30 },
      { name: "Xmas Stocking", price: 2.07, img: "images/stocking.png", weight: 80 },
      { name: "Candy Cane", price: 2.00, img: "images/candy.png", weight: 120 },
      { name: "Instant Ramen", price: 2.00, img: "images/ramen.png", weight: 140 },
      { name: "Chill Flame", price: 1.80, img: "images/flame.png", weight: 180 },
      { name: "Ice Cream", price: 1.80, img: "images/icecream.png", weight: 180 }
    ];

    function getRandomWeightedItem() {
      const totalWeight = caseItems.reduce((acc, item) => acc + item.weight, 0);
      let random = Math.random() * totalWeight;
      for (let item of caseItems) {
        if (random < item.weight) return item;
        random -= item.weight;
      }
      return caseItems[caseItems.length - 1];
    }

    const tonConnectUI = new TON_CONNECT_UI.TonConnectUI({
  manifestUrl: 'https://shustrovigorsergeevich-sketch.github.io/my-cs-cases-app/tonconnect-manifest.json',
  buttonRootId: 'ton-connect-btn-container'
});
    

    function renderItemsGrid() {
      const grid = document.getElementById('items-grid');
      grid.innerHTML = '';
      caseItems.forEach(item => {
        const card = document.createElement('div');
        card.className = `nft-card ${item.rare ? 'jackpot' : ''}`;
        card.innerHTML = `
          <img src="${item.img}" class="nft-img" alt="${item.name}">
          <div class="nft-name">${item.name}</div>
          <div class="nft-price">${item.price.toFixed(2)} TON</div>
        `;
        grid.appendChild(card);
      });
    }

    function switchTab(tab, el) {
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
      document.getElementById(`page-${tab}`).classList.add('active');
      if (el) el.classList.add('active');
    }

    function openDepositPage() {
      switchTab('deposit', document.getElementById('nav-deposit'));
    }

    function selectPayMethod(el) {
      document.querySelectorAll('.pay-method').forEach(m => m.classList.remove('selected'));
      el.classList.add('selected');
      selectedMethod = el.getAttribute('data-type');
    }

    async function processRealDeposit() {
      const amount = parseFloat(document.getElementById('deposit-amount').value);
      if (isNaN(amount) || amount <= 0) {
        alert("Укажите сумму пополнения!");
        return;
      }

      if (selectedMethod === 'ton') {
        if (!tonConnectUI.connected) {
          alert("Подключите кошелёк через кнопку выше!");
          return;
        }

        const userId = tg && tg.initDataUnsafe && tg.initDataUnsafe.user ? tg.initDataUnsafe.user.id : "guest";

        const transaction = {
          validUntil: Math.floor(Date.now() / 1000) + 600,
          messages: [
            {
              address: MY_TON_WALLET,
              amount: (amount * 1000000000).toString(),
              payload: btoa(`deposit_${userId}`)
            }
          ]
        };

        try {
          await tonConnectUI.sendTransaction(transaction);
          alert("Транзакция отправлена в кошелек!");
        } catch (e) {
          alert("Оплата была отменена.");
        }
      } else {
        alert("Запрос перенаправлен на обработку.");
      }
    }

    function startSpin(isDemo) {
      const CASE_PRICE = 7.50;

      if (!isDemo && balance < CASE_PRICE) {
        alert("Недостаточно средств на балансе!");
        openDepositPage();
        return;
      }

      if (!isDemo) {
        balance -= CASE_PRICE;
        document.getElementById('balance-val').innerText = balance.toFixed(2) + ' TON';
      }

      document.getElementById('action-btns').style.display = 'none';
      const roulette = document.getElementById('roulette');
      const track = document.getElementById('roulette-track');
      
      roulette.style.display = 'block';
      track.style.transition = 'none';
      track.style.transform = 'translateX(0px)';

      let spinList = [];
      for (let i = 0; i < 35; i++) {
        spinList.push(getRandomWeightedItem());
      }

      const winningItem = spinList[28];

      track.innerHTML = '';
      spinList.forEach(item => {
        const div = document.createElement('div');
        div.className = 'roulette-item';
        div.innerHTML = `<img src="${item.img}"><span>${item.name}</span>`;
        track.appendChild(div);
      });

      setTimeout(() => {
        const itemWidth = 110;
        const stopPosition = -(28 * itemWidth - (roulette.offsetWidth / 2) + (itemWidth / 2));
        track.style.transition = 'transform 4s cubic-bezier(0.05, 0.9, 0.1, 1)';
        track.style.transform = `translateX(${stopPosition}px)`;
      }, 50);

      setTimeout(() => {
        alert(`Вы выбили ${winningItem.name} за ${winningItem.price.toFixed(2)} TON!`);

        roulette.style.display = 'none';
        document.getElementById('action-btns').style.display = 'flex';
      }, 4300);
    }

    window.onload = function() {
      if (tg) {
        tg.expand();
        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
          document.getElementById('user-name').innerText = tg.initDataUnsafe.user.first_name;
        }
      }
      renderItemsGrid();
    };
  </script>
</body>
</html>
